# Despliegue en Render: define el servicio web, cómo se compila y cómo arranca.
# Al iniciar aplica primero las migraciones (prisma/deploy.js) y luego levanta el servidor.
# "sync: false" significa que el valor se carga en el panel de Render y no aquí.
services:
  - type: web
    name: contentsync-app
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build:cloud
    startCommand: node prisma/deploy.js && node dist/main.js
    # Render consulta esta ruta para saber si el servicio está funcionando.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Secretos: se cargan en el panel de Render, nunca en este archivo.
      # El servidor no arranca en producción si falta alguno de los tres primeros.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      # Fotos y videos: sin S3 quedan en el disco de Render, que se borra al reiniciar.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Supabase Free admite hasta 50 MB por archivo.
      - key: UPLOAD_MAX_MB
        value: "50"
      # Correo: remitente visible y transportes de envío.
      - key: MAIL_SENDER_ADDRESS
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: GMAIL_HTTPS_WEBHOOK_URL
        sync: false
      - key: GMAIL_WEBHOOK_SECRET
        sync: false
      # Inicio de sesión con Google, Facebook y GitHub.
      - key: GOOGLE_AUTH_CLIENT_ID
        sync: false
      - key: FACEBOOK_AUTH_APP_ID
        sync: false
      - key: FACEBOOK_AUTH_APP_SECRET
        sync: false
      - key: GITHUB_AUTH_CLIENT_ID
        sync: false
      - key: GITHUB_AUTH_CLIENT_SECRET
        sync: false
