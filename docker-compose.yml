version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: contentsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contentsync
      POSTGRES_PASSWORD: contentsync_secret
      POSTGRES_DB: contentsync_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contentsync -d contentsync_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contentsync-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: contentsync-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contentsync-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://contentsync:contentsync_secret@postgres:5432/contentsync_db?schema=public
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
  minio_data:
