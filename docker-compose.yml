# Uso: copiá .env.example a .env, definí los secretos y ejecutá `docker compose up -d --build`.
# MinIO es opcional: `docker compose --profile s3 up -d` (por defecto los videos quedan en el volumen uploads_data).
services:
  mysql:
    image: mysql:8.4
    container_name: contentsync-mysql
    restart: unless-stopped
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-contentsync}
      MYSQL_USER: ${MYSQL_USER:-contentsync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definí MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en .env}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: contentsync-minio
    profiles: ['s3']
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contentsync-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-contentsync}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-contentsync}
      UPLOAD_DIR: /app/uploads
    ports:
      - '3000:3000'
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  minio_data:
  uploads_data:
