name: ContentSync CI — Backend & Android APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend (NestJS + Prisma + Unit & E2E Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (3NF Schema)
        run: npx prisma generate

      - name: Build NestJS Backend
        run: npm run build

      - name: Run Unit Tests
        run: npm test

      - name: Run API Integration (E2E) Tests
        run: npm run test:e2e

  android-ci:
    name: Android App (Kotlin + Compose + Unit Tests + APK Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Signed Debug & Release APKs
        run: gradle assembleDebug assembleRelease

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contentsync-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
