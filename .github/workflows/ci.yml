name: ContentSync CI — Backend & Android APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend (NestJS + Prisma + Unit & E2E Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: contentsync_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci_root@127.0.0.1:3306/contentsync_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (3NF Schema)
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Apply MySQL migrations from scratch
        run: npx prisma migrate deploy

      - name: Verify migrations match the Prisma schema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Build NestJS Backend
        run: npm run build

      - name: Run Unit Tests
        run: npm test

      - name: Run API Integration (E2E) Tests
        run: npm run test:e2e

  android-ci:
    name: Android App (WebView + APK Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Debug & Release APKs
        run: gradle assembleDebug assembleRelease

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contentsync-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
