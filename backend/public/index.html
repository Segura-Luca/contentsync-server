    function renderAuthGate() {
      return `
        <div class="auth-split stage-enter">
          <section class="auth-manifesto">
            <div style="display:flex;flex-direction:column;gap:16px;">
              <div class="eyebrow">CONTENTSYNC</div>
              <h1 style="font-size:clamp(28px, 3.3vw, 42px);font-weight:700;">
                Tu agencia y tus clientes,<br/>en un solo lugar.
              </h1>
              <p style="color:var(--text-secondary);max-width:50ch;font-size:15px;">
                Compartí el cronograma de cada semana, mostrá cada reel, carrusel o historia, y recibí comentarios y aprobaciones sin perderte entre chats y correos.
              </p>
              ${renderHowItWorks()}
            </div>
          </section>

          <section class="auth-console-wrap">
            <div style="width:100%;max-width:440px;background:var(--stage);border:1px solid var(--hairline);border-radius:5px;padding:24px;display:flex;flex-direction:column;gap:12px;">
              ${state.authVerifyReg ? renderVerifyRegistrationConsole() : (state.authRecover ? renderRecoveryConsole() : renderLoginRegisterConsole())}
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // PANTALLA 1: CRONOGRAMA SEMANAL (LUNES A DOMINGO, BLOQUES, REVISIÓN Y CONFIRMACIÓN)
    // =========================================================================
    function renderSchedulesScreen() {
      const role = state.session.role;
      const isClient = role === 'CLIENTE';

      if (isClient && state.pendingConfirmation) {
        return `
          <div class="page-pad">
            <div style="border:1px solid var(--tally-warn);background:var(--stage);border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:14px;">
              <div class="eyebrow" style="color:var(--tally-warn);">CONFIRMACIÓN PENDIENTE</div>
              <h2 style="font-size:22px;font-weight:700;">Confirmá tu identidad para ver tu cronograma</h2>
              <p style="color:var(--text-secondary);max-width:60ch;">
                Por tu seguridad, antes de mostrarte contenido o vincular tu cuenta con <strong>${esc(state.pendingConfirmation.agency?.name || 'la agencia')}</strong>, necesitamos que presiones <strong>"Sí, soy yo"</strong> arriba o acá mismo.
              </p>
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">
                <button class="btn btn-signal" onclick="respondClientIdentity('${state.pendingConfirmation.id}', 'ACCEPT')">✓ Sí, soy yo — Activar mi cuenta</button>
                <button class="btn btn-fault" onclick="respondClientIdentity('${state.pendingConfirmation.id}', 'REJECT')">✕ No soy yo — Rechazar</button>
              </div>
            </div>
          </div>
        `;
      }

      const confirmedClients = state.clients.filter(c => c.confirmationStatus === 'CONFIRMED');
      const clientSchedules = state.schedules.filter(s => s.clientId === state.selectedClientId);
      const activeSchedule = getActiveSchedule();
      const items = activeSchedule?.items || [];

      const approvedCount = items.filter(b => b.reviewStatus === 'APPROVED').length;
      const reviewCount = items.filter(b => b.reviewStatus === 'IN_REVIEW').length;
      const blockedCount = items.filter(b => b.reviewStatus === 'CHANGES_REQUESTED' || b.reviewStatus === 'REJECTED').length;

      return `
        <div class="plan-page">
          <!-- Cabecera Principal -->
          <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--hairline);">
            <div>
              <div class="eyebrow">${isClient ? 'CRONOGRAMA DE TU MARCA' : 'CRONOGRAMAS DE TUS CLIENTES'}</div>
              <h2 style="font-size:24px;font-weight:700;margin-top:3px;">
                ${isClient ? 'Tu contenido de la semana' : 'Cronograma semanal'}
              </h2>
              <p style="font-size:13px;color:var(--text-secondary);margin-top:3px;">
                ${isClient
                  ? 'Mirá cada pieza, dejá tus comentarios y confirmá la semana cuando todo esté bien.'
                  : 'Armá la semana con bloques de contenido, sumá fotos y videos, y compartilo con tu cliente para que lo revise y lo confirme.'}
              </p>
            </div>

            ${!isClient ? `
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                ${activeSchedule ? `
                  <button class="btn btn-outline" onclick="openDuplicateWeekModal()">
                    ⎘ Duplicar semana
                  </button>
                ` : ''}
                <button class="btn btn-signal" onclick="openNewWeekModal()">
                  + Nueva semana
                </button>
              </div>
            ` : ''}
          </div>

          <!-- Selector de Cliente (Agencia/Admin) -->
          ${!isClient && confirmedClients.length > 0 ? `
            <div class="filter-row">
              <span class="eyebrow" style="margin-right:4px;">CLIENTE:</span>
              ${confirmedClients.map(c => `
                <button class="filter-tab ${state.selectedClientId === c.id ? 'active' : ''}"
                  onclick="state.selectedClientId='${c.id}';syncSelectedScheduleForClient();render();">
                  ${esc(c.companyName)}
                </button>
              `).join('')}
            </div>
          ` : ''}


          ${confirmedClients.length === 0 && !isClient ? `
            <div style="border:1px solid var(--hairline);background:var(--stage);border-radius:5px;padding:28px;">
              <div class="eyebrow">SIN CLIENTES CONFIRMADOS</div>
              <h3 style="font-size:18px;font-weight:600;margin-top:6px;">Agregá y confirmá un cliente para armar su cronograma</h3>
              <p style="color:var(--text-secondary);margin-top:6px;max-width:56ch;">
                Dirigite a la sección Clientes para dar de alta una marca. Una vez que el cliente confirme «Sí, soy yo», podrás crearle sus semanas de Lunes a Viernes.
              </p>
              <button class="btn btn-signal" style="margin-top:14px;" onclick="state.activeTab='accounts';render();">Ir a Clientes →</button>
            </div>
          ` : !activeSchedule ? `
            <div style="border:1px solid var(--hairline);background:var(--stage);border-radius:5px;padding:28px;">
              <div class="eyebrow" style="color:var(--signal-subtle-fg);">CRONOGRAMA</div>
              <h3 style="font-size:18px;font-weight:600;margin-top:6px;">
                ${isClient ? 'Tu agencia todavía no compartió un cronograma' : 'Todavía no hay semanas creadas para este cliente'}
              </h3>
              <p style="color:var(--text-secondary);margin-top:6px;max-width:54ch;">
                ${isClient
                  ? 'Te vamos a avisar apenas tu agencia cargue el contenido de la semana.'
                  : 'Creá la primera semana de lunes a domingo para empezar a cargar el contenido.'}
              </p>
              ${!isClient ? `<button class="btn btn-signal" style="margin-top:14px;" onclick="openNewWeekModal()">+ Crear primera semana →</button>` : ''}
            </div>
          ` : `
            <!-- Barra de Semana Activa + Resumen -->
            <div class="week-toolbar">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <div class="field" style="min-width:260px;">
                  <label>SEMANA SELECCIONADA</label>
                  <select class="input mono" style="padding:7px 10px;font-size:13px;"
                    onchange="state.selectedScheduleId=this.value;render();">
                    ${clientSchedules.map(s => `
                      <option value="${s.id}" ${s.id === activeSchedule.id ? 'selected' : ''}>
                        Lun ${fmtShortDate(s.weekStartDate, 0)} al Dom ${fmtShortDate(s.weekStartDate, 6)} — ${esc(s.title)}
                      </option>
                    `).join('')}
                  </select>
                </div>
                <div>
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <span style="font-weight:700;font-size:16px;">${esc(activeSchedule.title)}</span>
                    ${activeSchedule.duplicatedFrom ? `
                      <span class="badge badge-review" title="Semana creada por duplicación">
                        ⎘ Duplicada de: ${esc(activeSchedule.duplicatedFrom.title)}
                      </span>
                    ` : ''}
                  </div>
                  ${activeSchedule.summaryNotes ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${esc(activeSchedule.summaryNotes)}</div>` : ''}
                </div>
              </div>

              ${!isClient ? `
                <button class="btn btn-signal" onclick="openBlockModal(1, null)">
                  + Agregar bloque
                </button>
              ` : ''}
            </div>

            ${renderScheduleConfirmBar(activeSchedule, isClient, blockedCount)}

            <div class="stats-strip">
              <div class="stat-cell">
                <div class="mono" style="font-size:19px;font-weight:700;">${items.length}</div>
                <div class="eyebrow">BLOQUES EN LA SEMANA</div>
              </div>
              <div class="stat-cell">
                <div class="mono" style="font-size:19px;font-weight:700;color:var(--tally-live);">${approvedCount}</div>
                <div class="eyebrow">APROBADOS</div>
              </div>
              <div class="stat-cell">
                <div class="mono" style="font-size:19px;font-weight:700;color:${blockedCount ? 'var(--tally-warn)' : 'var(--signal-subtle-fg)'};">${blockedCount ? blockedCount : reviewCount}</div>
                <div class="eyebrow">${blockedCount ? 'CON CAMBIOS PEDIDOS' : 'EN REVISIÓN'}</div>
              </div>
              <div class="stat-cell">
                <div class="mono" style="font-size:19px;font-weight:700;">Lun — Dom</div>
                <div class="eyebrow">${fmtShortDate(activeSchedule.weekStartDate, 0)} AL ${fmtShortDate(activeSchedule.weekStartDate, 6)}</div>
              </div>
            </div>

            <!-- CUADRÍCULA DE LUNES A DOMINGO (7 COLUMNAS) -->
            <div class="week-grid">
              ${WEEKDAYS.map((day, idx) => {
                const dayBlocks = items.filter(b => b.dayOfWeek === day.num);
                const dateLabel = fmtShortDate(activeSchedule.weekStartDate, idx);
                return `
                  <section class="day-column" aria-label="${day.full}">
                    <div class="day-col-header">
                      <div>
                        <div class="mono" style="font-weight:700;font-size:13px;color:var(--signal-subtle-fg);">${day.full}</div>
                        <div class="mono" style="font-size:11px;color:var(--text-muted);">${dateLabel}</div>
                      </div>
                      <span class="badge">${dayBlocks.length}</span>
                    </div>

                    <div class="day-blocks-list">
                      ${dayBlocks.length === 0 ? `
                        <div style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px 8px;color:var(--text-muted);font-size:12px;border:1px dashed var(--hairline);border-radius:4px;">
                          Sin bloques cargados para el ${day.full.toLowerCase()}
                        </div>
                      ` : dayBlocks.map(blk => {
                        const wf = workflowMeta(blk.reviewStatus);
                        const media = blk.media || [];
                        const photos = media.filter(m => m.kind === 'IMAGE').length;
                        const videos = media.filter(m => m.kind === 'VIDEO').length;
                        const comments = (blk.comments || []).length;
                        return `
                          <article class="plan-block-card ${sectionColorClass(blk.noteColor || 'AMBER')}" style="${sectionColorStyle(blk.noteColor)}"
                            onclick="state.inspectBlockId='${blk.id}';state.confirmDeleteBlockId=null;render();">
                            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                              <span class="mono" style="font-size:11px;font-weight:700;color:var(--note-fg);">
                                ${esc(contentTypeLabel(blk.contentType)).toUpperCase()}
                              </span>
                              <span class="mono" style="font-size:11px;color:var(--text-muted);">
                                ${esc(blk.plannedTime || '18:00')} hs
                              </span>
                            </div>

                            <div style="font-weight:700;font-size:13.5px;line-height:1.3;color:var(--text-primary);">
                              ${esc(blk.blockTitle)}
                            </div>

                            ${blk.notes ? `
                              <div style="font-size:12px;color:var(--text-secondary);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">
                                ${esc(blk.notes)}
                              </div>
                            ` : ''}

                            <div style="margin-top:4px;padding-top:7px;border-top:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;">
                              <span class="mono" style="font-size:11px;color:var(--text-secondary);">
                                ${[
                                  photos ? photos + (photos === 1 ? ' foto' : ' fotos') : '',
                                  videos ? videos + (videos === 1 ? ' video' : ' videos') : '',
                                  comments ? comments + (comments === 1 ? ' comentario' : ' comentarios') : ''
                                ].filter(Boolean).join(' · ') || 'Sin archivos todavía'}
                              </span>
                              <span style="display:flex;gap:4px;flex-wrap:wrap;">
                                <span class="badge ${blk.productionStatus === 'UPLOADED' ? 'badge-live' : ''}" style="font-size:10px;padding:1px 5px;">${productionLabel(blk.productionStatus).toUpperCase()}</span>
                                <span class="badge ${wf.cls}" style="font-size:10px;padding:1px 5px;">${wf.label}</span>
                              </span>
                            </div>
                          </article>
                        `;
                      }).join('')}
                    </div>

                    ${!isClient ? `
                      <div class="day-col-footer">
                        <button class="btn btn-outline" style="width:100%;padding:7px 8px;font-size:11px;"
                          onclick="openBlockModal(${day.num}, null)">
                          + Agregar bloque
                        </button>
                      </div>
                    ` : ''}
                  </section>
                `;
              }).join('')}
            </div>
          `}
        </div>

        ${state.showNewWeekModal ? renderNewWeekModal() : ''}
        ${state.showDuplicateModal ? renderDuplicateWeekModal() : ''}
        ${state.blockModalOpen ? renderBlockEditorModal() : ''}
        ${state.inspectBlockId ? renderBlockInspectorModal() : ''}
        ${state.inspectBlockId && state.reviewConfirm ? renderReviewConfirm() : ''}
      `;
    }

    function renderScheduleConfirmBar(sched, isClient, blockedCount) {
      const hasItems = (sched.items || []).length > 0;
      if (sched.status === 'APPROVED') {
        return `
          <div style="border:1px solid var(--tally-live);background:var(--tally-live-bg);padding:11px 14px;border-radius:5px;font-size:13.5px;font-weight:600;color:var(--tally-live);">
            ✓ Cronograma confirmado${sched.confirmedByUser ? ' por ' + esc(sched.confirmedByUser.fullName) : ''}${sched.confirmedAt ? ' · ' + fmtDateTimeHuman(sched.confirmedAt) : ''}
          </div>
        `;
      }
      if (!isClient) {
        return `
          <div style="border:1px solid var(--hairline);background:var(--stage);padding:11px 14px;border-radius:5px;font-size:13px;color:var(--text-secondary);">
            ${blockedCount
              ? `El cliente pidió cambios en ${blockedCount === 1 ? 'un bloque' : blockedCount + ' bloques'}. Al editarlos, vuelven a revisión.`
              : (hasItems ? 'Esperando que el cliente revise y confirme la semana.' : 'Agregá el contenido de la semana para que el cliente pueda revisarlo.')}
          </div>
        `;
      }
      if (!hasItems) return '';
      return `
        <div style="border:1px solid var(--signal-subtle-fg);background:var(--signal-subtle-bg);padding:12px 14px;border-radius:5px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
          <div style="font-size:13.5px;max-width:60ch;">
            ${blockedCount
              ? `Pediste cambios en ${blockedCount === 1 ? 'un bloque' : blockedCount + ' bloques'}: vas a poder confirmar cuando tu agencia los resuelva.`
              : '¿Revisaste todo? Al confirmar, lo que siga en revisión queda aprobado.'}
          </div>
          ${blockedCount ? '' : (state.confirmScheduleAsk ? `
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <span style="font-size:13px;font-weight:600;">¿Confirmás toda la semana?</span>
              <button class="btn btn-signal" onclick="confirmActiveSchedule()">Sí, confirmar</button>
              <button class="btn btn-outline" onclick="state.confirmScheduleAsk=false;render();">Cancelar</button>
            </div>
          ` : `
            <button class="btn btn-signal" onclick="state.confirmScheduleAsk=true;render();">✓ Confirmar cronograma</button>
          `)}
        </div>
      `;
    }

    function renderNewWeekModal() {
      return `
        <div class="modal-backdrop" onclick="if(event.target===this){state.showNewWeekModal=false;render();}">
          <div class="modal-panel" style="max-width:480px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div class="eyebrow">NUEVO CRONOGRAMA</div>
                <h3 style="font-size:18px;font-weight:700;">Crear semana de lunes a domingo</h3>
              </div>
              <button class="btn btn-outline" style="padding:4px 9px;" onclick="state.showNewWeekModal=false;render();">✕</button>
            </div>

            <div class="field">
              <label>Fecha del lunes de inicio</label>
              <input class="input mono" type="date" value="${esc(state.newWeekStart)}"
                onchange="state.newWeekStart=this.value;render();" />
            </div>

            <div class="field">
              <label>Título de la semana</label>
              <input class="input" value="${esc(state.newWeekTitle)}"
                oninput="state.newWeekTitle=this.value" />
            </div>

            <div class="field">
              <label>Objetivo o nota general para el cliente (opcional)</label>
              <textarea class="input" rows="2"
                oninput="state.newWeekNotes=this.value">${esc(state.newWeekNotes)}</textarea>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:10px;">
              <button class="btn btn-outline" onclick="state.showNewWeekModal=false;render();">Cancelar</button>
              <button class="btn btn-signal" onclick="submitNewWeek()">Crear semana →</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderDuplicateWeekModal() {
      const sched = state.schedules.find(s => s.id === state.dupSourceId);
      if (!sched) return '';
      const clientWeeks = state.schedules.filter(s => s.clientId === sched.clientId);
      return `
        <div class="modal-backdrop" onclick="if(event.target===this){state.showDuplicateModal=false;render();}">
          <div class="modal-panel" style="max-width:520px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div class="eyebrow">DUPLICAR SEMANA</div>
                <h3 style="font-size:18px;font-weight:700;">Elegí qué semana copiar</h3>
              </div>
              <button class="btn btn-outline" style="padding:4px 9px;" onclick="state.showDuplicateModal=false;render();">✕</button>
            </div>

            <div class="field">
              <label>Semana a duplicar</label>
              <select id="dup-source" class="input" onchange="setDuplicateChoice('dupSourceId', this.value)">
                ${clientWeeks.map(week => `
                  <option value="${esc(week.id)}" ${week.id === sched.id ? 'selected' : ''}>
                    ${esc(fmtShortDate(week.weekStartDate))} al ${esc(fmtShortDate(week.weekStartDate, 6))} · ${esc(week.title)} (${(week.items || []).length} bloques)
                  </option>
                `).join('')}
              </select>
            </div>

            <p style="font-size:13px;color:var(--text-secondary);">
              Se copiarán los <strong>${(sched.items || []).length} bloques</strong> con sus colores, textos y horarios a la nueva semana.
            </p>

            <div class="field">
              <label>Lunes de la semana destino</label>
              <input class="input mono" type="date" value="${esc(state.dupTargetStart)}"
                onchange="setDuplicateChoice('dupTargetStart', this.value)" />
            </div>

            <div class="field">
              <label>Nombre para la nueva semana</label>
              <input class="input" value="${esc(state.dupTitle)}" oninput="state.dupTitle=this.value;state.dupTitleEdited=true;" />
            </div>

            <label style="display:flex;align-items:flex-start;gap:9px;cursor:pointer;padding:10px 12px;border:1px solid var(--hairline);background:var(--canvas);border-radius:4px;">
              <input type="checkbox" style="margin-top:3px;" ${state.dupIncludeMedia ? 'checked' : ''}
                onchange="state.dupIncludeMedia=this.checked;render();" />
              <div>
                <div style="font-weight:600;font-size:13px;">Copiar también las fotos y los videos</div>
                <div style="font-size:12px;color:var(--text-muted);">Si lo desmarcás, se copian solo los bloques, con sus textos.</div>
              </div>
            </label>

            <div style="display:flex;justify-content:flex-end;gap:10px;">
              <button class="btn btn-outline" onclick="state.showDuplicateModal=false;render();">Cancelar</button>
              <button class="btn btn-signal" onclick="submitDuplicateWeek()">⎘ Duplicar semana</button>
            </div>
          </div>
        </div>
      `;
    }

    /** Cada etiqueta es un color con nombre, creado en Ideas de contenido. */
    function renderBlockLabelPicker() {
      const selected = state.ideaSections.find(sec => sec.color.toLowerCase() === String(state.blkColor).toLowerCase());
      const swatch = (color, label, active) => `
        <button type="button" class="swatch-btn ${sectionColorClass(color)} ${active ? 'active' : ''}" style="${sectionColorStyle(color)}"
          onclick="state.blkColor='${esc(color)}';render();">
          <span class="swatch-dot"></span>
          <span>${esc(label)}</span>
        </button>
      `;
      return `
        <div class="swatch-row">
          ${state.ideaSections.map(sec => swatch(sec.color, sec.name, sec.id === selected?.id)).join('')}

    /** Las secciones nuevas guardan un color elegido; las anteriores, uno de la paleta. */
    function isHexColor(color) {
      return /^#[0-9a-f]{6}$/i.test(color || '');
    }

    function sectionColorClass(color) {
      return isHexColor(color) ? '' : 'color-' + esc(color || 'LIME');
    }

    /** Aclara u oscurece el color elegido lo justo para que el texto se lea en el tema activo. */
    function readableNoteColor(hex) {
      const light = state.theme === 'light';
      const background = light ? [255, 255, 255] : [27, 31, 41];
      const target = light ? 0 : 255;
      const luminance = rgb => {
        const [r, g, b] = rgb.map(v => {
          const c = v / 255;
          return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      };
      const contrast = (a, b) => {
        const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
        return (hi + 0.05) / (lo + 0.05);
      };
      let rgb = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
      for (let i = 0; i < 20 && contrast(rgb, background) < 4.5; i++) {
        rgb = rgb.map(v => v + (target - v) * 0.12);
      }
      return '#' + rgb.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
    }

    function sectionColorStyle(color) {
      return isHexColor(color) ? `--note-dot:${color};--note-fg:${readableNoteColor(color)};--note-bg:${color}26;` : '';
    }

      const r = await apiFetch(`/idea-proposals/${proposalId}/accept`, {

        body: JSON.stringify({ sectionId })

        setBanner(friendlyError(r.data, r.status), true);
        return;

      await hydrateFromApi();
      setBanner('Propuesta aceptada: ya está en tus ideas. Le avisamos al cliente.');
    }

              <label for="proposal-url">Enlace de referencia (opcional)</label>

              <div style="border:1px solid var(--hairline);background:var(--stage);border-radius:5px;padding:14px;display:flex;flex-direction:column;gap:5px;">

                  <span class="badge ${statusBadge[p.status].cls}">${statusBadge[p.status].label}</span>

                <div style="font-size:13px;color:var(--text-secondary);white-space:pre-wrap;overflow-wrap:anywhere;">${esc(p.content)}</div>
                ${renderProposalLink(p.referenceUrl)}

          </div>
        </div>

    function renderIdeasScreen() {
      const confirmedClients = state.clients.filter(c => c.confirmationStatus === 'CONFIRMED');
      const q = state.ideaSearch.trim().toLowerCase();

      const filteredIdeas = state.ideas.filter(idea => {
        const matchSec = state.ideaSectionFilter === 'ALL' || idea.sectionId === state.ideaSectionFilter;
        const matchCl =
          state.ideaClientFilter === 'ALL' ||
          (state.ideaClientFilter === 'GENERAL' && !idea.clientId) ||
          idea.clientId === state.ideaClientFilter;
        const matchQ =
          !q ||
          idea.title.toLowerCase().includes(q) ||
          idea.content.toLowerCase().includes(q) ||
          (idea.section?.name || '').toLowerCase().includes(q);
        return matchSec && matchCl && matchQ;
      });

      const activeSectionObj = state.ideaSections.find(s => s.id === state.ideaSectionFilter) || null;

      return `
        <div class="page-pad" style="display:flex;flex-direction:column;gap:18px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--hairline);">
            <div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="eyebrow">BANCO CREATIVO</span>
                <span class="badge badge-review">🔒 PRIVADO DE TU AGENCIA</span>
              </div>

              <p style="font-size:13px;color:var(--text-secondary);margin-top:3px;">
                Guardá guiones, ganchos y formatos divididos en tus propias secciones (Entretenimiento, Educativo, Venta y más). Tus clientes nunca ven este espacio.
              </p>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-outline" onclick="state.showNewSectionForm=!state.showNewSectionForm;state.newSectionColor=nextSectionColor();render();">
                ${state.showNewSectionForm ? 'Cerrar' : '+ Nuevo color'}

              <button class="btn btn-signal" onclick="openIdeaModal(null)">

              </button>

          <!-- Formulario rápido para crear Sección personalizada -->
          ${state.showNewSectionForm ? `
            <div class="feedback-enter" style="border:1px solid var(--border-strong);background:var(--stage);border-radius:5px;padding:15px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;">
              <div class="field">
                <label for="new-section-color">Color</label>
                <input id="new-section-color" type="color" value="${esc(state.newSectionColor)}"
                  style="width:64px;height:40px;padding:3px;background:var(--canvas);border:1px solid var(--border-strong);border-radius:4px;cursor:pointer;"
                  oninput="state.newSectionColor=this.value" />
              </div>
              <div class="field" style="flex:1;min-width:210px;">
                <label for="new-section-name">Nombre</label>
                <input id="new-section-name" class="input" maxlength="100"
                  value="${esc(state.newSectionName)}" oninput="state.newSectionName=this.value" />
              </div>
              <button class="btn btn-signal" onclick="submitNewIdeaSection()">Guardar color</button>
            </div>
          ` : ''}

          <!-- Pestañas de Secciones Creadas por la Agencia -->
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
            <div class="filter-row">
              <button class="filter-tab ${state.ideaSectionFilter === 'ALL' ? 'active' : ''}"
                onclick="state.ideaSectionFilter='ALL';state.confirmDeleteSectionId=null;render();">
                Todas (${state.ideas.length})
              </button>
              <button id="tab-proposals" class="filter-tab ${state.ideaSectionFilter === 'PROPOSALS' ? 'active' : ''}"
                onclick="state.ideaSectionFilter='PROPOSALS';state.confirmDeleteSectionId=null;render();">
                Propuestas de clientes (${pendingProposals().length})
              </button>
              ${state.ideaSections.map(sec => {
                const count = state.ideas.filter(i => i.sectionId === sec.id).length;
                return `
                  <button class="filter-tab ${state.ideaSectionFilter === sec.id ? 'active' : ''}"
                    onclick="state.ideaSectionFilter='${sec.id}';state.confirmDeleteSectionId=null;render();">
                    <span class="${sectionColorClass(sec.color)}" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--note-dot, var(--note-fg));${sectionColorStyle(sec.color)}"></span>${esc(sec.name)} (${count})
                  </button>
                `;
              }).join('')}
            </div>

            ${activeSectionObj ? (
              state.confirmDeleteSectionId === activeSectionObj.id ? `
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-size:12px;color:var(--tally-fault);">¿Eliminar sección «${esc(activeSectionObj.name)}» y sus ideas?</span>
                  <button class="btn btn-fault" style="padding:4px 9px;" onclick="deleteIdeaSectionConfirmed('${activeSectionObj.id}')">Sí, eliminar</button>
                  <button class="btn btn-outline" style="padding:4px 9px;" onclick="state.confirmDeleteSectionId=null;render();">No</button>
                </div>
              ` : `
                <button class="btn btn-outline" style="padding:5px 10px;font-size:11px;"
                  onclick="state.confirmDeleteSectionId='${activeSectionObj.id}';render();">
                  Eliminar sección «${esc(activeSectionObj.name)}»
                </button>
              `
            ) : ''}
          </div>

          <!-- Buscador y Filtro por Marca -->
          ${state.ideaSectionFilter === 'PROPOSALS' ? renderAgencyProposals() : `
          <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:10px;">
            <input class="input" aria-label="Buscar ideas"
              value="${esc(state.ideaSearch)}" oninput="state.ideaSearch=this.value;render();" />
            <select class="input" onchange="state.ideaClientFilter=this.value;render();">
              <option value="ALL" ${state.ideaClientFilter === 'ALL' ? 'selected' : ''}>Todas las marcas y generales</option>
              <option value="GENERAL" ${state.ideaClientFilter === 'GENERAL' ? 'selected' : ''}>Solo ideas generales de la agencia</option>
              ${confirmedClients.map(c => `
                <option value="${c.id}" ${state.ideaClientFilter === c.id ? 'selected' : ''}>Marca: ${esc(c.companyName)}</option>
              `).join('')}
            </select>
          </div>

          <!-- Grilla de Ideas -->
          ${filteredIdeas.length === 0 ? `
            <div style="border:1px solid var(--hairline);background:var(--stage);border-radius:5px;padding:28px;text-align:center;">
              <div style="font-weight:600;font-size:16px;">No hay ideas que coincidan con este filtro</div>
              <p style="color:var(--text-secondary);font-size:13px;margin-top:4px;">
                Agregá una nueva idea en segundos o limpiá los filtros activos.
              </p>
              <div style="margin-top:12px;display:flex;justify-content:center;gap:8px;">
                <button class="btn btn-outline" onclick="state.ideaSectionFilter='ALL';state.ideaClientFilter='ALL';state.ideaSearch='';render();">Ver todas</button>
                <button class="btn btn-signal" onclick="openIdeaModal(null)">+ Guardar idea</button>
              </div>
            </div>
          ` : `
            <div class="ideas-grid">
              ${filteredIdeas.map(idea => {
                const secColor = idea.section?.color || 'LIME';
                return `
                  <article class="idea-card ${sectionColorClass(secColor)}" style="${sectionColorStyle(secColor)}">
                    <div style="display:flex;flex-direction:column;gap:8px;">
                      <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                        <span class="badge" style="color:var(--note-fg);border-color:var(--note-fg);background:var(--note-bg);">
                          ${esc(idea.section?.name || 'Sección')}
                        </span>
                        <button class="btn btn-outline" style="padding:3px 7px;font-size:11px;"
                          title="${idea.isPinned ? 'Quitar fijado' : 'Fijar arriba'}"
                          onclick="togglePinIdea('${idea.id}', ${Boolean(idea.isPinned)})">
                          ${idea.isPinned ? '📌 Fijada' : '☆ Fijar'}
                        </button>
                      </div>

                      <h3 style="font-size:16px;font-weight:700;line-height:1.3;">${esc(idea.title)}</h3>
                      <p style="font-size:13px;color:var(--text-secondary);line-height:1.48;white-space:pre-wrap;">${esc(idea.content)}</p>

                      ${idea.referenceUrl ? `
                        <a href="${esc(idea.referenceUrl)}" target="_blank" rel="noopener noreferrer"
                           style="font-size:12px;color:var(--signal-subtle-fg);text-decoration:underline;word-break:break-all;">
                          🔗 Ver referencia
                        </a>
                      ` : ''}
                    </div>

                    <div style="padding-top:10px;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:8px;">
                      <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-muted);" class="mono">
                        <span>${idea.client ? esc(idea.client.companyName) : 'General Agencia'}</span>
                      </div>

                      ${state.confirmDeleteIdeaId === idea.id ? `
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--tally-fault-bg);padding:6px 8px;border-radius:4px;">
                          <span style="font-size:12px;color:var(--tally-fault);font-weight:600;">¿Eliminar idea?</span>
                          <div style="display:flex;gap:6px;">
                            <button class="btn btn-fault" style="padding:4px 8px;" onclick="deleteIdeaConfirmed('${idea.id}')">Sí</button>
                            <button class="btn btn-outline" style="padding:4px 8px;" onclick="state.confirmDeleteIdeaId=null;render();">No</button>
                          </div>
                        </div>
                      ` : `
                        <div style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;">
                          <button class="btn btn-signal" style="padding:5px 9px;font-size:11px;"
                            onclick="sendIdeaToPlan('${idea.id}')">
                            Llevar al cronograma →
                          </button>
                          <div style="display:flex;gap:6px;">
                            <button class="btn btn-outline" style="padding:5px 9px;font-size:11px;"
                              onclick='openIdeaModal(${JSON.stringify(idea).replace(/'/g, "&#39;")})'>
                              Editar
                            </button>
                            <button class="btn btn-fault" style="padding:5px 9px;font-size:11px;"
                              onclick="state.confirmDeleteIdeaId='${idea.id}';render();">
                              Eliminar
                            </button>
                          </div>
                        </div>
                      `}
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          `}
          `}
        </div>

        ${state.ideaModalOpen ? renderIdeaModal() : ''}
      `;
    }

    function renderIdeaModal() {
      const confirmedClients = state.clients.filter(c => c.confirmationStatus === 'CONFIRMED');
      return `
        <div class="modal-backdrop" onclick="if(event.target===this){state.ideaModalOpen=false;render();}">
          <div class="modal-panel" style="max-width:560px;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--hairline);">
              <div>
                <div class="eyebrow">${state.acceptingProposalId ? 'PROPUESTA DE UN CLIENTE' : 'IDEA PRIVADA DE AGENCIA'}</div>
                <h3 style="font-size:19px;font-weight:700;">${state.acceptingProposalId ? 'Editar y aceptar' : state.editingIdeaId ? 'Editar idea de contenido' : 'Nueva idea de contenido'}</h3>
              </div>
              <button class="btn btn-outline" style="padding:4px 9px;" onclick="state.ideaModalOpen=false;render();">✕</button>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <div class="field">
                <label>Sección</label>
                <select id="idea-section" class="input" onchange="chooseIdeaFormSection(this.value)">
                  ${state.ideaSections.map(s => `
                    <option value="${s.id}" ${!state.ideaNewSectionOpen && state.ideaFormSectionId === s.id ? 'selected' : ''}>${esc(s.name)}</option>
                  `).join('')}
                  <option value="__new__" ${state.ideaNewSectionOpen ? 'selected' : ''}>+ Crear sección</option>
                </select>
              </div>
              <div class="field">
                <label>Marca / Cliente (opcional)</label>
                <select class="input" ${state.acceptingProposalId ? 'disabled' : ''} onchange="state.ideaFormClientId=this.value">
                  <option value="" ${!state.ideaFormClientId ? 'selected' : ''}>General de mi agencia</option>
                  ${confirmedClients.map(c => `
                    <option value="${c.id}" ${state.ideaFormClientId === c.id ? 'selected' : ''}>${esc(c.companyName)}</option>
                  `).join('')}
                </select>
              </div>
            </div>

            ${state.ideaNewSectionOpen ? `
              <div style="border:1px solid var(--border-strong);border-radius:5px;padding:12px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
                <div class="field">
                  <label for="idea-section-color">Color</label>
                  <input id="idea-section-color" type="color" value="${esc(state.ideaNewSectionColor)}"
                    style="width:64px;height:40px;padding:3px;background:var(--canvas);border:1px solid var(--border-strong);border-radius:4px;cursor:pointer;"
                    oninput="state.ideaNewSectionColor=this.value" />

                <div class="field" style="flex:1;min-width:180px;">
                  <label for="idea-section-name">Nombre de la sección</label>
                  <input id="idea-section-name" class="input" maxlength="100" value="${esc(state.ideaNewSectionName)}"
                    oninput="state.ideaNewSectionName=this.value" />
                </div>
                <button class="btn btn-signal" onclick="createSectionFromIdeaModal()">Crear sección</button>
                ${state.ideaSections.length ? `<button class="btn btn-outline" onclick="chooseIdeaFormSection(state.ideaFormSectionId || state.ideaSections[0].id)">Cancelar</button>` : ''}
                ${state.ideaNewSectionError ? `<div style="width:100%;font-size:12.5px;color:var(--tally-fault);">${esc(state.ideaNewSectionError)}</div>` : ''}
              </div>
            ` : ''}

            <div class="field">
              <label>Título o gancho principal</label>
              <input class="input"
                value="${esc(state.ideaFormTitle)}" oninput="state.ideaFormTitle=this.value" />
            </div>

            <div class="field">
              <label>Desarrollo, estructura o guion</label>
              <textarea class="input" rows="4"
                oninput="state.ideaFormContent=this.value">${esc(state.ideaFormContent)}</textarea>
            </div>

            <div class="field">
              <label>Enlace de referencia / inspiración (opcional)</label>
              <input class="input" value="${esc(state.ideaFormRefUrl)}"
                oninput="state.ideaFormRefUrl=this.value" />
            </div>

            <div style="display:${state.acceptingProposalId ? 'none' : 'flex'};justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
              <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
                <input type="checkbox" ${state.ideaFormPinned ? 'checked' : ''} onchange="state.ideaFormPinned=this.checked" />
                📌 Fijar como destacada
              </label>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:8px;border-top:1px solid var(--hairline);">
              <button class="btn btn-outline" onclick="state.ideaModalOpen=false;render();">Cancelar</button>
              <button class="btn btn-signal" onclick="submitIdeaModal()">${state.acceptingProposalId ? 'Aceptar con estos cambios →' : 'Guardar idea →'}</button>
            </div>
          </div>
        </div>
      `;

    // =========================================================================

    function renderClientCard(cl) {

              <div style="font-size:13px;color:var(--text-secondary);overflow-wrap:anywhere;">
                Contacto: ${esc(cl.contactFullName)} (${esc(cl.contactEmail)})

            </div>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <button class="btn btn-outline" style="padding:6px 10px;"
                  onclick="state.selectedClientId='${cl.id}';syncSelectedScheduleForClient();state.activeTab='schedules';render();">

                ${state.confirmDeleteClientId === cl.id ? `
                  <button class="btn btn-fault" style="padding:6px 10px;" onclick="deleteClientConfirmed('${cl.id}')">Confirmar</button>

        <div class="page-pad" style="display:flex;flex-direction:column;gap:22px;">

                  </div>
                  ${pending.length ? pending.map(cl => `
                    <div style="border:1px solid var(--tally-warn);border-radius:5px;padding:11px;display:flex;flex-direction:column;gap:8px;background:var(--canvas);">
                      <div style="min-width:0;">
                        <div style="font-weight:700;font-size:14px;overflow-wrap:anywhere;">${esc(cl.companyName)}</div>
                        <div style="font-size:12px;color:var(--text-secondary);overflow-wrap:anywhere;">${esc(cl.contactFullName)} · ${esc(cl.contactEmail)}</div>

                      ${state.confirmDeleteClientId === cl.id ? `

                          <button class="btn btn-fault" style="flex:1;padding:6px 8px;" onclick="deleteClientConfirmed('${cl.id}')">Confirmar</button>

                  `).join('') : `<div style="font-size:13px;color:var(--text-muted);">No hay confirmaciones pendientes.</div>`}

              `;
    }

              </div>
            ` : state.notifications.map(n => {

                      <button class="btn btn-signal" onclick="respondClientIdentity('${n.referenceId || state.pendingConfirmation.id}', 'ACCEPT')">✓ Sí, soy yo</button>

    /** El aviso apunta a un bloque o a una semana: se busca en lo que este usuario puede ver. */
    function findNotificationTarget(n) {
      const proposal = state.ideaProposals.find(p => p.id === n.referenceId);
      if (proposal) {
        const stillOpen = state.session.role === 'CLIENTE' || proposal.status === 'PENDING';
        return stillOpen ? { proposal } : null;
      }
      for (const sched of state.schedules) {
        if (sched.id === n.referenceId) return { sched, block: null };
        const block = (sched.items || []).find(item => item.id === n.referenceId);
        if (block) return { sched, block };
      }
      return null;
    }

    async function openNotificationTarget(id) {
      const n = state.notifications.find(x => x.id === id);
      const target = n && findNotificationTarget(n);
      if (!target) return;
      if (target.proposal) {
        state.activeTab = state.session.role === 'CLIENTE' ? 'proposals' : 'ideas';
        state.ideaSectionFilter = 'PROPOSALS';
      } else {
        state.selectedClientId = target.sched.clientId;
        state.selectedScheduleId = target.sched.id;
        state.inspectBlockId = target.block ? target.block.id : null;
        state.activeTab = 'schedules';
      }
      if (!n.isRead) {
        n.isRead = true;
        apiFetch(`/notifications/${id}/read`, { method: 'PATCH' });
      }
      render();
    }

    async function saveProfile() {
      const fullName = (document.getElementById('pf-name')?.value || '').trim();
      const agencyField = document.getElementById('pf-agency');
      const agencyName = agencyField ? agencyField.value.trim() : undefined;
      if (!fullName) { setBanner('Ingresá tu nombre.', true); return; }
      if (agencyField && !agencyName) { setBanner('Ingresá el nombre de tu agencia.', true); return; }
      const r = await apiFetch('/auth/me', { method: 'PATCH', body: JSON.stringify({ fullName, agencyName }) });
      if (!r.ok) { setBanner(friendlyError(r.data, r.status), true); return; }
      state.session.fullName = r.data.fullName;
      if (agencyField) state.session.agencyName = r.data.agencyName || agencyName;
      setBanner('Perfil actualizado.');
    }

      const r = await apiFetch('/settings');
      if (!r.ok) return;
      state.platformSettings = r.data.settings;
      state.platformIntegrations = r.data.integrations;
      render();
    }

    function applyServerSettings(data) {
      state.platformSettings = data.settings;
      state.platformIntegrations = data.integrations;
      APP_CONFIG = {
        ...APP_CONFIG,
        appName: data.settings.appName,
        registrationEnabled: data.settings.registrationEnabled
      };
    }

    function settingNumber(id) {
      return Number(document.getElementById(id)?.value);
    }

    async function savePlatformSettings() {
      const r = await apiFetch('/settings', {
        method: 'PATCH',
        body: JSON.stringify({
          appName: (document.getElementById('set-name')?.value || '').trim(),
          registrationEnabled: Boolean(document.getElementById('set-reg')?.checked),
          otpTtlMinutes: settingNumber('set-otp-ttl'),
          otpMaxAttempts: settingNumber('set-otp-max'),
          otpResendCooldownSeconds: settingNumber('set-otp-wait'),
          clientInviteTtlHours: settingNumber('set-invite')
        })

      if (!r.ok) { setBanner(friendlyError(r.data, r.status), true); return; }
      applyServerSettings(r.data);
      setBanner('Ajustes guardados: ya están activos, sin reiniciar el servidor.');

      state.confirmResetSettings = ask;
      render();
    }

    async function resetPlatformSettings() {
      state.confirmResetSettings = false;
      const r = await apiFetch('/settings', { method: 'DELETE' });

      applyServerSettings(r.data);
      setBanner('Ajustes restablecidos a los valores de fábrica.');
    }

    async function openDeleteAccount() {
      const me = await apiFetch('/auth/me');
      if (!me.ok) { setBanner(friendlyError(me.data, me.status), true); return; }
      state.deleteAccount = { hasPassword: Boolean(me.data.hasPassword), busy: false, error: '' };
      render();
    }

    function closeDeleteAccount() {
      if (state.deleteAccount && state.deleteAccount.busy) return;
      state.deleteAccount = null;
      render();
    }

    function renderDeleteAccountModal() {
      const d = state.deleteAccount;
      const isAgency = state.session.role === 'AGENCIA';
      const clients = isAgency ? state.clients.length : 0;
      const consequence = isAgency
        ? (clients === 1
            ? 'Se eliminan tu agencia, tu cliente con su acceso, sus cronogramas, fotos y videos.'
            : `Se eliminan tu agencia, tus ${clients} clientes con sus accesos, sus cronogramas, fotos y videos.`)
        : 'Se eliminan tu acceso, tus cronogramas, fotos y videos.';
      return `
        <div class="modal-backdrop" onclick="if(event.target===this){closeDeleteAccount();}">
          <div class="modal-panel" style="max-width:480px;">
            <div>
              <div class="eyebrow">ELIMINAR CUENTA</div>
              <h3 style="font-size:18px;font-weight:700;">¿Eliminar tu cuenta definitivamente?</h3>
            </div>
            <div style="font-size:13px;">${esc(consequence)}</div>
            ${d.hasPassword ? `
              <div class="field">
                <label>Tu contraseña</label>
                <input id="del-password" class="input" type="password" autocomplete="current-password" maxlength="128" />
              </div>
            ` : ''}
            <div class="field">
              <label>Escribí ELIMINAR para confirmar</label>
              <input id="del-confirm" class="input" autocomplete="off" maxlength="20" />
            </div>
            ${d.error ? `<div style="font-size:13px;color:var(--tally-fault);">${esc(d.error)}</div>` : ''}
            <div style="display:flex;justify-content:flex-end;gap:8px;">
              <button class="btn btn-outline" onclick="closeDeleteAccount()" ${d.busy ? 'disabled' : ''}>Cancelar</button>
              <button class="btn btn-fault" onclick="submitDeleteAccount()" ${d.busy ? 'disabled' : ''}>${d.busy ? 'Eliminando…' : 'Eliminar cuenta'}</button>
            </div>
          </div>
        </div>
      `;
    }

    async function submitDeleteAccount() {
      const d = state.deleteAccount;
      if (!d || d.busy) return;
      const confirmation = (document.getElementById('del-confirm')?.value || '').trim();
      const password = document.getElementById('del-password')?.value || '';
      const fail = (msg) => { d.busy = false; d.error = msg; render(); };
      if (confirmation !== 'ELIMINAR') return fail('Escribí ELIMINAR para confirmar.');
      if (d.hasPassword && !password) return fail('Ingresá tu contraseña.');
      d.busy = true;
      d.error = '';
      render();
      const r = await apiFetch('/auth/me/delete', {
        method: 'POST',
        body: JSON.stringify({ confirmation, ...(d.hasPassword ? { password } : {}) })
      });
      if (!r.ok) return fail(friendlyError(r.data, r.status));
      state.deleteAccount = null;
      state.session = null;
      state.jwtToken = null;
      state.pendingConfirmation = null;
      markSessionHint(false);
      setBanner('Tu cuenta se eliminó correctamente.');
    }

    function render() {
      const root = document.getElementById('app');
      const bannerKey = state.banner ? state.banner.msg : null;
      motionState.animateBanner = Boolean(bannerKey && bannerKey !== motionState.lastBanner);
      motionState.lastBanner = bannerKey;

      if (state.inviteToken) {
        motionState.lastTab = null;
        root.innerHTML = renderTopBar() + renderInvitationGate();
        return;
      }

      if (!state.session) {
        motionState.lastTab = null;
        root.innerHTML = renderTopBar() + renderAuthGate();
        initSocialProviders();
        return;
      }

      const dests = allowedDestinations();
      if (!dests.some(d => d.id === state.activeTab)) {
        state.activeTab = dests[0].id;
      }

      motionState.animateStage = motionState.lastTab !== state.activeTab;
      motionState.lastTab = state.activeTab;

      let activeView = '';
      if (state.activeTab === 'schedules') activeView = renderSchedulesScreen();
      else if (state.activeTab === 'ideas') activeView = renderIdeasScreen();
      else if (state.activeTab === 'accounts') activeView = renderAccountsScreen();
      else if (state.activeTab === 'proposals') activeView = renderClientProposalsScreen();
      else if (state.activeTab === 'history') {
        activeView = renderHistoryScreen();
        markAllNotificationsRead();
      }
      else activeView = renderSettingsScreen();

      const scroll = captureScroll();
      root.innerHTML = `
        ${renderTopBar()}
        <div class="studio-shell">
          <nav class="side-rail" aria-label="Navegación Principal">
            <div>
              ${dests.map(d => `
                <button class="rail-item ${state.activeTab === d.id ? 'active' : ''}" onclick="state.activeTab='${d.id}';render();">
                  <span class="mono" style="font-size:11px;opacity:0.7;">${d.code}</span>
                  <span>${d.label}</span>
                </button>
              `).join('')}
            </div>
          </nav>

          <main class="workspace-content ${motionState.animateStage ? 'stage-enter' : ''}">
            ${activeView}
          </main>
        </div>

        <nav class="bottom-bar" aria-label="Navegación Móvil">
          ${dests.map(d => `
            <button class="bottom-item ${state.activeTab === d.id ? 'active' : ''}" onclick="state.activeTab='${d.id}';render();">
              <span>${d.code}</span>
              <span>${d.label}</span>
            </button>
          `).join('')}
        </nav>
      `;
      restoreScroll(scroll);
    }

    /** Volver a dibujar reemplaza los elementos: sin esto, cualquier cambio dentro de una ventana la llevaría arriba. */
    function currentModalKey() {
      if (state.blockModalOpen) return 'block:' + (state.editingBlockId || 'new');
      if (state.inspectBlockId) return 'inspect:' + state.inspectBlockId;
      if (state.showNewWeekModal) return 'new-week';
      if (state.showDuplicateModal) return 'duplicate';
      if (state.ideaModalOpen) return 'idea:' + (state.editingIdeaId || 'new');
      if (state.deleteAccount) return 'delete-account';
      return '';
    }

    function captureScroll() {
      return {
        modalKey: motionState.modalKey,
        modal: document.querySelector('.modal-panel')?.scrollTop || 0,
        grid: document.querySelector('.week-grid')?.scrollLeft || 0,
        slots: [...document.querySelectorAll('.modal-panel [data-media-slot]')].map(el => [el.dataset.mediaSlot, el.offsetHeight])
      };
    }

    function restoreScroll(saved) {
      const key = currentModalKey();
      motionState.modalKey = key;
      const grid = document.querySelector('.week-grid');
      if (grid) grid.scrollLeft = saved.grid;
      const panel = document.querySelector('.modal-panel');
      if (!panel || !key || key !== saved.modalKey) return;
      // La animación de entrada es solo para cuando se abre: redibujando, haría saltar el pop up.
      panel.style.animation = 'none';
      // Las fotos y los videos se dibujan sin altura hasta cargar: se les reserva la que ya tenían para que nada se mueva.
      const heights = new Map(saved.slots);
      panel.querySelectorAll('[data-media-slot]').forEach(el => {
        const height = heights.get(el.dataset.mediaSlot);
        if (height) el.style.minHeight = height + 'px';
      });
      panel.scrollTop = saved.modal;
    }

    // Inicialización + restauración de sesión activa + retorno desde email "Sí, soy yo"
    (async function bootStudio() {
      const q = new URLSearchParams(window.location.search);
      const theme = q.get('theme');
      if (theme === 'light' || theme === 'dark') {
        state.theme = theme;
        document.documentElement.setAttribute('data-theme', theme);
      }

      // Al volver a la app de Android se trae lo último: el cliente o la agencia pudo haber respondido.
      window.__onAppResume = () => {
        if (state.session && !isEditingField()) hydrateFromApi();
      };

      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const socialSession = hashParams.get('social_session');
      const socialError = q.get('social_error');

      const inviteToken = q.get('invitation_token');
      if (inviteToken) {
        state.inviteToken = inviteToken;
        state.inviteDecision = q.get('decision') === 'reject' ? 'reject' : 'accept';
        window.history.replaceState({}, '', window.location.pathname);
      }
      if (socialSession) {
        try {
          const b64 = socialSession.replace(/-/g, '+').replace(/_/g, '/');
          const pad = b64 + '==='.slice((b64.length + 3) % 4);
          const jsonStr = decodeURIComponent(
            Array.prototype.map
              .call(atob(pad), (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
              .join('')
          );
          const parsed = JSON.parse(jsonStr);
          window.history.replaceState({}, '', window.location.pathname);
          if (parsed && parsed.accessToken) {
            await applyServerSession(parsed, '¡Sesión iniciada con éxito!');
            return;
          }
        } catch (_) {}
      }
      if (socialError) {
        window.history.replaceState({}, '', window.location.pathname);
        authUi.error = socialError;
      }

      if (hasSessionHint() && !state.inviteToken && (await refreshSession())) {
        render();
        await hydrateFromApi();
        return;
      }

      render();
    })();
  </script>
</body>
</html>
