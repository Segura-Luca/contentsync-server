<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContentSync — Cronogramas y aprobaciones entre agencias y clientes</title>
  <meta name="description" content="Agencias y clientes en un solo lugar: compartí el cronograma, mostrá cada pieza de contenido y recibí comentarios y aprobaciones." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html[data-theme="dark"] {
      --canvas: #0B0C0E;
      --stage: #111318;
      --inspector: #151820;
      --elevated: #1B1F29;
      --hairline: #232732;
      --border-strong: #373E4E;
      --text-primary: #F2F3F5;
      --text-secondary: #9DA4B3;
      --text-muted: #6E7687;
      --signal: #D4F238;
      --on-signal: #0B0C0E;
      --signal-subtle-bg: #20250F;
      --signal-subtle-fg: #E0F85E;
      --tally-live: #34D399;
      --tally-live-bg: #0A291F;
      --tally-warn: #FBBF24;
      --tally-warn-bg: #2B1D07;
      --tally-fault: #F87171;
      --tally-fault-bg: #2D1114;
      --scrim: rgba(5, 6, 8, 0.78);

      --note-amber-fg: #FBBF24; --note-amber-bg: rgba(251, 191, 36, 0.10);
      --note-emerald-fg: #34D399; --note-emerald-bg: rgba(52, 211, 153, 0.10);
      --note-sky-fg: #38BDF8; --note-sky-bg: rgba(56, 189, 248, 0.10);
      --note-rose-fg: #FB7185; --note-rose-bg: rgba(251, 113, 133, 0.10);
      --note-violet-fg: #A78BFA; --note-violet-bg: rgba(167, 139, 250, 0.11);
      --note-lime-fg: #D4F238; --note-lime-bg: rgba(212, 242, 56, 0.10);
    }

    html[data-theme="light"] {
      --canvas: #F1F4FA;
      --stage: #FFFFFF;
      --inspector: #F6F8FD;
      --elevated: #E9EEF7;
      --hairline: #DDE3EF;
      --border-strong: #B3BDD0;
      --text-primary: #1C2436;
      --text-secondary: #46516A;
      --text-muted: #5F6A83;
      --signal: #4F46E5;
      --on-signal: #FFFFFF;
      --signal-subtle-bg: #E9E8FE;
      --signal-subtle-fg: #3730A3;
      --tally-live: #047857;
      --tally-live-bg: #D6F5E7;
      --tally-warn: #A1560A;
      --tally-warn-bg: #FDF0D0;
      --tally-fault: #B42318;
      --tally-fault-bg: #FDE6E3;
      --scrim: rgba(28, 36, 54, 0.45);

      --note-amber-fg: #B45309; --note-amber-bg: #FDF1D3;
      --note-emerald-fg: #047857; --note-emerald-bg: #DBF6EA;
      --note-sky-fg: #0369A1; --note-sky-bg: #DDF1FD;
      --note-rose-fg: #BE123C; --note-rose-bg: #FFE6EA;
      --note-violet-fg: #6D28D9; --note-violet-bg: #EEE9FE;
      --note-lime-fg: #4D7C0F; --note-lime-bg: #EDF8D2;
    }

    html, body { max-width: 100%; overflow-x: hidden; }

    body {
      background: var(--canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .eyebrow {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    h1, h2, h3, .display-tight {
      letter-spacing: -0.025em;
      line-height: 1.18;
    }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .input {
      width: 100%;
      background: var(--canvas);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 9px 11px;
      font-size: 14px;
      transition: border-color 120ms ease;
    }

    .input:focus {
      outline: none;
      border-color: var(--signal-subtle-fg);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 4px;
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border: 1px solid transparent;
      transition: opacity 120ms ease, border-color 120ms ease, background 120ms ease, transform 120ms ease;
      white-space: nowrap;
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }

    .btn-signal { background: var(--signal); color: var(--on-signal); border-color: var(--signal); }
    .btn-signal:hover:not(:disabled) { opacity: 0.9; }

    .btn-live { background: var(--tally-live); color: #FFFFFF; border-color: var(--tally-live); }
    html[data-theme="dark"] .btn-live { color: #042414; }

    .btn-outline { background: var(--stage); color: var(--text-primary); border-color: var(--border-strong); }
    .btn-outline:hover:not(:disabled) { background: var(--elevated); }

    .btn-warn { background: var(--tally-warn-bg); color: var(--tally-warn); border-color: var(--tally-warn); }
    .btn-fault { background: var(--tally-fault-bg); color: var(--tally-fault); border-color: var(--tally-fault); }

    .brand-mark { display: inline-flex; align-items: flex-end; gap: 2.5px; height: 18px; }
    .brand-mark span {
      width: 3px;
      background: var(--signal-subtle-fg);
      display: block;
      transform-origin: bottom center;
      transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1), opacity 240ms ease;
    }
    html[data-theme="light"] .brand-mark span { background: var(--signal); }
    .brand-mark span:nth-child(1) { height: 18px; }
    .brand-mark span:nth-child(2) { height: 11px; opacity: 0.72; }
    .brand-mark span:nth-child(3) { height: 16px; }
    .topbar:hover .brand-mark span:nth-child(1), .brand-mark.active span:nth-child(1) { animation: studioEq1 1.3s ease-in-out infinite alternate; }
    .topbar:hover .brand-mark span:nth-child(2), .brand-mark.active span:nth-child(2) { animation: studioEq2 1.1s ease-in-out infinite alternate; }
    .topbar:hover .brand-mark span:nth-child(3), .brand-mark.active span:nth-child(3) { animation: studioEq3 1.45s ease-in-out infinite alternate; }

    .tally-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      vertical-align: middle;
      animation: tallyBreath 3.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .tally-dot.static { animation: none; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 3px;
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      border: 1px solid var(--border-strong);
      background: var(--elevated);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .badge-review { background: var(--signal-subtle-bg); color: var(--signal-subtle-fg); border-color: var(--signal-subtle-fg); }
    .badge-live { background: var(--tally-live-bg); color: var(--tally-live); border-color: var(--tally-live); }
    .badge-warn { background: var(--tally-warn-bg); color: var(--tally-warn); border-color: var(--tally-warn); }
    .badge-fault { background: var(--tally-fault-bg); color: var(--tally-fault); border-color: var(--tally-fault); }


    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--stage);
      border-bottom: 1px solid var(--hairline);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .feedback-bar {
      padding: 10px 18px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }
    .feedback-bar.ok { background: var(--signal-subtle-bg); color: var(--signal-subtle-fg); }
    .feedback-bar.err { background: var(--tally-fault-bg); color: var(--tally-fault); }

    .security-confirm-banner {
      background: var(--tally-warn-bg);
      border-bottom: 2px solid var(--tally-warn);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .studio-shell {
      display: flex;
      min-height: calc(100vh - 57px);
    }

    .side-rail {
      width: 196px;
      flex-shrink: 0;
      background: var(--stage);
      border-right: 1px solid var(--hairline);
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .rail-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      text-align: left;
      color: var(--text-muted);
      border-left: 3px solid transparent;
      font-size: 13px;
      transition: background 120ms ease, color 120ms ease;
    }
    .rail-item:hover { background: var(--inspector); color: var(--text-primary); }
    .rail-item.active {
      background: var(--inspector);
      color: var(--text-primary);
      font-weight: 600;
      border-left-color: var(--signal-subtle-fg);
    }
    html[data-theme="light"] .rail-item.active {
      background: var(--signal-subtle-bg);
      color: var(--signal-subtle-fg);
      border-left-color: var(--signal);
    }
    html[data-theme="light"] .topbar { box-shadow: 0 1px 3px rgba(28, 36, 54, 0.06); }
    html[data-theme="light"] .plan-block-card,
    html[data-theme="light"] .idea-card { box-shadow: 0 1px 2px rgba(28, 36, 54, 0.05), 0 3px 10px rgba(28, 36, 54, 0.05); }
    html[data-theme="light"] .modal-panel { box-shadow: 0 12px 40px rgba(28, 36, 54, 0.22); }

    .workspace-content { flex: 1; min-width: 0; }
    .bottom-bar { display: none; }

    /* ==========================================================================
       CUADRÍCULA SEMANAL LUNES A DOMINGO
       ========================================================================== */
    .plan-page {
      padding: 20px 22px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .week-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--stage);
      border: 1px solid var(--hairline);
      border-radius: 5px;
      padding: 12px 15px;
    }

    .clients-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      align-items: start;
    }
    .clients-pending {
      position: sticky;
      top: 12px;
      border: 1px solid var(--hairline);
      background: var(--stage);
      border-radius: 5px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(190px, 1fr));
      gap: 12px;
      align-items: stretch;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .day-column {
      background: var(--stage);
      border: 1px solid var(--hairline);
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      min-height: 410px;
      transition: border-color 150ms ease;
    }
    .day-column:hover { border-color: var(--border-strong); }

    .day-col-header {
      padding: 11px 12px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--inspector);
      border-radius: 5px 5px 0 0;
    }

    .day-blocks-list {
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .day-col-footer {
      padding: 8px 10px 10px;
      border-top: 1px dashed var(--hairline);
    }

    .plan-block-card {
      position: relative;
      border-radius: 4px;
      border: 1px solid var(--hairline);
      border-left: 4px solid var(--note-fg, var(--signal-subtle-fg));
      background: var(--note-bg, var(--elevated));
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
      text-align: left;
      transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1), border-color 150ms ease;
    }
    .plan-block-card:hover {
      transform: translateY(-2px);
      border-color: var(--note-fg, var(--border-strong));
    }

    .color-AMBER   { --note-fg: var(--note-amber-fg);   --note-bg: var(--note-amber-bg); }
    .color-EMERALD { --note-fg: var(--note-emerald-fg); --note-bg: var(--note-emerald-bg); }
    .color-SKY     { --note-fg: var(--note-sky-fg);     --note-bg: var(--note-sky-bg); }
    .color-ROSE    { --note-fg: var(--note-rose-fg);    --note-bg: var(--note-rose-bg); }
    .color-VIOLET  { --note-fg: var(--note-violet-fg);  --note-bg: var(--note-violet-bg); }
    .color-LIME    { --note-fg: var(--note-lime-fg);    --note-bg: var(--note-lime-bg); }

    .swatch-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .swatch-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--hairline);
      background: var(--canvas);
      font-size: 12px;
      transition: border-color 140ms ease, background 140ms ease;
    }
    .swatch-btn.active {
      border-color: var(--note-fg);
      background: var(--note-bg);
      font-weight: 600;
    }
    .swatch-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--note-dot, var(--note-fg));
      display: inline-block;
    }

    /* ==========================================================================
       IDEAS DE CONTENIDO (PRIVADO DE AGENCIA)
       ========================================================================== */
    .ideas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(295px, 1fr));
      gap: 14px;
    }
    .idea-card {
      background: var(--stage);
      border: 1px solid var(--hairline);
      border-top: 3px solid var(--note-fg, var(--border-strong));
      border-radius: 5px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 150ms ease, transform 160ms ease;
    }
    .idea-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    /* ==========================================================================
       MODALES DEL ESTUDIO (CERO ALERTS DEL NAVEGADOR)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 65;
      background: var(--scrim);
      display: flex;
      /* Arriba y no centrado: si el contenido crece, el pop up se queda donde está. */
      align-items: flex-start;
      justify-content: center;
      padding: 18px;
      overflow-y: auto;
    }
    .modal-backdrop.modal-centered { align-items: center; }
    .modal-panel {
      /* El contenido se redibuja con la misma altura: el anclaje del navegador moveria la ventana al aparecer cada foto. */
      overflow-anchor: none;
      width: 100%;
      max-width: 660px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--stage);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      animation: stageReveal 180ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .dropzone-video {
      border: 1px dashed var(--border-strong);
      background: var(--canvas);
      border-radius: 5px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease;
    }
    .dropzone-video:hover {
      border-color: var(--signal-subtle-fg);
      background: var(--inspector);
    }

    .auth-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 57px);
    }
    .auth-manifesto {
      background: var(--stage);
      border-right: 1px solid var(--hairline);
      padding: 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--hairline);
    }
    .auth-tab {
      padding: 10px 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .auth-tab:hover { color: var(--text-primary); }
    .auth-tab.active { color: var(--text-primary); border-bottom-color: var(--signal); }

    .auth-console-wrap {
      padding: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seed-pass-card {
      padding: 12px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      text-align: left;
      background: var(--stage);
      transition: background 160ms ease, border-color 160ms ease, transform 180ms ease;
    }
    .seed-pass-card:hover {
      background: var(--elevated);
      border-color: var(--signal-subtle-fg);
      transform: translateY(-1px);
    }

    .s3-progress-fill {
      height: 100%;
      background-color: var(--signal-subtle-fg);
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.22) 0px,
        rgba(255, 255, 255, 0.22) 6px,
        transparent 6px,
        transparent 12px
      );
      background-size: 17px 17px;
      animation: s3Scan 0.8s linear infinite;
      transition: width 90ms linear;
    }

    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--hairline);
      background: var(--stage);
      border-radius: 4px;
    }
    .stat-cell {
      padding: 10px 14px;
      border-right: 1px solid var(--hairline);
    }
    .stat-cell:last-child { border-right: none; }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .filter-tab {
      padding: 6px 11px;
      border-radius: 3px;
      border: 1px solid var(--hairline);
      background: var(--stage);
      color: var(--text-secondary);
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 11px;
      text-transform: uppercase;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    }
    .filter-tab:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .filter-tab.active {
      background: var(--signal-subtle-bg);
      color: var(--signal-subtle-fg);
      border-color: var(--signal-subtle-fg);
      font-weight: 600;
    }


    .page-pad {
      max-width: 1100px;
      padding: 22px;
    }

    .stage-enter { animation: stageReveal 200ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .feedback-enter { animation: bannerSlide 180ms cubic-bezier(0.22, 1, 0.36, 1) both; }

    @keyframes tallyBreath { 0%, 100% { opacity: 0.42; } 50% { opacity: 1; } }
    @keyframes studioEq1 { 0% { transform: scaleY(0.68); } 100% { transform: scaleY(1); } }
    @keyframes studioEq2 { 0% { transform: scaleY(1.25); } 100% { transform: scaleY(0.65); } }
    @keyframes studioEq3 { 0% { transform: scaleY(0.75); } 100% { transform: scaleY(1.05); } }
    @keyframes stageReveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bannerSlide { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes s3Scan { from { background-position: 0 0; } to { background-position: 17px 0; } }

    @media (max-width: 959px) {
      .side-rail { display: none; }
      .studio-shell { display: block; width: 100%; padding-bottom: 70px; }
      .auth-split { grid-template-columns: minmax(0, 1fr); }
      .auth-manifesto { padding: 22px 14px; border-right: none; border-bottom: 1px solid var(--hairline); }
      .auth-console-wrap { padding: 22px 14px; }
      .seed-passes-grid { grid-template-columns: 1fr !important; }
      .plan-page { padding: 14px; }
      .week-grid { grid-template-columns: minmax(0, 1fr); }
      .clients-layout { grid-template-columns: minmax(0, 1fr); }
      .clients-pending { position: static; max-height: none; order: -1; }
      .day-column { min-height: auto; }
      .stats-strip { grid-template-columns: repeat(2, 1fr); }
      .page-pad { padding: 14px; width: 100%; }
      .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 35;
        display: flex;
        background: var(--stage);
        border-top: 1px solid var(--hairline);
      }
      .bottom-item {
        flex: 1;
        min-width: 0;
        padding: 7px 2px 9px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        color: var(--text-muted);
        border-top: 2px solid transparent;
        font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
        font-size: 11px;
      }
      .bottom-item.active {
        color: var(--text-primary);
        font-weight: 700;
        border-top-color: var(--signal-subtle-fg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <script src="/app-config.js"></script>
</head>
<body>
  <div id="app"></div>

  <script>
    // Configuración pública generada por el servidor (/app-config.js); se vuelve a leer al guardar Ajustes.
    let APP_CONFIG = window.__CS_CONFIG__ || {};
    const CONTENT_TYPES = [
      { code: 'REEL', label: 'Reel' },
      { code: 'CAROUSEL', label: 'Carrusel' },
      { code: 'STORY', label: 'Historia' },
      { code: 'POST', label: 'Publicación' },
      { code: 'VIDEO', label: 'Video' },
      { code: 'OTHER', label: 'Otro' }
    ];
    const MAX_MEDIA_PER_BLOCK = 20;
    const PRODUCTION_STATUSES = [
      { code: 'PENDING', label: 'Pendiente' },
      { code: 'RECORDED', label: 'Grabado' },
      { code: 'EDITED', label: 'Editado' },
      { code: 'UPLOADED', label: 'Subido' }
    ];

    function productionLabel(code) {
      return PRODUCTION_STATUSES.find(p => p.code === code)?.label || 'Pendiente';
    }

    function contentTypeLabel(code) {
      return CONTENT_TYPES.find(t => t.code === code)?.label || 'Contenido';
    }

    function appName() {
      return APP_CONFIG.appName || 'ContentSync';
    }

    function senderHint() {
      return APP_CONFIG.senderEmail ? ` desde ${APP_CONFIG.senderEmail}` : '';
    }

    const WEEKDAYS = [
      { num: 1, code: 'LUN', full: 'Lunes' },
      { num: 2, code: 'MAR', full: 'Martes' },
      { num: 3, code: 'MIÉ', full: 'Miércoles' },
      { num: 4, code: 'JUE', full: 'Jueves' },
      { num: 5, code: 'VIE', full: 'Viernes' },
      { num: 6, code: 'SÁB', full: 'Sábado' },
      { num: 7, code: 'DOM', full: 'Domingo' }
    ];

    const API_BASE = APP_CONFIG.apiBase || '/api/v1';

    const state = {
      theme: 'dark',
      apiOnline: false,
      jwtToken: null,
      session: null,
      platformSettings: null,
      platformIntegrations: null,
      inviteToken: null,
      inviteDecision: 'accept',
      inviteBusy: false,
      activeTab: 'schedules',
      banner: null,
      loadingData: false,

      // Auth
      authRegister: false,
      authVerifyReg: false,
      regVerifyCode: '',
      authRecover: false,
      authRecoverMode: 'RECOVER',
      authRecoverStep: 1,
      recoveryCode: '',
      recoveryNewPass: '',
      authEmail: '',
      authPass: '',
      authFirstName: '',
      authLastName: '',
      authName: '',
      authAgencyName: '',

      // Confirmación "Sí, soy yo" pendiente del cliente logueado
      pendingConfirmation: null,

      // Datos sincronizados desde MySQL
      agencies: [],
      clients: [],
      schedules: [],
      ideaSections: [],
      ideas: [],
      notifications: [],

      // Cronograma activo
      selectedClientId: null,
      selectedScheduleId: null,

      showNewWeekModal: false,
      newWeekStart: '',
      newWeekTitle: '',
      newWeekNotes: '',

      inspectNote: '',
      inspectNoteFor: null,
      reviewConfirm: null,

      ideaProposals: [],
      proposalTitle: '',
      proposalContent: '',
      proposalRefUrl: '',
      proposalSectionChoice: {},
      confirmRejectProposalId: null,
      acceptingProposalId: null,

      ideaNewSectionOpen: false,
      ideaNewSectionName: '',
      ideaNewSectionColor: '#38BDF8',
      ideaNewSectionError: '',

      showDuplicateModal: false,
      dupSourceId: null,
      dupTargetStart: '',
      dupTitle: '',
      dupTitleEdited: false,
      dupIncludeMedia: true,

      // Modal de Bloque del Día: tipo de contenido, textos, fotos y videos
      blockModalOpen: false,
      editingBlockId: null,
      blkDay: 1,
      blkTime: '18:00',
      blkColor: 'AMBER',
      blkTitle: '',
      blkNotes: '',
      blkContentType: 'REEL',
      blkProductionStatus: 'PENDING',
      blkCaption: '',
      blkMedia: [],
      blkUploadProgress: 0,
      blkSaving: false,
      blkError: '',

      // Modal de Inspección / Visado de Bloque (Cliente y Agencia)
      inspectBlockId: null,
      confirmDeleteBlockId: null,
      confirmScheduleAsk: false,

      // Estado de Ideas de Contenido (Privadas de Agencia)
      ideaSectionFilter: 'ALL',
      ideaClientFilter: 'ALL',
      ideaSearch: '',
      showNewSectionForm: false,
      newSectionName: '',
      newSectionColor: '#38BDF8',
      confirmDeleteSectionId: null,

      ideaModalOpen: false,
      editingIdeaId: null,
      ideaFormSectionId: '',
      ideaFormClientId: '',
      ideaFormTitle: '',
      ideaFormContent: '',
      ideaFormRefUrl: '',
      ideaFormPinned: false,
      confirmDeleteIdeaId: null,

      // Clientes y Agencias
      showNewAgencyForm: false,
      showNewClientForm: false,
      confirmDeleteClientId: null
    };

    const motionState = {
      modalKey: '',
      lastTab: null,
      lastBanner: null,
      animateStage: true,
      animateBanner: false
    };

    // =========================================================================
    // UTILIDADES Y FORMATEADORES
    // =========================================================================
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getMondayOf(dateObj) {
      const d = new Date(dateObj);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return d.toISOString().slice(0, 10);
    }

    function addDaysIso(isoDateStr, days) {
      const base = new Date(isoDateStr.slice(0, 10) + 'T12:00:00Z');
      base.setUTCDate(base.getUTCDate() + days);
      return base.toISOString().slice(0, 10);
    }

    function fmtShortDate(isoStr, plusDays = 0) {
      if (!isoStr) return '';
      const d = new Date(String(isoStr).slice(0, 10) + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() + plusDays);
      const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      return `${String(d.getUTCDate()).padStart(2, '0')} ${months[d.getUTCMonth()]}`;
    }

    function fmtDateTimeHuman(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return String(isoStr);
      return d.toLocaleString('es-AR', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      });
    }

    function workflowMeta(status) {
      switch (status) {
        case 'APPROVED':          return { label: 'APROBADO',        cls: 'badge-live' };
        case 'CHANGES_REQUESTED': return { label: 'CAMBIOS PEDIDOS', cls: 'badge-warn' };
        case 'REJECTED':          return { label: 'RECHAZADO',       cls: 'badge-fault' };
        default:                  return { label: 'EN REVISIÓN',     cls: 'badge-review' };
      }
    }

    function setBanner(msg, isErr = false) {
      state.banner = { msg, isErr };
      render();
    }

    function setTheme(next) {
      state.theme = next;
      document.documentElement.setAttribute('data-theme', next);
      render();
    }

    // =========================================================================
    // CLIENTE HTTP AUTENTICADO + HIDRATACIÓN DESDE MYSQL
    // =========================================================================
    let refreshInFlight = null;

    /** Rota el refresh token. Varias peticiones vencidas comparten una sola renovación: repetirla se detecta como robo. */
    function refreshSession() {
      if (refreshInFlight) return refreshInFlight;
      refreshInFlight = (async () => {
        const rotate = async () => {
          try {
            const res = await fetch(API_BASE + '/auth/refresh', { method: 'POST' });
            if (!res.ok) {
              if (res.status === 401) markSessionHint(false);
              return false;
            }
            const data = await res.json();
            state.jwtToken = data.accessToken;
            state.session = sessionFromUser(data.user);
            return true;
          } catch (_) {
            return false;
          }
        };
        // La cookie es compartida: dos pestañas renovando a la vez se detectarían como robo del token.
        return navigator.locks ? navigator.locks.request('cs_refresh', rotate) : rotate();
      })().finally(() => { refreshInFlight = null; });
      return refreshInFlight;
    }

    /** El refresh token vive en una cookie httpOnly: aquí solo se recuerda si vale la pena intentar renovarlo. */
    function markSessionHint(active) {
      try {
        if (active) localStorage.setItem('cs_has_session', '1');
        else localStorage.removeItem('cs_has_session');
      } catch (_) {}
    }

    function hasSessionHint() {
      try { return localStorage.getItem('cs_has_session') === '1'; } catch (_) { return false; }
    }

    function sessionFromUser(user) {
      const u = user || {};
      return {
        id: u.id,
        email: u.email,
        fullName: u.fullName || u.email,
        role: u.role,
        agencyId: u.agencyId || null,
        agencyName: u.agencyName || '',
        clientId: u.clientId || null
      };
    }

    async function apiFetch(path, options = {}, canRefresh = true) {
      const headers = { ...(options.headers || {}) };
      if (!(options.body instanceof FormData) && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }
      if (state.jwtToken) {
        headers['Authorization'] = 'Bearer ' + state.jwtToken;
      }
      try {
        const res = await fetch(API_BASE + path, { ...options, headers });
        if (res.status === 401 && canRefresh && state.session && (!path.startsWith('/auth/') || path === '/auth/me')) {
          if (await refreshSession()) return apiFetch(path, options, false);
        }
        const data = await res.json().catch(() => ({}));
        return { ok: res.ok, status: res.status, data };
      } catch (_) {
        return {
          ok: false,
          status: 0,
          data: { message: 'No pudimos conectar con el servidor.' }
        };
      }
    }

    function friendlyError(body, status) {
      const m = body && body.message;
      if (Array.isArray(m)) return m[0];
      if (typeof m === 'string' && m.trim()) return m;
      if (status === 401) return 'Correo o contraseña incorrectos.';
      if (status === 429) return 'Demasiados intentos. Esperá unos segundos.';
      return 'No pudimos completar la acción. Intentá nuevamente.';
    }

    async function hydrateFromApi() {
      if (!state.jwtToken || !state.session) return;
      state.loadingData = true;
      render();

      const role = state.session.role;
      const calls = [
        apiFetch('/clients/pending-confirmation'),
        apiFetch('/clients'),
        apiFetch('/schedules'),
        apiFetch('/notifications'),
        apiFetch('/idea-proposals'),
      ];

      if (role !== 'CLIENTE') {
        calls.push(apiFetch('/ideas/sections'));
        calls.push(apiFetch('/ideas'));
      }
      if (role === 'ADMIN_GENERAL') {
        calls.push(apiFetch('/agencies'));
      }

      const results = await Promise.all(calls);
      const [pendRes, clRes, schRes, notRes, propRes] = results;

      if (role === 'ADMIN_GENERAL') loadPlatformSettings();

      if (clRes.status === 401 && schRes.status === 401) {
        state.loadingData = false;
        logoutSession();
        setBanner('Tu sesión expiró. Volvé a iniciar sesión.');
        return;
      }

      state.pendingConfirmation = (pendRes.ok && pendRes.data?.pendingClient) || null;

      if (clRes.ok && Array.isArray(clRes.data)) {
        state.clients = clRes.data.map(normalizeClientFromApi);
      }
      if (schRes.ok && Array.isArray(schRes.data)) {
        state.schedules = schRes.data;
        reuseFreshMediaUrls(state.schedules);
      }
      if (notRes.ok && Array.isArray(notRes.data)) {
        state.notifications = notRes.data;
      }
      if (propRes.ok && Array.isArray(propRes.data)) {
        state.ideaProposals = propRes.data;
      }

      if (role !== 'CLIENTE') {
        const secRes = results[5];
        const idRes = results[6];
        if (secRes?.ok && Array.isArray(secRes.data)) state.ideaSections = secRes.data;
        if (idRes?.ok && Array.isArray(idRes.data)) state.ideas = idRes.data;
      }
      if (role === 'ADMIN_GENERAL') {
        const agRes = results[7];
        if (agRes?.ok && Array.isArray(agRes.data)) state.agencies = agRes.data;
      }

      // Seleccionar cliente y semana activos por defecto
      const confirmedClients = state.clients.filter(c => c.confirmationStatus === 'CONFIRMED');
      if (!state.selectedClientId || !confirmedClients.some(c => c.id === state.selectedClientId)) {
        state.selectedClientId = confirmedClients[0]?.id || state.clients[0]?.id || null;
      }
      syncSelectedScheduleForClient();

      state.loadingData = false;
      render();
    }

    /**
     * Cada carga trae enlaces firmados nuevos. Reusar los vigentes evita volver a descargar las fotos y los videos,
     * que además harían saltar la ventana abierta. Vencen a las 12 horas: se renuevan bastante antes.
     */
    const mediaUrlCache = new Map();
    const MEDIA_URL_MAX_AGE_MS = 6 * 60 * 60 * 1000;

    function reuseFreshMediaUrls(schedules) {
      const now = Date.now();
      schedules.forEach(sched => (sched.items || []).forEach(item => (item.media || []).forEach(m => {
        const cached = mediaUrlCache.get(m.storageKey);
        if (cached && now - cached.at < MEDIA_URL_MAX_AGE_MS) {
          m.url = cached.url;
        } else if (m.url) {
          mediaUrlCache.set(m.storageKey, { url: m.url, at: now });
        }
      })));
    }

    function normalizeClientFromApi(c) {
      return {
        id: c.id,
        agencyId: c.agencyId,
        agencyName: c.agency?.name || 'Agencia',
        companyName: c.companyName,
        industry: c.industry || 'Marca',
        confirmationStatus: c.confirmationStatus || 'CONFIRMED',
        confirmedAt: c.confirmedAt,
        contactFullName: c.user?.fullName || 'Contacto',
        contactEmail: c.user?.email || ''
      };
    }

    function syncSelectedScheduleForClient() {
      const clientSchedules = state.schedules.filter(s => s.clientId === state.selectedClientId);
      if (!clientSchedules.some(s => s.id === state.selectedScheduleId)) {
        state.selectedScheduleId = clientSchedules[0]?.id || null;
      }
    }

    // =========================================================================
    // AUTENTICACIÓN, REGISTRO, GOOGLE/FACEBOOK Y RECUPERACIÓN POR EMAIL
    // =========================================================================
    const authUi = { error: '', busy: false, cfg: null, googleReady: false, facebookReady: false };

    async function applyServerSession(data, welcome) {
      state.jwtToken = data.accessToken;
      state.apiOnline = true;
      state.session = sessionFromUser(data.user);
      markSessionHint(true);

      authUi.error = '';
      authUi.busy = false;
      const first = String(state.session.fullName || '').split(' ')[0];
      state.banner = { msg: welcome || ('Hola, ' + first + '. Tu espacio está sincronizado.'), isErr: false };
      await hydrateFromApi();
    }

    function logoutSession() {
      fetch(API_BASE + '/auth/logout', { method: 'POST' }).catch(() => {});
      state.session = null;
      state.jwtToken = null;
      state.pendingConfirmation = null;
      markSessionHint(false);
      setBanner('Cerraste sesión correctamente.');
    }

    function setAuthError(msg) {
      authUi.error = msg;
      authUi.busy = false;
      render();
    }

    async function performLogin(email, password) {
      if (authUi.busy) return;
      email = String(email || '').trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        setAuthError('Ingresá un correo electrónico válido.');
        return;
      }
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password: password || undefined })
      });
      authUi.busy = false;
      if (r.ok && r.data?.requiresPasswordCreation) {
        state.authEmail = r.data.email || email;
        state.authRecover = true;
        state.authRecoverMode = 'CREATE_GOOGLE_PASS';
        state.authRecoverStep = 2;
        state.recoveryCode = '';
        state.recoveryNewPass = '';
        authUi.error = '';
        setBanner(r.data.message || 'Te enviamos un código de 6 dígitos para comprobar tu identidad y crear tu contraseña.');
        return;
      }
      if (r.ok && r.data?.requiresEmailVerification) {
        state.authEmail = r.data.email || email;
        state.authVerifyReg = true;
        state.regVerifyCode = '';
        authUi.error = '';
        setBanner(r.data.message || 'Te enviamos un código de 6 dígitos para verificar tu correo.');
        return;
      }
      if (r.ok && r.data?.accessToken) {
        await applyServerSession(r.data);
        return;
      }
      setAuthError(friendlyError(r.data, r.status));
    }

    async function performRegister() {
      if (authUi.busy) return;
      const firstName = String(state.authFirstName || '').trim();
      const lastName = String(state.authLastName || '').trim();
      const agencyName = String(state.authAgencyName || '').trim();
      const email = String(state.authEmail || '').trim();
      const password = state.authPass || '';
      if (firstName.length < 2) { setAuthError('Ingresá tu nombre.'); return; }
      if (lastName.length < 2) { setAuthError('Ingresá tu apellido.'); return; }
      if (agencyName.length < 2) { setAuthError('Ingresá el nombre de tu agencia.'); return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setAuthError('Ingresá un correo electrónico válido.'); return; }
      if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,64}$/.test(password)) {
        setAuthError('La contraseña debe tener 8 o más caracteres, con mayúscula, minúscula, número y un símbolo.');
        return;
      }
      const fullName = `${firstName} ${lastName}`;
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          email,
          password,
          firstName,
          lastName,
          fullName,
          agencyName
        })
      });
      authUi.busy = false;
      if (r.ok && r.data?.requiresEmailVerification) {
        state.authVerifyReg = true;
        state.regVerifyCode = '';
        authUi.error = '';
        setBanner(
          r.data.message ||
            `Enviamos un código de 6 dígitos${senderHint()} a ${email}. Ingresalo para verificar tu cuenta.`
        );
        return;
      }
      if (r.ok && r.data?.accessToken) {
        await applyServerSession(r.data, 'Agencia creada con éxito. ¡Bienvenido/a, ' + firstName + '!');
        return;
      }
      setAuthError(friendlyError(r.data, r.status));
    }

    async function submitVerifyRegistration() {
      if (authUi.busy) return;
      const email = String(state.authEmail || '').trim();
      const code = String(state.regVerifyCode || '').trim();
      if (!/^\d{6}$/.test(code)) {
        setAuthError('Ingresá el código numérico de 6 dígitos que enviamos a tu correo.');
        return;
      }
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/verify-registration', {
        method: 'POST',
        body: JSON.stringify({ email, code })
      });
      authUi.busy = false;
      if (r.ok && r.data?.accessToken) {
        state.authVerifyReg = false;
        state.regVerifyCode = '';
        await applyServerSession(r.data, '¡Correo verificado con éxito! Tu agencia ya está activa.');
        return;
      }
      setAuthError(friendlyError(r.data, r.status));
    }

    /** Lo único que el proveedor no sabe. Solo se usa si la persona lo escribió al crear la cuenta. */
    function socialAgencyName() {
      return isRegisterTab() ? String(state.authAgencyName || '').trim() : '';
    }

    function isRegisterTab() {
      return Boolean(state.authRegister) && APP_CONFIG.registrationEnabled !== false;
    }

    function setAuthTab(register) {
      state.authRegister = register;
      authUi.error = '';
      render();
    }

    async function submitSocialToken(provider, token) {
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/social', {
        method: 'POST',
        body: JSON.stringify({
          provider,
          idToken: token,
          agencyName: socialAgencyName() || undefined,
          deviceInfo: 'Web'
        })
      });
      if (r.ok) { await applyServerSession(r.data); return; }
      setAuthError(friendlyError(r.data, r.status));
    }

    function startOAuthRedirect(provider) {
      if (authUi.busy) return;
      const q = new URLSearchParams({ agencyName: socialAgencyName() });
      window.location.href = `${API_BASE}/auth/oauth/${provider}?${q.toString()}`;
    }

    function loadExternalScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
        const s = document.createElement('script');
        s.src = src; s.async = true; s.defer = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('load'));
        document.head.appendChild(s);
      });
    }

    async function initSocialProviders() {
      if (window.location.protocol === 'file:') return;
      if (!authUi.cfg) {
        try {
          const r = await fetch(API_BASE + '/auth/social/config');
          authUi.cfg = await r.json();
        } catch (_) { authUi.cfg = {}; return; }
      }
      if (authUi.cfg.googleClientId && !authUi.googleReady) {
        try {
          await loadExternalScript('https://accounts.google.com/gsi/client');
          window.google.accounts.id.initialize({
            client_id: authUi.cfg.googleClientId,
            callback: (resp) => { if (resp && resp.credential) submitSocialToken('GOOGLE', resp.credential); },
            ux_mode: 'popup'
          });
          authUi.googleReady = true;
        } catch (_) {}
      }
      if (authUi.cfg.facebookAppId && !authUi.facebookReady) {
        try {
          await loadExternalScript('https://connect.facebook.net/es_LA/sdk.js');
          window.FB.init({ appId: authUi.cfg.facebookAppId, cookie: false, xfbml: false, version: 'v19.0' });
          authUi.facebookReady = true;
        } catch (_) {}
      }
      mountSocialButtons();
    }

    window.__onAndroidGoogleToken = function(idToken, errMsg) {
      if (idToken) {
        submitSocialToken('GOOGLE', idToken);
      } else if (errMsg) {
        setAuthError(errMsg);
      }
    };

    function mountSocialButtons() {
      const slot = document.getElementById('google-btn-slot');
      if (slot && window.ContentSyncAndroid && typeof window.ContentSyncAndroid.signInWithGoogle === 'function') {
        if (!slot.hasChildNodes()) {
          slot.innerHTML = `
            <button type="button" class="btn btn-outline" style="width:100%;height:42px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;"
              onclick="window.ContentSyncAndroid.signInWithGoogle();">
              <span style="font-weight:800;font-size:15px;color:#4285F4;">G</span>
              <span>Continuar con Google</span>
            </button>
          `;
        }
      } else if (slot && authUi.googleReady && !slot.hasChildNodes()) {
        const light = document.documentElement.getAttribute('data-theme') === 'light';
        window.google.accounts.id.renderButton(slot, {

    async function requestRecoveryCode() {
      if (authUi.busy) return;
      const email = String(state.authEmail || '').trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        setAuthError('Ingresá un correo electrónico válido.');
        return;
      }
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/forgot-password', {
        method: 'POST',
        body: JSON.stringify({ email })
      });
      authUi.busy = false;
      if (r.ok) {
        state.authRecoverStep = 2;
        state.recoveryCode = '';
        state.recoveryNewPass = '';
        authUi.error = '';
        render();
      } else {
        setAuthError(friendlyError(r.data, r.status));
      }
    }

    async function verifyRecoveryOtpStep() {
      if (authUi.busy) return;
      const email = String(state.authEmail || '').trim();
      const code = String(state.recoveryCode || '').trim();
      if (!/^\d{6}$/.test(code)) {
        setAuthError('Ingresá el código numérico de 6 dígitos que enviamos a tu correo.');
        return;
      }
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/verify-otp', {
        method: 'POST',
        body: JSON.stringify({ email, code })
      });
      authUi.busy = false;
      if (r.ok && r.data?.verified) {
        state.authRecoverStep = 3;
        authUi.error = '';
        render();
      } else {
        setAuthError(friendlyError(r.data, r.status));
      }
    }

    async function submitPasswordReset() {
      if (authUi.busy) return;
      const email = String(state.authEmail || '').trim();
      const token = String(state.recoveryCode || '').trim();
      const newPassword = state.recoveryNewPass || '';
      if (!token) { setAuthError('Ingresá el código de verificación de 6 dígitos.'); return; }
      if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,64}$/.test(newPassword)) {
        setAuthError('La contraseña debe tener al menos 8 caracteres, con mayúscula, minúscula, número y un símbolo.');
        return;
      }
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ email, token, newPassword })
      });
      authUi.busy = false;
      if (r.ok) {
        state.authRecover = false;
        state.authRecoverStep = 1;
        state.authPass = newPassword;
        state.recoveryCode = '';
        state.recoveryNewPass = '';
        authUi.error = '';
        if (r.data?.session && r.data.session.accessToken) {
          await applyServerSession(
            r.data.session,
            r.data.message || '¡Contraseña guardada en tu cuenta! Ya podés iniciar sesión por el campo común cuando quieras.'
          );
          return;
        }
        setBanner(r.data?.message || '¡Contraseña guardada! Ya podés iniciar sesión con tu clave.');
      } else {
        setAuthError(friendlyError(r.data, r.status));
      }
    }

    /** Las vistas previas locales ocupan memoria hasta liberarlas. */

      });

    function handleBlockFilesSelected(inputEl) {
      const files = Array.from(inputEl.files || []);
      inputEl.value = '';
      if (files.length === 0) return;
      const maxMb = Number(APP_CONFIG.uploadMaxMb) || 0;
      const rejected = [];
      for (const file of files) {
        // Algunos navegadores no informan el tipo: en ese caso decide el servidor, que mira el contenido.
        const isMedia = !file.type || file.type.startsWith('image/') || file.type.startsWith('video/');
        if (!isMedia) { rejected.push(file.name + ' no es una foto ni un video'); continue; }
        if (maxMb && file.size > maxMb * 1024 * 1024) { rejected.push(file.name + ' supera los ' + maxMb + ' MB'); continue; }
        if (state.blkMedia.length >= MAX_MEDIA_PER_BLOCK) { rejected.push('cada bloque admite hasta ' + MAX_MEDIA_PER_BLOCK + ' archivos'); break; }
        state.blkMedia.push({
          file,
          storageKey: '',
          previewUrl: URL.createObjectURL(file),
          kind: file.type.startsWith('video/') ? 'VIDEO' : 'IMAGE',
          description: '',
          sizeBytes: file.size,
          originalName: file.name
        });
      }
      state.blkError = rejected.length ? 'No se agregó: ' + rejected.join('; ') + '.' : '';
      render();
    }

    function moveBlockMedia(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= state.blkMedia.length) return;
      const [item] = state.blkMedia.splice(index, 1);
      state.blkMedia.splice(target, 0, item);
      render();
    }

    function removeBlockMedia(index) {
      const [item] = state.blkMedia.splice(index, 1);
      if (item?.previewUrl) URL.revokeObjectURL(item.previewUrl);
      render();
    }

    async function uploadFileWithProgress(file, clientId, onProgress) {
      // Una subida larga no puede reintentarse sola: el token y el tamaño se comprueban antes de empezar.
      const uploadConfig = await apiFetch('/media/upload-config');
      if (uploadConfig.status === 401) await refreshSession();
      const maxMb = uploadConfig.data && uploadConfig.data.maxMb;
      const tooBig = maxMb ? `${file.name} pesa demasiado: el máximo es de ${maxMb} MB.` : `${file.name} pesa demasiado.`;
      if (maxMb && file.size > maxMb * 1024 * 1024) throw new Error(tooBig);
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const form = new FormData();
        form.append('clientId', clientId);
        form.append('file', file);

        xhr.open('POST', API_BASE + '/media/upload');
        if (state.jwtToken) {
          xhr.setRequestHeader('Authorization', 'Bearer ' + state.jwtToken);
        }

        xhr.upload.onprogress = (ev) => {
          if (ev.lengthComputable && onProgress) onProgress(ev.loaded / ev.total);
        };

        xhr.onload = () => {
          if (xhr.status === 413) return reject(new Error(tooBig));
          try {
            const parsed = JSON.parse(xhr.responseText || '{}');
            if (xhr.status >= 200 && xhr.status < 300) resolve(parsed);
            else reject(new Error(parsed.message || 'No se pudo subir el archivo.'));
          } catch (_) {
            reject(new Error('Respuesta inesperada al subir el archivo.'));
          }
        };
        xhr.onerror = () => reject(new Error('Se cortó la conexión mientras se subía el archivo.'));
        xhr.send(form);
      });
    }

    async function submitBlockModal() {
      if (state.blkSaving) return;
      const sched = getActiveSchedule();
      if (!sched) return;

      const blockTitle = state.blkTitle.trim();
      if (!blockTitle) {
        state.blkError = 'Escribí un título para el bloque.';
        render();
        return;
      }

      state.blkSaving = true;
      state.blkError = '';
      render();

      // Se suben de a uno: si uno falla, los que ya subieron no se vuelven a enviar al reintentar.
      const pending = state.blkMedia.filter(m => m.file);
      for (let i = 0; i < pending.length; i++) {
        const item = pending[i];
        try {
          const uploaded = await uploadFileWithProgress(item.file, sched.clientId, (fraction) => {
            state.blkUploadProgress = Math.max(3, Math.round(((i + fraction) / pending.length) * 100));
            const fill = document.getElementById('blk-upload-bar');
            const pct = document.getElementById('blk-upload-pct');
            if (fill) fill.style.width = state.blkUploadProgress + '%';
            if (pct) pct.textContent = state.blkUploadProgress + '%';
          });
          item.storageKey = uploaded.storageKey;
          item.sizeBytes = uploaded.sizeBytes || item.sizeBytes;
          item.kind = uploaded.kind || item.kind;
          item.file = null;
        } catch (e) {
          state.blkSaving = false;
          state.blkUploadProgress = 0;
          state.blkError = e.message || 'No pudimos subir uno de los archivos.';
          render();
          return;
        }
      }

      const payload = {
        dayOfWeek: state.blkDay,
        contentType: state.blkContentType,
        productionStatus: state.blkProductionStatus,
        blockTitle,
        noteColor: state.blkColor,
        notes: state.blkNotes.trim(),
        caption: state.blkCaption.trim(),
        plannedTime: state.blkTime || '18:00',
        media: state.blkMedia.map(m => ({
          storageKey: m.storageKey,
          description: (m.description || '').trim(),
          sizeBytes: Math.round(m.sizeBytes || 0),
          originalName: m.originalName || undefined
        }))
      };

      const wasEditing = Boolean(state.editingBlockId);
      const r = await apiFetch(wasEditing ? `/schedules/blocks/${state.editingBlockId}` : `/schedules/${sched.id}/blocks`, {
        method: wasEditing ? 'PATCH' : 'POST',
        body: JSON.stringify(payload)
      });

      state.blkSaving = false;
      state.blkUploadProgress = 0;

      if (!r.ok) {
        state.blkError = friendlyError(r.data, r.status);
        render();
        return;
      }

      releaseBlockPreviews();
      state.blkMedia = [];
      state.blockModalOpen = false;
      await hydrateFromApi();
      setBanner(wasEditing ? 'Bloque actualizado.' : 'Bloque agregado al cronograma. Le avisamos al cliente.');
    }

    async function submitBlockReview(blockId, decision, confirmed = false) {
      const block = (getActiveSchedule()?.items || []).find(x => x.id === blockId);
      const feedbackNotes = inspectNoteOf(blockId).trim();
      const hadChanges = block?.reviewStatus === 'CHANGES_REQUESTED';

      if (!confirmed) {
        const dropsChanges = decision !== 'CHANGES_REQUESTED' && hadChanges;
        const dropsText = decision === 'APPROVED' && feedbackNotes;
        if (dropsChanges || dropsText) {
          state.reviewConfirm = { blockId, decision, hadChanges, hasText: Boolean(feedbackNotes) };
          render();
          return;
        }
        if (decision !== 'APPROVED' && feedbackNotes.length < 3) {
          setBanner('Contá brevemente qué cambiarías o por qué lo rechazás.', true);
          return;
        }
      }

      state.reviewConfirm = null;
      const r = await apiFetch(`/schedules/blocks/${blockId}/review`, {
        method: 'POST',
        // Confirmado el aviso, solo viaja la decisión: lo escrito no se le manda a la agencia.
        body: JSON.stringify({ decision, feedbackNotes: confirmed ? undefined : feedbackNotes || undefined })
      });
      if (!r.ok) {
        setBanner(friendlyError(r.data, r.status), true);
        return;
      }
      setInspectNote(blockId, '');
      await hydrateFromApi();
      setBanner('Listo: le avisamos a tu agencia.');
    }

    function renderReviewConfirm() {
      const { blockId, decision, hadChanges, hasText } = state.reviewConfirm;
      const rejecting = decision === 'REJECTED';
      const verb = rejecting ? 'rechazar' : 'aprobar';
      const past = rejecting ? 'rechazaste' : 'aprobaste';
      return `
        <div class="modal-backdrop modal-centered" onclick="if(event.target===this){state.reviewConfirm=null;render();}">
          <div class="modal-panel" role="alertdialog" aria-modal="true" style="max-width:440px;">
            <h3 style="font-size:18px;font-weight:700;">¿${rejecting ? 'Rechazar' : 'Aprobar'} este contenido?</h3>
            ${hadChanges ? `<p style="font-size:14px;color:var(--text-secondary);">Ya pediste cambios en este contenido. Si seguís, ese pedido queda sin efecto y no se vuelve a notificar.</p>` : ''}
            ${hasText ? `<p style="font-size:14px;color:var(--text-secondary);">Lo que escribiste en el comentario no se va a enviar.</p>` : ''}
            <p style="font-size:14px;font-weight:600;">A tu agencia solo le va a llegar que ${past} el contenido.</p>
            <div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;">
              <button class="btn btn-outline" onclick="state.reviewConfirm=null;render();">Volver</button>
              <button class="btn ${rejecting ? 'btn-fault' : 'btn-signal'}" onclick="submitBlockReview('${blockId}','${decision}',true)">Sí, ${verb}</button>
            </div>
          </div>
        </div>
      `;
    }

    function openIdeaModal(idea = null) {
      state.acceptingProposalId = null;
      state.ideaNewSectionOpen = state.ideaSections.length === 0;
      state.ideaNewSectionName = '';
      state.ideaNewSectionColor = nextSectionColor();
      state.ideaNewSectionError = '';
      if (idea) {
        state.editingIdeaId = idea.id;
        state.ideaFormSectionId = idea.sectionId;
        state.ideaFormClientId = idea.clientId || '';
        state.ideaFormTitle = idea.title;
        state.ideaFormContent = idea.content;
        state.ideaFormRefUrl = idea.referenceUrl || '';
        state.ideaFormPinned = Boolean(idea.isPinned);
      } else {
        state.editingIdeaId = null;
        state.ideaFormSectionId = state.ideaSections.some(sec => sec.id === state.ideaSectionFilter)
          ? state.ideaSectionFilter
          : state.ideaSections[0]?.id || '';
        state.ideaFormClientId =
          state.ideaClientFilter !== 'ALL' && state.ideaClientFilter !== 'GENERAL'
            ? state.ideaClientFilter
            : '';
        state.ideaFormTitle = '';
        state.ideaFormContent = '';
        state.ideaFormRefUrl = '';
        state.ideaFormPinned = false;
      }
      state.ideaModalOpen = true;
      render();
    }

    async function submitIdeaModal() {
      const title = state.ideaFormTitle.trim();
      const content = state.ideaFormContent.trim();
      if (!title || !content) {
        setBanner('Completá el título y el desarrollo de la idea.', true);
        return;
      }
      if (!state.ideaFormSectionId || state.ideaNewSectionOpen) {
        state.ideaNewSectionError = state.ideaNewSectionOpen ? 'Primero creá la sección con el botón de abajo.' : '';
        setBanner('Elegí una sección para la idea.', true);
        return;
      }

      if (state.acceptingProposalId) {
        const accepted = await apiFetch(`/idea-proposals/${state.acceptingProposalId}/accept`, {
          method: 'POST',
          body: JSON.stringify({
            sectionId: state.ideaFormSectionId,
            title,
            content,
            referenceUrl: state.ideaFormRefUrl.trim()
          })
        });
        if (!accepted.ok) {
          setBanner(friendlyError(accepted.data, accepted.status), true);
          return;
        }
        state.acceptingProposalId = null;
        state.ideaModalOpen = false;
        await hydrateFromApi();
        setBanner('Propuesta aceptada: ya está en tus ideas. Le avisamos al cliente.');
        return;
      }

      const payload = {
        sectionId: state.ideaFormSectionId,
        clientId: state.ideaFormClientId || undefined,
        title,
        content,
        referenceUrl: state.ideaFormRefUrl.trim() || undefined,
        isPinned: state.ideaFormPinned
      };

      const url = state.editingIdeaId ? `/ideas/${state.editingIdeaId}` : '/ideas';
      const method = state.editingIdeaId ? 'PATCH' : 'POST';
      const r = await apiFetch(url, { method, body: JSON.stringify(payload) });

      if (!r.ok) {
        setBanner(friendlyError(r.data, r.status), true);
        return;
      }

      state.ideaModalOpen = false;
      await hydrateFromApi();
      setBanner(state.editingIdeaId ? 'Idea actualizada.' : 'Idea guardada en tu espacio privado.');
    }

    async function togglePinIdea(ideaId, currentPinned) {
      const r = await apiFetch(`/ideas/${ideaId}`, {
        method: 'PATCH',
        body: JSON.stringify({ isPinned: !currentPinned })
      });
      if (r.ok) await hydrateFromApi();
    }

    async function deleteIdeaConfirmed(ideaId) {
      const r = await apiFetch(`/ideas/${ideaId}`, { method: 'DELETE' });
      state.confirmDeleteIdeaId = null;
      if (!r.ok) {
        setBanner(friendlyError(r.data, r.status), true);
        return;
      }
      await hydrateFromApi();
      setBanner('Idea eliminada.');
    }

    function sendIdeaToPlan(ideaId) {
      const idea = state.ideas.find(x => x.id === ideaId);
      if (!idea) return;
      if (idea.clientId) {
        state.selectedClientId = idea.clientId;
        syncSelectedScheduleForClient();
      }
      state.activeTab = 'schedules';
      const sched = getActiveSchedule();
      if (!sched) {
        openNewWeekModal();
        return;
      }
      openBlockModal(1, null);
      state.blkTitle = idea.title;
      state.blkNotes = idea.content;
      if (idea.section?.color) state.blkColor = idea.section.color;
      render();
    }

    // =========================================================================
    async function createClientFromForm() {
      const companyName = (document.getElementById('cl-name')?.value || '').trim();
      const industry = (document.getElementById('cl-ind')?.value || '').trim();
      const fullName = (document.getElementById('cl-contact')?.value || '').trim() || 'Responsable de Marca';
      const email = (document.getElementById('cl-mail')?.value || '').trim();

      if (!companyName) { setBanner('Ingresá el nombre de la empresa o marca.', true); return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setBanner('Ingresá un correo electrónico válido para el cliente.', true); return; }

      const r = await apiFetch('/clients', {
        method: 'POST',
        body: JSON.stringify({ companyName, industry, fullName, email })
      });

      if (!r.ok) {
        setBanner(friendlyError(r.data, r.status), true);
        return;
      }

      state.showNewClientForm = false;
      await hydrateFromApi();
      if (r.data && r.data.emailSent === false) {
        setBanner(`Creamos el perfil de "${companyName}", pero no pudimos enviar el correo a ${email}. Probá con "Reenviar" en unos minutos.`, true);
        return;
      }
      setBanner(
        `Solicitud enviada a ${email}. El perfil de "${companyName}" se activará apenas el cliente presione "Sí, soy yo" en su notificación.`
      );
    }

    async function resendClientConfirmation(clientId) {
      const r = await apiFetch(`/clients/${clientId}/resend-confirmation`, { method: 'POST' });
      if (!r.ok) {
        setBanner(friendlyError(r.data, r.status), true);
        return;
      }
      if (r.data && r.data.emailSent === false) {
        setBanner('No pudimos enviar el correo de confirmación. Probá de nuevo en unos minutos.', true);
        return;
      }
      setBanner('Reenviamos la notificación y el correo de confirmación "Sí, soy yo" al cliente.');
    }

    async function deleteClientConfirmed(clientId) {
      const r = await apiFetch(`/clients/${clientId}`, { method: 'DELETE' });
      state.confirmDeleteClientId = null;
      if (!r.ok) {
        setBanner(friendlyError(r.data, r.status), true);
        return;
      }
      await hydrateFromApi();
      setBanner('Cliente eliminado correctamente.');
    }

    async function respondClientIdentity(clientId, decision) {
      const r = await apiFetch(`/clients/${clientId}/confirm-identity`, {
        method: 'POST',
        body: JSON.stringify({ decision })
      });

      if (!r.ok) {
        setBanner(friendlyError(r.data, r.status), true);
        return;
      }

      if (decision === 'REJECT') {
        logoutSession();
        setBanner('Rechazaste la vinculación. Tu correo electrónico fue liberado por seguridad.');
        return;
      }

      await hydrateFromApi();
      setBanner(r.data.message || '¡Identidad confirmada! Ya podés ver el cronograma de tu marca.');
    }

    /** Abrir Avisos cuenta como haberlos visto. Se ven resaltados esta vez y el contador baja en el próximo dibujado. */
    let markingNotifications = false;
    async function markAllNotificationsRead() {
      if (markingNotifications || !state.notifications.some(n => !n.isRead)) return;
      markingNotifications = true;
      const r = await apiFetch('/notifications/read-all', { method: 'PATCH' });
      markingNotifications = false;
      if (r.ok) state.notifications.forEach(n => { n.isRead = true; });
    }

          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg>

        <button id="github-btn" type="button" class="btn" style="display:flex;width:100%;height:42px;align-items:center;justify-content:center;gap:10px;background:#24292F;border:1px solid var(--border-strong);color:#ffffff;font-weight:600;font-size:13px;border-radius:4px;"
          onclick="startOAuthRedirect('github')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
