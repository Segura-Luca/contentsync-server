<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContentSync — Planificación, Ideas y Publicación Multired</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html[data-theme="dark"] {
      --canvas: #0B0C0E;
      --stage: #111318;
      --inspector: #151820;
      --elevated: #1B1F29;
      --hairline: #232732;
      --border-strong: #373E4E;
      --text-primary: #F2F3F5;
      --text-secondary: #9DA4B3;
      --text-muted: #6E7687;
      --signal: #D4F238;
      --on-signal: #0B0C0E;
      --signal-subtle-bg: #20250F;
      --signal-subtle-fg: #E0F85E;
      --tally-live: #34D399;
      --tally-live-bg: #0A291F;
      --tally-warn: #FBBF24;
      --tally-warn-bg: #2B1D07;
      --tally-fault: #F87171;
      --tally-fault-bg: #2D1114;
      --scrim: rgba(5, 6, 8, 0.78);

      --note-amber-fg: #FBBF24; --note-amber-bg: rgba(251, 191, 36, 0.10);
      --note-emerald-fg: #34D399; --note-emerald-bg: rgba(52, 211, 153, 0.10);
      --note-sky-fg: #38BDF8; --note-sky-bg: rgba(56, 189, 248, 0.10);
      --note-rose-fg: #FB7185; --note-rose-bg: rgba(251, 113, 133, 0.10);
      --note-violet-fg: #A78BFA; --note-violet-bg: rgba(167, 139, 250, 0.11);
      --note-lime-fg: #D4F238; --note-lime-bg: rgba(212, 242, 56, 0.10);
    }

    html[data-theme="light"] {
      --canvas: #F4F3EF;
      --stage: #FAF9F6;
      --inspector: #EEECE5;
      --elevated: #E4E1D8;
      --hairline: #D4D0C5;
      --border-strong: #9C9689;
      --text-primary: #141518;
      --text-secondary: #484C56;
      --text-muted: #6B707B;
      --signal: #141518;
      --on-signal: #FAF9F6;
      --signal-subtle-bg: #E3F191;
      --signal-subtle-fg: #2A3800;
      --tally-live: #065F46;
      --tally-live-bg: #D1FAE5;
      --tally-warn: #92400E;
      --tally-warn-bg: #FEF3C7;
      --tally-fault: #991B1B;
      --tally-fault-bg: #FEE2E2;
      --scrim: rgba(20, 21, 24, 0.54);

      --note-amber-fg: #B45309; --note-amber-bg: #FEF3C7;
      --note-emerald-fg: #047857; --note-emerald-bg: #D1FAE5;
      --note-sky-fg: #0369A1; --note-sky-bg: #E0F2FE;
      --note-rose-fg: #BE123C; --note-rose-bg: #FFE4E6;
      --note-violet-fg: #6D28D9; --note-violet-bg: #EDE9FE;
      --note-lime-fg: #3F6212; --note-lime-bg: #ECFCCB;
    }

    html, body { max-width: 100%; overflow-x: hidden; }

    body {
      background: var(--canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .eyebrow {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    h1, h2, h3, .display-tight {
      letter-spacing: -0.025em;
      line-height: 1.18;
    }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .input {
      width: 100%;
      background: var(--canvas);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 9px 11px;
      font-size: 14px;
      transition: border-color 120ms ease;
    }

    .input:focus {
      outline: none;
      border-color: var(--signal-subtle-fg);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 4px;
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border: 1px solid transparent;
      transition: opacity 120ms ease, border-color 120ms ease, background 120ms ease, transform 120ms ease;
      white-space: nowrap;
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }

    .btn-signal { background: var(--signal); color: var(--on-signal); border-color: var(--signal); }
    .btn-signal:hover:not(:disabled) { opacity: 0.9; }

    .btn-live { background: var(--tally-live); color: #FFFFFF; border-color: var(--tally-live); }
    html[data-theme="dark"] .btn-live { color: #042414; }

    .btn-outline { background: var(--stage); color: var(--text-primary); border-color: var(--border-strong); }
    .btn-outline:hover:not(:disabled) { background: var(--elevated); }

    .btn-warn { background: var(--tally-warn-bg); color: var(--tally-warn); border-color: var(--tally-warn); }
    .btn-fault { background: var(--tally-fault-bg); color: var(--tally-fault); border-color: var(--tally-fault); }

    .brand-mark { display: inline-flex; align-items: flex-end; gap: 2.5px; height: 18px; }
    .brand-mark span {
      width: 3px;
      background: var(--signal-subtle-fg);
      display: block;
      transform-origin: bottom center;
      transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1), opacity 240ms ease;
    }
    html[data-theme="light"] .brand-mark span { background: var(--text-primary); }
    .brand-mark span:nth-child(1) { height: 18px; }
    .brand-mark span:nth-child(2) { height: 11px; opacity: 0.72; }
    .brand-mark span:nth-child(3) { height: 16px; }
    .topbar:hover .brand-mark span:nth-child(1), .brand-mark.active span:nth-child(1) { animation: studioEq1 1.3s ease-in-out infinite alternate; }
    .topbar:hover .brand-mark span:nth-child(2), .brand-mark.active span:nth-child(2) { animation: studioEq2 1.1s ease-in-out infinite alternate; }
    .topbar:hover .brand-mark span:nth-child(3), .brand-mark.active span:nth-child(3) { animation: studioEq3 1.45s ease-in-out infinite alternate; }

    .tally-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      vertical-align: middle;
      animation: tallyBreath 3.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    .tally-dot.static { animation: none; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 3px;
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      border: 1px solid var(--border-strong);
      background: var(--elevated);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .badge-review { background: var(--signal-subtle-bg); color: var(--signal-subtle-fg); border-color: var(--signal-subtle-fg); }
    .badge-live { background: var(--tally-live-bg); color: var(--tally-live); border-color: var(--tally-live); }
    .badge-warn { background: var(--tally-warn-bg); color: var(--tally-warn); border-color: var(--tally-warn); }
    .badge-fault { background: var(--tally-fault-bg); color: var(--tally-fault); border-color: var(--tally-fault); }

    .tri-conduit {
      display: inline-flex;
      align-items: center;
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 11px;
      font-weight: 600;
    }
    .tri-node {
      padding: 2px 5px;
      border-radius: 2px;
      border: 1px solid var(--border-strong);
      background: var(--elevated);
      color: var(--text-primary);
      line-height: 1.2;
    }
    .tri-node.off { background: transparent; border-color: var(--hairline); color: var(--text-muted); font-weight: 400; }
    .tri-node.live { background: var(--tally-live-bg); border-color: var(--tally-live); color: var(--tally-live); }
    .tri-node.warn { background: var(--tally-warn-bg); border-color: var(--tally-warn); color: var(--tally-warn); }
    .tri-node.fault { background: var(--tally-fault-bg); border-color: var(--tally-fault); color: var(--tally-fault); }
    .tri-wire {
      position: relative;
      width: 8px;
      height: 1px;
      background: var(--border-strong);
      display: inline-block;
      overflow: hidden;
    }
    .tri-wire.flowing::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent 0%, var(--signal-subtle-fg) 55%, transparent 100%);
      animation: wirePacket 2.6s linear infinite;
    }

    .reel-frame {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px;
      color: #F8FAFC;
    }
    .reel-tag {
      position: relative;
      z-index: 2;
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 11px;
      line-height: 1.1;
      padding: 2px 5px;
      border-radius: 2px;
      background: rgba(8, 10, 14, 0.78);
      color: #F8FAFC;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--stage);
      border-bottom: 1px solid var(--hairline);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .feedback-bar {
      padding: 10px 18px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }
    .feedback-bar.ok { background: var(--signal-subtle-bg); color: var(--signal-subtle-fg); }
    .feedback-bar.err { background: var(--tally-fault-bg); color: var(--tally-fault); }

    .security-confirm-banner {
      background: var(--tally-warn-bg);
      border-bottom: 2px solid var(--tally-warn);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .studio-shell {
      display: flex;
      min-height: calc(100vh - 57px);
    }

    .side-rail {
      width: 196px;
      flex-shrink: 0;
      background: var(--stage);
      border-right: 1px solid var(--hairline);
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .rail-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      text-align: left;
      color: var(--text-muted);
      border-left: 3px solid transparent;
      font-size: 13px;
      transition: background 120ms ease, color 120ms ease;
    }
    .rail-item:hover { background: var(--inspector); color: var(--text-primary); }
    .rail-item.active {
      background: var(--inspector);
      color: var(--text-primary);
      font-weight: 600;
      border-left-color: var(--signal-subtle-fg);
    }
    html[data-theme="light"] .rail-item.active { border-left-color: var(--text-primary); }

    .workspace-content { flex: 1; min-width: 0; }
    .bottom-bar { display: none; }

    /* ==========================================================================
       CUADRÍCULA SEMANAL LUNES A VIERNES (SECCIÓN PLAN)
       ========================================================================== */
    .plan-page {
      padding: 20px 22px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .week-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--stage);
      border: 1px solid var(--hairline);
      border-radius: 5px;
      padding: 12px 15px;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(210px, 1fr));
      gap: 12px;
      align-items: stretch;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .day-column {
      background: var(--stage);
      border: 1px solid var(--hairline);
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      min-height: 410px;
      transition: border-color 150ms ease;
    }
    .day-column:hover { border-color: var(--border-strong); }

    .day-col-header {
      padding: 11px 12px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--inspector);
      border-radius: 5px 5px 0 0;
    }

    .day-blocks-list {
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .day-col-footer {
      padding: 8px 10px 10px;
      border-top: 1px dashed var(--hairline);
    }

    .plan-block-card {
      position: relative;
      border-radius: 4px;
      border: 1px solid var(--hairline);
      border-left: 4px solid var(--note-fg, var(--signal-subtle-fg));
      background: var(--note-bg, var(--elevated));
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
      text-align: left;
      transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1), border-color 150ms ease;
    }
    .plan-block-card:hover {
      transform: translateY(-2px);
      border-color: var(--note-fg, var(--border-strong));
    }

    .color-AMBER   { --note-fg: var(--note-amber-fg);   --note-bg: var(--note-amber-bg); }
    .color-EMERALD { --note-fg: var(--note-emerald-fg); --note-bg: var(--note-emerald-bg); }
    .color-SKY     { --note-fg: var(--note-sky-fg);     --note-bg: var(--note-sky-bg); }
    .color-ROSE    { --note-fg: var(--note-rose-fg);    --note-bg: var(--note-rose-bg); }
    .color-VIOLET  { --note-fg: var(--note-violet-fg);  --note-bg: var(--note-violet-bg); }
    .color-LIME    { --note-fg: var(--note-lime-fg);    --note-bg: var(--note-lime-bg); }

    .swatch-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .swatch-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--hairline);
      background: var(--canvas);
      font-size: 12px;
      transition: border-color 140ms ease, background 140ms ease;
    }
    .swatch-btn.active {
      border-color: var(--note-fg);
      background: var(--note-bg);
      font-weight: 600;
    }
    .swatch-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--note-fg);
      display: inline-block;
    }

    /* ==========================================================================
       IDEAS DE CONTENIDO (PRIVADO DE AGENCIA)
       ========================================================================== */
    .ideas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(295px, 1fr));
      gap: 14px;
    }
    .idea-card {
      background: var(--stage);
      border: 1px solid var(--hairline);
      border-top: 3px solid var(--note-fg, var(--border-strong));
      border-radius: 5px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 150ms ease, transform 160ms ease;
    }
    .idea-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    /* ==========================================================================
       MODALES DEL ESTUDIO (CERO ALERTS DEL NAVEGADOR)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 65;
      background: var(--scrim);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-y: auto;
    }
    .modal-panel {
      width: 100%;
      max-width: 660px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--stage);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      animation: stageReveal 180ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .dropzone-video {
      border: 1px dashed var(--border-strong);
      background: var(--canvas);
      border-radius: 5px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease;
    }
    .dropzone-video:hover {
      border-color: var(--signal-subtle-fg);
      background: var(--inspector);
    }

    .auth-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 57px);
    }
    .auth-manifesto {
      background: var(--stage);
      border-right: 1px solid var(--hairline);
      padding: 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
    }
    .auth-console-wrap {
      padding: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seed-pass-card {
      padding: 12px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      text-align: left;
      background: var(--stage);
      transition: background 160ms ease, border-color 160ms ease, transform 180ms ease;
    }
    .seed-pass-card:hover {
      background: var(--elevated);
      border-color: var(--signal-subtle-fg);
      transform: translateY(-1px);
    }

    .router-schematic {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--hairline);
      background: var(--inspector);
      border-radius: 4px;
      max-width: 480px;
    }
    .router-master-box {
      padding: 6px 8px;
      border: 1px solid var(--border-strong);
      background: var(--stage);
      border-radius: 3px;
      flex-shrink: 0;
    }
    .router-svg { flex: 1; min-width: 72px; height: 44px; display: block; }
    .router-trace-base { fill: none; stroke: var(--border-strong); stroke-width: 1.2; }
    .router-trace-pulse {
      fill: none;
      stroke: var(--signal-subtle-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-dasharray: 18 110;
      animation: routerFlow 3.2s linear infinite;
    }
    html[data-theme="light"] .router-trace-pulse { stroke: var(--tally-live); }
    .router-trace-pulse.t2 { animation-delay: -0.45s; }
    .router-trace-pulse.t3 { animation-delay: -0.9s; }

    .s3-progress-fill {
      height: 100%;
      background-color: var(--signal-subtle-fg);
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.22) 0px,
        rgba(255, 255, 255, 0.22) 6px,
        transparent 6px,
        transparent 12px
      );
      background-size: 17px 17px;
      animation: s3Scan 0.8s linear infinite;
      transition: width 90ms linear;
    }

    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--hairline);
      background: var(--stage);
      border-radius: 4px;
    }
    .stat-cell {
      padding: 10px 14px;
      border-right: 1px solid var(--hairline);
    }
    .stat-cell:last-child { border-right: none; }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .filter-tab {
      padding: 6px 11px;
      border-radius: 3px;
      border: 1px solid var(--hairline);
      background: var(--stage);
      color: var(--text-secondary);
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 11px;
      text-transform: uppercase;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    }
    .filter-tab:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .filter-tab.active {
      background: var(--signal-subtle-bg);
      color: var(--signal-subtle-fg);
      border-color: var(--signal-subtle-fg);
      font-weight: 600;
    }

    .patchbay-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .patchbay-slot {
      text-align: left;
      padding: 11px;
      border-radius: 4px;
      background: var(--canvas);
      transition: border-color 160ms ease, background 160ms ease;
    }
    .patchbay-slot:hover { background: var(--inspector); }

    .page-pad {
      max-width: 1100px;
      padding: 22px;
    }

    .stage-enter { animation: stageReveal 200ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .feedback-enter { animation: bannerSlide 180ms cubic-bezier(0.22, 1, 0.36, 1) both; }

    @keyframes tallyBreath { 0%, 100% { opacity: 0.42; } 50% { opacity: 1; } }
    @keyframes wirePacket { 0% { transform: translateX(0); } 100% { transform: translateX(200%); } }
    @keyframes routerFlow { 0% { stroke-dashoffset: 128; } 100% { stroke-dashoffset: 0; } }
    @keyframes studioEq1 { 0% { transform: scaleY(0.68); } 100% { transform: scaleY(1); } }
    @keyframes studioEq2 { 0% { transform: scaleY(1.25); } 100% { transform: scaleY(0.65); } }
    @keyframes studioEq3 { 0% { transform: scaleY(0.75); } 100% { transform: scaleY(1.05); } }
    @keyframes stageReveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bannerSlide { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes s3Scan { from { background-position: 0 0; } to { background-position: 17px 0; } }

    @media (max-width: 959px) {
      .side-rail { display: none; }
      .studio-shell { display: block; width: 100%; padding-bottom: 70px; }
      .auth-split { grid-template-columns: minmax(0, 1fr); }
      .auth-manifesto { padding: 22px 14px; border-right: none; border-bottom: 1px solid var(--hairline); }
      .auth-console-wrap { padding: 22px 14px; }
      .seed-passes-grid { grid-template-columns: 1fr !important; }
      .plan-page { padding: 14px; }
      .week-grid { grid-template-columns: minmax(0, 1fr); }
      .day-column { min-height: auto; }
      .stats-strip { grid-template-columns: repeat(2, 1fr); }
      .page-pad { padding: 14px; width: 100%; }
      .patchbay-grid { grid-template-columns: minmax(0, 1fr); }
      .bottom-bar {
        position: fixed;
        bottom: 0;

        z-index: 35;

        background: var(--stage);

      }
      .bottom-item {
        flex: 1;
        min-width: 0;
        padding: 7px 2px 9px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        color: var(--text-muted);
        border-top: 2px solid transparent;
        font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
        font-size: 11px;
      }
      .bottom-item.active {
        color: var(--text-primary);
        font-weight: 700;
        border-top-color: var(--signal-subtle-fg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const PLATFORM_LIMITS = {
      INSTAGRAM: { code: 'IG', name: 'Instagram Reels', maxSec: 900, maxMb: 1024 },
      TIKTOK:    { code: 'TT', name: 'TikTok',          maxSec: 600, maxMb: 500 },
      YOUTUBE:   { code: 'YT', name: 'YouTube Shorts',  maxSec: 180, maxMb: 2048 }
    };

    const WEEKDAYS = [
      { num: 1, code: 'LUN', full: 'Lunes' },
      { num: 2, code: 'MAR', full: 'Martes' },
      { num: 3, code: 'MIÉ', full: 'Miércoles' },
      { num: 4, code: 'JUE', full: 'Jueves' },
      { num: 5, code: 'VIE', full: 'Viernes' }
    ];

    const NOTE_COLORS = [
      { code: 'AMBER',   label: 'Ámbar' },
      { code: 'EMERALD', label: 'Verde' },
      { code: 'SKY',     label: 'Azul' },
      { code: 'ROSE',    label: 'Coral' },
      { code: 'VIOLET',  label: 'Violeta' },
      { code: 'LIME',    label: 'Lima' }
    ];

    const REEL_PALETTES = [
      'linear-gradient(165deg, #2E1E18 0%, #5D3A29 55%, #0F1014 100%)',
      'linear-gradient(165deg, #172722 0%, #2D5245 55%, #0D1210 100%)',
      'linear-gradient(165deg, #292216 0%, #6B5129 55%, #12100C 100%)',
      'linear-gradient(165deg, #1B2130 0%, #374563 55%, #0E1017 100%)'
    ];

    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000/api/v1' : '/api/v1';

    const state = {
      theme: 'dark',
      apiOnline: false,
      jwtToken: null,
      session: null,
      activeTab: 'schedules',
      banner: null,
      loadingData: false,

      // Auth
      authRegister: false,
      authVerifyReg: false,
      regVerifyCode: '',
      authRecover: false,
      authRecoverMode: 'RECOVER',
      authRecoverStep: 1,
      recoveryCode: '',
      recoveryNewPass: '',
      authEmail: '',
      authPass: '',
      authFirstName: '',
      authLastName: '',
      authName: '',
      authAgencyName: '',

      // Confirmación "Sí, soy yo" pendiente del cliente logueado
      pendingConfirmation: null,

      // Datos sincronizados desde MySQL
      agencies: [],
      clients: [],
      schedules: [],
      duplicationLogs: [],
      ideaSections: [],
      ideas: [],
      videos: [],
      notifications: [],

      // Estado de Plan Semanal (Lunes a Viernes)
      selectedClientId: null,
      selectedScheduleId: null,

      // Subida de video individual (fuera del Plan)
      upClientId: '',
      upFile: null,
      upPreviewUrl: '',
      upTitle: '',
      upDesc: '',
      upTags: '',
      upDur: 30,
      upSizeBytes: 0,
      upMime: 'video/mp4',
      upPlatIG: true,
      upPlatTT: true,
      upPlatYT: true,
      upMode: 'NOW',
      upWhen: '',
      upProgress: 0,
      upSaving: false,
      upError: '',
      showNewWeekModal: false,
      newWeekStart: '',
      newWeekTitle: '',
      newWeekNotes: '',

      showDuplicateModal: false,
      dupTargetStart: '',
      dupTitle: '',
      dupIncludeVideos: true,
      dupNotes: '',
      showDuplicationLogs: false,

      // Modal de Bloque del Día (+ Subida de video desde Plan)
      blockModalOpen: false,
      editingBlockId: null,
      blkDay: 1,
      blkTime: '18:00',
      blkColor: 'AMBER',
      blkTitle: '',
      blkNotes: '',
      blkAttachVideo: false,
      blkAutoPublish: true,
      blkVideoFile: null,
      blkVideoPreviewUrl: '',
      blkExistingStorageKey: '',
      blkVideoTitle: '',
      blkVideoDesc: '',
      blkVideoTags: '#contenido #reels #shorts',
      blkVideoDur: 30,
      blkVideoSizeBytes: 12000000,
      blkVideoMime: 'video/mp4',
      blkPlatIG: true,
      blkPlatTT: true,
      blkPlatYT: true,
      blkShareFeed: true,
      blkAllowComments: true,
      blkAllowDuet: true,
      blkUploadProgress: 0,
      blkSaving: false,
      blkError: '',

      // Modal de Inspección / Visado de Bloque (Cliente y Agencia)
      inspectBlockId: null,
      confirmDeleteBlockId: null,

      // Estado de Ideas de Contenido (Privadas de Agencia)
      ideaSectionFilter: 'ALL',
      ideaClientFilter: 'ALL',
      ideaSearch: '',
      showNewSectionForm: false,
      newSectionName: '',
      newSectionColor: 'SKY',
      confirmDeleteSectionId: null,

      ideaModalOpen: false,
      editingIdeaId: null,
      ideaFormSectionId: '',
      ideaFormClientId: '',
      ideaFormTitle: '',
      ideaFormContent: '',
      ideaFormRefUrl: '',
      ideaFormPlatIG: true,
      ideaFormPlatTT: true,
      ideaFormPlatYT: true,
      ideaFormPinned: false,
      confirmDeleteIdeaId: null,

      // Clientes y Agencias
      showNewAgencyForm: false,
      showNewClientForm: false,
      confirmDeleteClientId: null,

      // Historial
      histQuery: '',
      histPlatform: null,

      // Modal de Conexión OAuth / Token Real de Plataformas (YouTube / Instagram / TikTok)
      platModalOpen: false,
      platModalClientId: null,
      platModalPlatform: null,
      platModalHandle: '',
      platModalExternalId: '',
      platModalAccessToken: '',
      platModalRefreshToken: '',
      platModalBusy: false,
      platModalError: ''
    };

    const motionState = {
      lastTab: null,
      lastBanner: null,
      animateStage: true,
      animateBanner: false
    };

    // =========================================================================
    // UTILIDADES Y FORMATEADORES
    // =========================================================================
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtTimecode(sec) {
      const s = Math.max(0, parseInt(sec || 0, 10));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }

    function reelBg(title) {
      let h = 0;
      const t = String(title || 'reel');
      for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
      return REEL_PALETTES[h % REEL_PALETTES.length];
    }

    function getMondayOf(dateObj) {
      const d = new Date(dateObj);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return d.toISOString().slice(0, 10);
    }

    function addDaysIso(isoDateStr, days) {
      const base = new Date(isoDateStr.slice(0, 10) + 'T12:00:00Z');
      base.setUTCDate(base.getUTCDate() + days);
      return base.toISOString().slice(0, 10);
    }

    function fmtShortDate(isoStr, plusDays = 0) {
      if (!isoStr) return '';
      const d = new Date(String(isoStr).slice(0, 10) + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() + plusDays);
      const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      return `${String(d.getUTCDate()).padStart(2, '0')} ${months[d.getUTCMonth()]}`;
    }

    function fmtDateTimeHuman(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return String(isoStr);
      return d.toLocaleString('es-AR', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      });
    }

    function workflowMeta(status) {
      switch (status) {
        case 'IN_REVIEW':         return { label: 'EN REVISIÓN', cls: 'badge-review' };
        case 'APPROVED':          return { label: 'APROBADO',    cls: 'badge-live' };
        case 'SCHEDULED':         return { label: 'PROGRAMADO',  cls: 'badge-live' };
        case 'PUBLISHED':         return { label: 'PUBLICADO',   cls: 'badge-live' };
        case 'CHANGES_REQUESTED': return { label: 'AJUSTES',     cls: 'badge-warn' };
        case 'REJECTED':          return { label: 'RECHAZADO',   cls: 'badge-fault' };
        default:                  return { label: 'BORRADOR',    cls: '' };
      }
    }

    function setBanner(msg, isErr = false) {
      state.banner = { msg, isErr };
      render();
    }

    function setTheme(next) {
      state.theme = next;
      document.documentElement.setAttribute('data-theme', next);
      render();
    }

    // =========================================================================
    // CLIENTE HTTP AUTENTICADO + HIDRATACIÓN DESDE MYSQL
    // =========================================================================
    async function apiFetch(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (!(options.body instanceof FormData) && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }
      if (state.jwtToken) {
        headers['Authorization'] = 'Bearer ' + state.jwtToken;
      }
      try {
        const res = await fetch(API_BASE + path, { ...options, headers });
        const data = await res.json().catch(() => ({}));
        return { ok: res.ok, status: res.status, data };
      } catch (_) {
        return {
          ok: false,
          status: 0,
          data: { message: 'No pudimos conectar con el servidor.' }
        };
      }
    }

    function friendlyError(body, status) {
      const m = body && body.message;
      if (Array.isArray(m)) return m[0];
      if (typeof m === 'string' && m.trim()) return m;
      if (status === 401) return 'Correo o contraseña incorrectos.';
      if (status === 429) return 'Demasiados intentos. Esperá unos segundos.';
      return 'No pudimos completar la acción. Intentá nuevamente.';
    }

    async function hydrateFromApi() {
      if (!state.jwtToken || !state.session) return;
      state.loadingData = true;
      render();

      const role = state.session.role;
      const calls = [
        apiFetch('/clients/pending-confirmation'),
        apiFetch('/clients'),
        apiFetch('/schedules'),
        apiFetch('/schedules/duplication-logs'),
        apiFetch('/videos'),
        apiFetch('/notifications'),
      ];

      if (role !== 'CLIENTE') {
        calls.push(apiFetch('/ideas/sections'));
        calls.push(apiFetch('/ideas'));
      }
      if (role === 'ADMIN_GENERAL') {
        calls.push(apiFetch('/agencies'));
      }

      const results = await Promise.all(calls);
      const [pendRes, clRes, schRes, dupRes, vidRes, notRes] = results;

      if (clRes.status === 401 && schRes.status === 401) {
        state.loadingData = false;
        logoutSession();
        setBanner('Tu sesión expiró. Volvé a iniciar sesión.');
        return;
      }

      state.pendingConfirmation = (pendRes.ok && pendRes.data?.pendingClient) || null;

      if (clRes.ok && Array.isArray(clRes.data)) {
        state.clients = clRes.data.map(normalizeClientFromApi);
      }
      if (schRes.ok && Array.isArray(schRes.data)) {
        state.schedules = schRes.data;
      }
      if (dupRes.ok && Array.isArray(dupRes.data)) {
        state.duplicationLogs = dupRes.data;
      }
      if (vidRes.ok && Array.isArray(vidRes.data)) {
        state.videos = vidRes.data;
      }
      if (notRes.ok && Array.isArray(notRes.data)) {
        state.notifications = notRes.data;
      }

      if (role !== 'CLIENTE') {
        const secRes = results[6];
        const idRes = results[7];
        if (secRes?.ok && Array.isArray(secRes.data)) state.ideaSections = secRes.data;
        if (idRes?.ok && Array.isArray(idRes.data)) state.ideas = idRes.data;
      }
      if (role === 'ADMIN_GENERAL') {
        const agRes = results[8];
        if (agRes?.ok && Array.isArray(agRes.data)) state.agencies = agRes.data;
      }

      // Seleccionar cliente y semana activos por defecto
      const confirmedClients = state.clients.filter(c => c.confirmationStatus === 'CONFIRMED');
      if (!state.selectedClientId || !confirmedClients.some(c => c.id === state.selectedClientId)) {
        state.selectedClientId = confirmedClients[0]?.id || state.clients[0]?.id || null;
      }
      syncSelectedScheduleForClient();

      state.loadingData = false;
      render();
    }

    function normalizeClientFromApi(c) {
      const conns = {
        INSTAGRAM: { connected: false, handle: '' },
        TIKTOK:    { connected: false, handle: '' },
        YOUTUBE:   { connected: false, handle: '' }
      };
      (c.platformConnections || []).forEach(pc => {
        if (conns[pc.platform] && pc.status === 'ACTIVE') {
          conns[pc.platform] = { connected: true, handle: pc.accountHandle };
        }
      });
      return {
        id: c.id,
        agencyId: c.agencyId,
        agencyName: c.agency?.name || 'Agencia',
        companyName: c.companyName,
        industry: c.industry || 'Marca',
        confirmationStatus: c.confirmationStatus || 'CONFIRMED',
        confirmedAt: c.confirmedAt,
        contactFullName: c.user?.fullName || 'Contacto',
        contactEmail: c.user?.email || '',
        connections: conns
      };
    }

    function syncSelectedScheduleForClient() {
      const clientSchedules = state.schedules.filter(s => s.clientId === state.selectedClientId);
      if (!clientSchedules.some(s => s.id === state.selectedScheduleId)) {
        state.selectedScheduleId = clientSchedules[0]?.id || null;
      }
    }

    // =========================================================================
    // AUTENTICACIÓN, REGISTRO, GOOGLE/FACEBOOK Y RECUPERACIÓN POR EMAIL
    // =========================================================================
    const authUi = { error: '', busy: false, cfg: null, googleReady: false, facebookReady: false };

    async function applyServerSession(data, welcome) {
      state.jwtToken = data.accessToken;
      state.apiOnline = true;
      const u = data.user || {};
      state.session = {
        id: u.id,
        email: u.email,
        fullName: u.fullName || u.email,
        role: u.role,
        timezone: u.timezone || 'America/Argentina/Buenos_Aires',
        agencyId: u.agencyId || null,
        clientId: u.clientId || null
      };
      try {
        localStorage.setItem('cs_jwt', state.jwtToken);
        localStorage.setItem('cs_user', JSON.stringify(state.session));
        sessionStorage.setItem('cs_jwt', state.jwtToken);
        sessionStorage.setItem('cs_user', JSON.stringify(state.session));
      } catch (_) {}

      authUi.error = '';
      authUi.busy = false;
      const first = String(state.session.fullName || '').split(' ')[0];
      state.banner = { msg: welcome || ('Hola, ' + first + '. Tu espacio está sincronizado.'), isErr: false };
      await hydrateFromApi();
    }

    function logoutSession() {
      if (state.jwtToken) {
        apiFetch('/auth/logout', { method: 'POST' });
      }
      state.session = null;
      state.jwtToken = null;
      state.pendingConfirmation = null;
      try {
        localStorage.removeItem('cs_jwt');
        localStorage.removeItem('cs_user');
        sessionStorage.removeItem('cs_jwt');
        sessionStorage.removeItem('cs_user');
      } catch (_) {}
      setBanner('Cerraste sesión correctamente.');
    }

    function setAuthError(msg) {
      authUi.error = msg;
      authUi.busy = false;
      render();
    }

    function areSocialProfileFieldsValid() {
      return (
        String(state.authFirstName || '').trim().length >= 2 &&
        String(state.authLastName || '').trim().length >= 2 &&
        String(state.authAgencyName || '').trim().length >= 2
      );
    }

    function updateSocialGuardState() {
      const overlay = document.getElementById('social-guard-overlay');
      const hint = document.getElementById('social-guard-hint');
      const ok = areSocialProfileFieldsValid();
      if (overlay) overlay.style.display = ok ? 'none' : 'block';
      if (hint) {
        hint.textContent = ok
          ? '✓ Datos listos: ya podés elegir tu cuenta de Google, Facebook o GitHub.'
          : 'Completá Nombre, Apellido y Nombre de la agencia arriba para habilitar Google, Facebook o GitHub.';
        hint.style.color = ok ? 'var(--tally-live)' : 'var(--text-muted)';
      }
    }

    function requireSocialProfileFields(providerLabel) {
      if (areSocialProfileFieldsValid()) return true;
      setAuthError(
        `Completá los campos de Nombre, Apellido y Nombre de la agencia antes de seleccionar tu cuenta de ${providerLabel}.`
      );
      setTimeout(() => {
        const el =
          (!String(state.authFirstName || '').trim() && document.getElementById('auth-first-name')) ||
          (!String(state.authLastName || '').trim() && document.getElementById('auth-last-name')) ||
          document.getElementById('auth-agency-name');
        if (el) el.focus();
      }, 30);
      return false;
    }

    async function performLogin(email, password) {
      if (authUi.busy) return;
      email = String(email || '').trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        setAuthError('Ingresá un correo electrónico válido.');
        return;
      }
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password: password || undefined })
      });
      authUi.busy = false;
      if (r.ok && r.data?.requiresPasswordCreation) {
        state.authEmail = r.data.email || email;
        state.authRecover = true;
        state.authRecoverMode = 'CREATE_GOOGLE_PASS';
        state.authRecoverStep = 2;
        state.recoveryCode = '';
        state.recoveryNewPass = '';
        authUi.error = '';
        setBanner(r.data.message || 'Te enviamos un código de 6 dígitos para comprobar tu identidad y crear tu contraseña.');
        return;
      }
      if (r.ok && r.data?.requiresEmailVerification) {
        state.authEmail = r.data.email || email;
        state.authVerifyReg = true;
        state.regVerifyCode = '';
        authUi.error = '';
        setBanner(r.data.message || 'Te enviamos un código de 6 dígitos para verificar tu correo.');
        return;
      }
      if (r.ok && r.data?.accessToken) {
        await applyServerSession(r.data);
        return;
      }
      setAuthError(friendlyError(r.data, r.status));
    }

    async function performRegister() {
      if (authUi.busy) return;
      const firstName = String(state.authFirstName || '').trim();
      const lastName = String(state.authLastName || '').trim();
      const agencyName = String(state.authAgencyName || '').trim();
      const email = String(state.authEmail || '').trim();
      const password = state.authPass || '';
      if (firstName.length < 2) { setAuthError('Ingresá tu nombre.'); return; }
      if (lastName.length < 2) { setAuthError('Ingresá tu apellido.'); return; }
      if (agencyName.length < 2) { setAuthError('Ingresá el nombre de tu agencia.'); return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setAuthError('Ingresá un correo electrónico válido.'); return; }
      if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,64}$/.test(password)) {
        setAuthError('La contraseña debe tener 8 o más caracteres, con mayúscula, minúscula, número y un símbolo.');
        return;
      }
      const fullName = `${firstName} ${lastName}`;
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          email,
          password,
          firstName,
          lastName,
          fullName,
          agencyName
        })
      });
      authUi.busy = false;
      if (r.ok && r.data?.requiresEmailVerification) {
        state.authVerifyReg = true;
        state.regVerifyCode = '';
        authUi.error = '';
        setBanner(
          r.data.message ||
            `Enviamos un código de 6 dígitos desde lucasegura2007@gmail.com a ${email}. Ingresalo para verificar tu cuenta.`
        );
        return;
      }
      if (r.ok && r.data?.accessToken) {
        await applyServerSession(r.data, 'Agencia creada con éxito. ¡Bienvenido/a, ' + firstName + '!');
        return;
      }
      setAuthError(friendlyError(r.data, r.status));
    }

    async function submitVerifyRegistration() {
      if (authUi.busy) return;
      const email = String(state.authEmail || '').trim();
      const code = String(state.regVerifyCode || '').trim();
      if (!/^\d{6}$/.test(code)) {
        setAuthError('Ingresá el código numérico de 6 dígitos que enviamos a tu correo.');
        return;
      }
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/verify-registration', {
        method: 'POST',
        body: JSON.stringify({ email, code })
      });
      authUi.busy = false;
      if (r.ok && r.data?.accessToken) {
        state.authVerifyReg = false;
        state.regVerifyCode = '';
        await applyServerSession(r.data, '¡Correo verificado con éxito! Tu agencia ya está activa.');
        return;
      }
      setAuthError(friendlyError(r.data, r.status));
    }

    async function submitSocialToken(provider, token) {
      if (!requireSocialProfileFields(provider === 'GOOGLE' ? 'Google' : provider)) return;
      const firstName = String(state.authFirstName || '').trim();
      const lastName = String(state.authLastName || '').trim();
      const agencyName = String(state.authAgencyName || '').trim();

    function startOAuthRedirect(provider) {

      const label = provider === 'facebook' ? 'Facebook' : 'GitHub';

    function loadExternalScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
        const s = document.createElement('script');
        s.src = src; s.async = true; s.defer = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('load'));
        document.head.appendChild(s);
      });
    }

    async function initSocialProviders() {
      if (window.location.protocol === 'file:') return;
      if (!authUi.cfg) {
        try {
          const r = await fetch(API_BASE + '/auth/social/config');
          authUi.cfg = await r.json();
        } catch (_) { authUi.cfg = {}; return; }
      }
      if (authUi.cfg.googleClientId && !authUi.googleReady) {
        try {
          await loadExternalScript('https://accounts.google.com/gsi/client');
          window.google.accounts.id.initialize({
            client_id: authUi.cfg.googleClientId,
            callback: (resp) => { if (resp && resp.credential) submitSocialToken('GOOGLE', resp.credential); },
            ux_mode: 'popup'
          });
          authUi.googleReady = true;
        } catch (_) {}
      }
      if (authUi.cfg.facebookAppId && !authUi.facebookReady) {
        try {
          await loadExternalScript('https://connect.facebook.net/es_LA/sdk.js');
          window.FB.init({ appId: authUi.cfg.facebookAppId, cookie: false, xfbml: false, version: 'v19.0' });
          authUi.facebookReady = true;
        } catch (_) {}

      mountSocialButtons();

    async function requestRecoveryCode() {
      if (authUi.busy) return;
      const email = String(state.authEmail || '').trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        setAuthError('Ingresá un correo electrónico válido.');
        return;
      }
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/forgot-password', {
        method: 'POST',
        body: JSON.stringify({ email })
      });
      authUi.busy = false;
      if (r.ok) {
        state.authRecoverStep = 2;
        state.recoveryCode = '';
        state.recoveryNewPass = '';
        authUi.error = '';
        render();
      } else {
        setAuthError(friendlyError(r.data, r.status));
      }
    }

    async function verifyRecoveryOtpStep() {
      if (authUi.busy) return;
      const email = String(state.authEmail || '').trim();
      const code = String(state.recoveryCode || '').trim();
      if (!/^\d{6}$/.test(code)) {
        setAuthError('Ingresá el código numérico de 6 dígitos que enviamos a tu correo.');
        return;
      }
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/verify-otp', {
        method: 'POST',
        body: JSON.stringify({ email, code })
      });
      authUi.busy = false;
      if (r.ok && r.data?.verified) {
        state.authRecoverStep = 3;
        authUi.error = '';
        render();
      } else {
        setAuthError(friendlyError(r.data, r.status));
      }
    }

    async function submitPasswordReset() {
      if (authUi.busy) return;
      const email = String(state.authEmail || '').trim();
      const token = String(state.recoveryCode || '').trim();
      const newPassword = state.recoveryNewPass || '';
      if (!token) { setAuthError('Ingresá el código de verificación de 6 dígitos.'); return; }
      if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,64}$/.test(newPassword)) {
        setAuthError('La contraseña debe tener al menos 8 caracteres, con mayúscula, minúscula, número y un símbolo.');
        return;
      }
      authUi.busy = true; authUi.error = ''; render();
      const r = await apiFetch('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ email, token, newPassword })
      });
      authUi.busy = false;
      if (r.ok) {
        state.authRecover = false;
        state.authRecoverStep = 1;
        state.authPass = newPassword;
        state.recoveryCode = '';
        state.recoveryNewPass = '';
        authUi.error = '';
        if (r.data?.session && r.data.session.accessToken) {
          await applyServerSession(
            r.data.session,
            r.data.message || '¡Contraseña guardada en tu cuenta! Ya podés iniciar sesión por el campo común cuando quieras.'
          );
          return;
        }
        setBanner(r.data?.message || '¡Contraseña guardada! Ya podés iniciar sesión con tu clave.');
      } else {
        setAuthError(friendlyError(r.data, r.status));
      }
    }

    function openNewWeekModal() {
      const confirmed = state.clients.filter(c => c.confirmationStatus === 'CONFIRMED');
      if (confirmed.length === 0) {
        setBanner('Primero necesitás un cliente con identidad confirmada ("Sí, soy yo") para armarle un plan.', true);
        return;
      }
      if (!state.selectedClientId || !confirmed.some(c => c.id === state.selectedClientId)) {
        state.selectedClientId = confirmed[0].id;
      }
      const clientScheds = state.schedules.filter(s => s.clientId === state.selectedClientId);
      let suggestedMonday = getMondayOf(new Date());
      if (clientScheds.length > 0) {
        const latest = clientScheds[0].weekStartDate;
        suggestedMonday = addDaysIso(latest, 7);
      }
      state.newWeekStart = suggestedMonday;
      state.newWeekTitle = 'Plan Lunes a Viernes · ' + fmtShortDate(suggestedMonday);
      state.newWeekNotes = '';
      state.showNewWeekModal = true;
      render();
    }

    async function submitNewWeek() {
      if (!state.selectedClientId || !state.newWeekStart) return;
      const mondayIso = getMondayOf(new Date(state.newWeekStart + 'T12:00:00Z'));
      const fridayIso = addDaysIso(mondayIso, 4);
      const title = state.newWeekTitle.trim() || ('Semana ' + fmtShortDate(mondayIso));

      const r = await apiFetch('/schedules', {
        method: 'POST',
        body: JSON.stringify({
          clientId: state.selectedClientId,
          weekStartDate: mondayIso,
          weekEndDate: fridayIso,

          summaryNotes: state.newWeekNotes.trim() || undefined
        })
      });

      }

      await hydrateFromApi();

    function handleBlockVideoFileSelected(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      state.blkVideoFile = file;
      state.blkVideoSizeBytes = file.size || 1000000;
      state.blkVideoMime = file.type || 'video/mp4';
      if (!state.blkVideoTitle.trim()) {
        state.blkVideoTitle = (state.blkTitle.trim() || file.name.replace(/\.[^.]+$/, '')).slice(0, 140);
      }
      if (state.blkVideoPreviewUrl && state.blkVideoPreviewUrl.startsWith('blob:')) {
        URL.revokeObjectURL(state.blkVideoPreviewUrl);
      }
      const blobUrl = URL.createObjectURL(file);
      state.blkVideoPreviewUrl = blobUrl;

      const probe = document.createElement('video');
      probe.preload = 'metadata';
      probe.onloadedmetadata = () => {
        if (probe.duration && isFinite(probe.duration)) {
          state.blkVideoDur = Math.max(1, Math.round(probe.duration));
        }
        render();
      };
      probe.src = blobUrl;
      render();
    }

    function uploadFileWithProgress(file, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const form = new FormData();
        form.append('file', file);

        xhr.open('POST', API_BASE + '/videos/upload-file');
        if (state.jwtToken) {
          xhr.setRequestHeader('Authorization', 'Bearer ' + state.jwtToken);
        }

        xhr.upload.onprogress = (ev) => {
          if (ev.lengthComputable) {
            const pctVal = Math.max(5, Math.round((ev.loaded / ev.total) * 100));
            if (onProgress) { onProgress(pctVal); return; }
            state.blkUploadProgress = pctVal;
            const fill = document.getElementById('blk-upload-bar');
            const pct = document.getElementById('blk-upload-pct');
            if (fill) fill.style.width = state.blkUploadProgress + '%';
            if (pct) pct.textContent = state.blkUploadProgress + '%';
          }
        };

        xhr.onload = () => {
          try {
            const parsed = JSON.parse(xhr.responseText || '{}');
            if (xhr.status >= 200 && xhr.status < 300) resolve(parsed);
            else reject(new Error(parsed.message || 'No se pudo subir el archivo de video.'));
          } catch (_) {
            reject(new Error('Respuesta inesperada al subir el video.'));
          }
        };
        xhr.onerror = () => reject(new Error('Error de red subiendo el archivo de video.'));
        xhr.send(form);
      });
    }

    async function submitBlockModal() {
      if (state.blkSaving) return;
      const sched = getActiveSchedule();
      if (!sched) return;

      const blockTitle = state.blkTitle.trim();
      if (!blockTitle) {
        state.blkError = 'Escribí qué contenido se debe subir ese día.';
        render();
        return;
      }

      let inlineVideo = undefined;
      let removeVideo = false;

      if (state.blkAttachVideo) {
        const platforms = [];
        if (state.blkPlatIG) platforms.push('INSTAGRAM');
        if (state.blkPlatTT) platforms.push('TIKTOK');
        if (state.blkPlatYT) platforms.push('YOUTUBE');

        if (platforms.length === 0) {
          state.blkError = 'Seleccioná al menos una plataforma (Instagram, TikTok o YouTube).';
          render();
          return;
        }

        const dur = Math.max(1, parseInt(state.blkVideoDur || 30, 10));
        const mb = state.blkVideoSizeBytes / (1024 * 1024);
        const violation = platforms.find(p => dur > PLATFORM_LIMITS[p].maxSec || mb > PLATFORM_LIMITS[p].maxMb);
        if (violation) {
          const lim = PLATFORM_LIMITS[violation];
          state.blkError = `${lim.name} admite hasta ${lim.maxSec} seg y ${lim.maxMb} MB.`;
          render();
          return;
        }

        state.blkSaving = true;
        state.blkError = '';
        render();

        let storageKey = state.blkExistingStorageKey;
        let finalSize = state.blkVideoSizeBytes;
        let finalMime = state.blkVideoMime || 'video/mp4';

        if (state.blkVideoFile) {
          try {
            state.blkUploadProgress = 8;
            render();
            const uploaded = await uploadFileWithProgress(state.blkVideoFile);
            storageKey = uploaded.storageKey;
            finalSize = uploaded.sizeBytes || finalSize;
            finalMime = uploaded.mimeType || finalMime;
          } catch (e) {
            state.blkSaving = false;
            state.blkUploadProgress = 0;
            state.blkError = e.message || 'No pudimos subir el video.';
            render();
            return;
          }
        } else if (!storageKey) {
          storageKey = `clients/${sched.clientId}/plan_${Date.now()}.mp4`;
        }

        const tags = String(state.blkVideoTags || '')
          .split(/[\s,]+/)
          .map(x => x.replace(/^#/, '').trim())
          .filter(Boolean);

        inlineVideo = {
          storageKey,
          title: (state.blkVideoTitle.trim() || blockTitle).slice(0, 150),
          description: state.blkVideoDesc.trim() || state.blkNotes.trim() || blockTitle,
          hashtags: tags,
          platforms,
          durationSeconds: dur,
          sizeBytes: Math.max(1024, Math.round(finalSize)),
          mimeType: finalMime.includes('webm') && platforms.includes('INSTAGRAM') ? 'video/mp4' : finalMime,
          shareToFeed: state.blkShareFeed,
          allowComments: state.blkAllowComments,
          allowDuetStitch: state.blkAllowDuet,
          madeForKids: false
        };
      } else if (state.editingBlockId) {
        removeVideo = true;
      }

      state.blkSaving = true;
      state.blkError = '';
      render();

      const payload = {
        dayOfWeek: state.blkDay,
        blockTitle,
        noteColor: state.blkColor,
        notes: state.blkNotes.trim() || '',
        plannedTime: state.blkTime || '18:00',
        autoPublish: state.blkAutoPublish,
        ...(inlineVideo ? { inlineVideo } : {}),
        ...(removeVideo ? { removeVideo: true } : {})
      };

      const url = state.editingBlockId
        ? `/schedules/blocks/${state.editingBlockId}`
        : `/schedules/${sched.id}/blocks`;
      const method = state.editingBlockId ? 'PATCH' : 'POST';

      const r = await apiFetch(url, {
        method,
        body: JSON.stringify(payload)
      });

      state.blkSaving = false;
      state.blkUploadProgress = 0;

      if (!r.ok) {
        state.blkError = friendlyError(r.data, r.status);
        render();
        return;
      }

      state.blockModalOpen = false;
      await hydrateFromApi();
      setBanner(
        state.editingBlockId
          ? 'Bloque del plan actualizado correctamente.'
          : (inlineVideo
              ? `Bloque y video guardados para el ${WEEKDAYS.find(w => w.num === state.blkDay)?.full || 'día'} a las ${state.blkTime} hs.`
              : 'Bloque agregado al cronograma semanal.')
      );
    }

        upFile: null, upPreviewUrl: '', upTitle: '', upDesc: '', upTags: '',
        upDur: 30, upSizeBytes: 0, upMime: 'video/mp4',
        upPlatIG: true, upPlatTT: true, upPlatYT: true,
        upMode: 'NOW', upWhen: '', upProgress: 0, upSaving: false, upError: ''
      });
    }

    async function submitIndividualUpload() {
      if (state.upSaving) return;
      const confirmed = state.clients.filter(c => c.confirmationStatus === 'CONFIRMED');
      const clientId = state.upClientId || confirmed[0]?.id;
      const fail = (msg) => { state.upError = msg; render(); };

      if (!clientId) return fail('Primero necesitás un cliente que haya confirmado su cuenta.');
      if (!state.upFile) return fail('Elegí el archivo de video que querés subir.');
      const title = state.upTitle.trim();
      if (!title) return fail('Escribí un título para la publicación.');
      const platforms = [];
      if (state.upPlatIG) platforms.push('INSTAGRAM');
      if (state.upPlatTT) platforms.push('TIKTOK');
      if (state.upPlatYT) platforms.push('YOUTUBE');
      if (platforms.length === 0) return fail('Elegí al menos una red social.');
      const tooLong = platforms.find(p => state.upDur > PLATFORM_LIMITS[p].maxSec);
      if (tooLong) {
        return fail(`El video dura ${state.upDur}s y ${PLATFORM_LIMITS[tooLong].name} admite hasta ${PLATFORM_LIMITS[tooLong].maxSec}s.`);
      }

      let scheduledFor;
      if (state.upMode === 'LATER') {
        if (!state.upWhen) return fail('Elegí la fecha y la hora de publicación.');
        const when = new Date(state.upWhen);
        if (isNaN(when.getTime()) || when.getTime() <= Date.now()) {
          return fail('La fecha de publicación tiene que ser posterior a este momento.');
        }
        scheduledFor = when.toISOString();
      }

      state.upSaving = true;
      state.upError = '';
      state.upProgress = 5;
      render();

      let uploaded;
      try {
        uploaded = await uploadFileWithProgress(state.upFile, (pct) => {
          state.upProgress = pct;
          const fill = document.getElementById('up-progress-bar');
          const lbl = document.getElementById('up-progress-pct');
          if (fill) fill.style.width = pct + '%';
          if (lbl) lbl.textContent = pct + '%';
        });
      } catch (e) {
        state.upSaving = false;
        state.upProgress = 0;
        return fail(e.message || 'No pudimos subir el video.');
      }

      const tags = String(state.upTags || '')
        .split(/[\s,]+/)
        .map(x => x.replace(/^#/, '').trim())
        .filter(Boolean);

      const created = await apiFetch('/videos', {
        method: 'POST',
        body: JSON.stringify({
          clientId,
          title: title.slice(0, 150),
          description: state.upDesc.trim() || title,
          storageKey: uploaded.storageKey,
          durationSeconds: state.upDur,
          sizeBytes: Math.max(1024, Math.round(uploaded.sizeBytes || state.upSizeBytes)),
          mimeType: uploaded.mimeType || state.upMime || 'video/mp4',
          hashtags: tags,
          platformTargets: platforms.map(p => ({ platform: p })),
          publishMode: state.upMode === 'DRAFT' ? 'DRAFT' : 'DIRECT'
        })
      });

      if (!created.ok) {
        state.upSaving = false;
        state.upProgress = 0;
        return fail(friendlyError(created.data, created.status));
      }

      if (state.upMode !== 'DRAFT') {
        const pub = await apiFetch('/publications/publish', {
          method: 'POST',
          body: JSON.stringify({
            videoId: created.data.id,
            ...(scheduledFor ? { scheduledFor } : {}),
            userTimezone: Intl.DateTimeFormat().resolvedOptions().timeZone
          })
        });
        if (!pub.ok) {
          state.upSaving = false;
          state.upProgress = 0;
          return fail('El video se guardó, pero no pudimos programarlo: ' + friendlyError(pub.data, pub.status));
        }
      }

      const mode = state.upMode;
      const whenTxt = scheduledFor ? fmtDateTimeHuman(scheduledFor) : '';
      resetUploadForm();
      await hydrateFromApi();
      setBanner(
        mode === 'DRAFT'
          ? 'Video guardado como borrador.'
          : mode === 'LATER'
            ? `Video programado para el ${whenTxt}.`
            : 'Video enviado a publicar en las redes seleccionadas.'
      );
    }

    async function createClientFromForm() {
      const companyName = (document.getElementById('cl-name')?.value || '').trim();
      const industry = (document.getElementById('cl-ind')?.value || '').trim();
      const fullName = (document.getElementById('cl-contact')?.value || '').trim() || 'Responsable de Marca';
      const email = (document.getElementById('cl-mail')?.value || '').trim();
      const password = (document.getElementById('cl-pass')?.value || '').trim();

      if (!companyName) { setBanner('Ingresá el nombre de la empresa o marca.', true); return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setBanner('Ingresá un correo electrónico válido para el cliente.', true); return; }
      if (password.length < 8) { setBanner('La contraseña inicial del cliente debe tener al menos 8 caracteres.', true); return; }

      const r = await apiFetch('/clients', {
        method: 'POST',
        body: JSON.stringify({ companyName, industry, fullName, email, password })
      });

      if (!r.ok) {
        setBanner(friendlyError(r.data, r.status), true);
        return;
      }

      state.showNewClientForm = false;
      await hydrateFromApi();
      setBanner(
        `Solicitud enviada a ${email}. El perfil de "${companyName}" se activará apenas el cliente presione "Sí, soy yo" en su notificación.`
      );

      state.platModalRefreshToken = '';

    async function startRealPlatformOAuthRedirect() {
      if (state.platModalBusy) return;
      const clientId = state.platModalClientId;
      const platform = String(state.platModalPlatform || '').toLowerCase();
      if (!clientId || !platform) return;
      state.platModalBusy = true;
      state.platModalError = '';
      render();
      const r = await apiFetch(`/platforms/oauth/${platform}/url?clientId=${encodeURIComponent(clientId)}`);
      state.platModalBusy = false;
      if (r.ok && r.data?.url) {
        window.location.href = r.data.url;
        return;
      }
      state.platModalError = friendlyError(r.data, r.status);
      render();
    }

    async function saveManualPlatformConnection() {
      if (state.platModalBusy) return;
      const clientId = state.platModalClientId;
      const platform = state.platModalPlatform;
      const accountHandle = String(state.platModalHandle || '').trim();
      const externalAccountId = String(state.platModalExternalId || '').trim();
      const accessToken = String(state.platModalAccessToken || '').trim();
      const refreshToken = String(state.platModalRefreshToken || '').trim();

      if (!accountHandle) {
        state.platModalError = 'Ingresá el usuario o @handle de la cuenta.';
        render();
        return;
      }
      if (!externalAccountId) {
        state.platModalError = 'Ingresá el ID del canal/cuenta (por ejemplo tu Instagram Business Account ID, Canal de YouTube o TikTok Open ID).';
        render();
        return;
      }
      if (!accessToken || accessToken.length < 10) {
        state.platModalError = 'Pegá el Access Token OAuth 2.0 real de la plataforma para poder publicar videos de verdad.';
        render();
        return;
      }

      state.platModalBusy = true;
      state.platModalError = '';
      render();
      const r = await apiFetch('/platforms/connect', {
        method: 'POST',
        body: JSON.stringify({
          clientId,
          platform,
          accountHandle: accountHandle.startsWith('@') ? accountHandle : '@' + accountHandle,
          externalAccountId,
          accessToken,
          refreshToken: refreshToken || undefined
        })
      });
      state.platModalBusy = false;
      if (!r.ok) {
        state.platModalError = friendlyError(r.data, r.status);
        render();
        return;
      }
      state.platModalOpen = false;
      await hydrateFromApi();
      setBanner(`✓ Cuenta real ${accountHandle} vinculada en ${PLATFORM_LIMITS[platform].name} con cifrado AES-256-GCM.`);
    }

    async function revokePlatformOAuthNow() {
      if (state.platModalBusy) return;
      const clientId = state.platModalClientId;
      const platform = state.platModalPlatform;
      if (!clientId || !platform) return;
      state.platModalBusy = true;
      state.platModalError = '';
      render();
      const r = await apiFetch(`/platforms/${clientId}/${platform}`, { method: 'DELETE' });

        state.platModalError = friendlyError(r.data, r.status);
        render();
        return;
      }
      state.platModalOpen = false;
      await hydrateFromApi();
      setBanner(`Conexión con ${PLATFORM_LIMITS[platform].name} desconectada.`);
    }

    function renderTriConduit(platformsArr, status = 'SCHEDULED', publications = []) {
      const keys = ['INSTAGRAM', 'TIKTOK', 'YOUTUBE'];
      const hasFlow = platformsArr.length > 0 && !['DRAFT', 'REJECTED'].includes(status);
      return `<div class="tri-conduit">` +
        keys.map((k, idx) => {
          const targeted = platformsArr.includes(k);
          const pub = (publications || []).find(p => p.platform === k);
          let cls = 'tri-node';
          if (!targeted) cls += ' off';
          else if (pub && pub.status === 'FAILED') cls += ' fault';
          else if ((pub && pub.status === 'PUBLISHED') || ['APPROVED','SCHEDULED','PUBLISHED'].includes(status)) cls += ' live';
          else cls += ' warn';
          const wire = idx < keys.length - 1 ? `<span class="tri-wire ${hasFlow ? 'flowing' : ''}"></span>` : '';
          return `<span class="${cls}">${PLATFORM_LIMITS[k].code}</span>${wire}`;
        }).join('') +
      `</div>`;
    }
