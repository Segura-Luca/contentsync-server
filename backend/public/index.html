              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">
                <button class="btn btn-signal" onclick="respondClientIdentity('${state.pendingConfirmation.id}', 'ACCEPT')">✓ Sí, soy yo — Activar mi cuenta</button>
                <button class="btn btn-fault" onclick="respondClientIdentity('${state.pendingConfirmation.id}', 'REJECT')">✕ No soy yo — Rechazar</button>
              </div>
            </div>
          </div>
        `;
      }

      const confirmedClients = state.clients.filter(c => c.confirmationStatus === 'CONFIRMED');
      const clientSchedules = state.schedules.filter(s => s.clientId === state.selectedClientId);
      const activeSchedule = getActiveSchedule();
      const items = activeSchedule?.items || [];

      const withVideoCount = items.filter(b => Boolean(b.video)).length;
      const autoCount = items.filter(b => b.video && b.autoPublish).length;
      const clientDupLogs = state.duplicationLogs.filter(
        l => !state.selectedClientId || l.clientId === state.selectedClientId
      );

      return `
        <div class="plan-page">
          <!-- Cabecera Principal -->
          <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--hairline);">
            <div>
              <div class="eyebrow">${isClient ? 'CRONOGRAMA DE CONTENIDO DE TU MARCA' : 'PLANIFICACIÓN SEMANAL DE LUNES A VIERNES'}</div>
              <h2 style="font-size:24px;font-weight:700;margin-top:3px;">
                ${isClient ? 'Plan de publicaciones de la semana' : 'Plan semanal en cuadrícula'}
              </h2>
              <p style="font-size:13px;color:var(--text-secondary);margin-top:3px;">
                ${isClient
                  ? 'Acá podés ver día por día qué contenido se subirá, revisar los videos adjuntos y dejar tu aprobación.'
                  : 'Organizá bloques de colores de lunes a viernes, anexá videos con subida automática en día y hora, o duplicá semanas completas.'}
              </p>
            </div>

            ${!isClient ? `
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-outline" onclick="state.showDuplicationLogs=!state.showDuplicationLogs;render();">
                  📋 Registro de duplicaciones (${clientDupLogs.length})
                </button>
                ${activeSchedule ? `
                  <button class="btn btn-outline" onclick="openDuplicateWeekModal()">
                    ⎘ Duplicar semana
                  </button>
                ` : ''}
                <button class="btn btn-signal" onclick="openNewWeekModal()">
                  + Nueva semana
                </button>
              </div>
            ` : ''}
          </div>

          <!-- Selector de Cliente (Agencia/Admin) -->
          ${!isClient && confirmedClients.length > 0 ? `
            <div class="filter-row">
              <span class="eyebrow" style="margin-right:4px;">CLIENTE:</span>
              ${confirmedClients.map(c => `
                <button class="filter-tab ${state.selectedClientId === c.id ? 'active' : ''}"
                  onclick="state.selectedClientId='${c.id}';syncSelectedScheduleForClient();render();">
                  ${esc(c.companyName)}
                </button>
              `).join('')}
            </div>
          ` : ''}

          <!-- Registro Histórico de Semanas Duplicadas (Desplegable) -->
          ${state.showDuplicationLogs ? `
            <div class="feedback-enter" style="border:1px solid var(--border-strong);background:var(--stage);border-radius:5px;padding:15px;display:flex;flex-direction:column;gap:10px;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                  <span class="eyebrow" style="color:var(--signal-subtle-fg);">HISTORIAL AUDITABLE</span>
                  <h3 style="font-size:16px;font-weight:700;margin-top:2px;">Registro de semanas duplicadas</h3>
                </div>
                <button class="btn btn-outline" style="padding:4px 10px;" onclick="state.showDuplicationLogs=false;render();">Cerrar</button>
              </div>
              ${clientDupLogs.length === 0 ? `
                <div style="font-size:13px;color:var(--text-muted);padding:8px 0;">
                  Todavía no se duplicó ninguna semana para este cliente. Usá el botón «⎘ Duplicar semana» para replicar una estructura semanal y quedará registrada acá.
                </div>
              ` : `
                <div style="display:flex;flex-direction:column;gap:7px;">
                  ${clientDupLogs.map(log => `
                    <div style="border:1px solid var(--hairline);background:var(--canvas);border-radius:4px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
                      <div style="display:flex;flex-direction:column;gap:2px;">
                        <div style="font-size:13px;font-weight:600;">
                          ${esc(log.sourceSchedule?.title || 'Semana origen')}
                          <span style="color:var(--signal-subtle-fg);margin:0 6px;">→</span>
                          ${esc(log.targetSchedule?.title || 'Semana nueva')}
                        </div>
                        <div class="mono" style="font-size:11px;color:var(--text-muted);">
                          ${esc(log.client?.companyName || '')} · ${log.blocksCopiedCount} bloques copiados ${log.includeVideos ? '(con videos)' : '(solo notas)'} · Por ${esc(log.duplicatedByUser?.fullName || 'Agencia')} · ${fmtDateTimeHuman(log.createdAt)}
                        </div>
                        ${log.notes ? `<div style="font-size:12px;color:var(--text-secondary);">${esc(log.notes)}</div>` : ''}
                      </div>
                      ${log.targetSchedule?.id ? `
                        <button class="btn btn-outline" style="padding:5px 10px;"
                          onclick="state.selectedClientId='${log.clientId}';state.selectedScheduleId='${log.targetSchedule.id}';render();">
                          Abrir semana →
                        </button>
                      ` : ''}
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          ` : ''}

          ${confirmedClients.length === 0 && !isClient ? `
            <div style="border:1px solid var(--hairline);background:var(--stage);border-radius:5px;padding:28px;">
              <div class="eyebrow">SIN CLIENTES CONFIRMADOS</div>
              <h3 style="font-size:18px;font-weight:600;margin-top:6px;">Agregá y confirmá un cliente para armar su plan</h3>
              <p style="color:var(--text-secondary);margin-top:6px;max-width:56ch;">
                Dirigite a la sección Clientes para dar de alta una marca. Una vez que el cliente confirme «Sí, soy yo», podrás crearle sus semanas de Lunes a Viernes.
              </p>
              <button class="btn btn-signal" style="margin-top:14px;" onclick="state.activeTab='accounts';render();">Ir a Clientes →</button>
            </div>
          ` : !activeSchedule ? `
            <div style="border:1px solid var(--hairline);background:var(--stage);border-radius:5px;padding:28px;">
              <div class="eyebrow" style="color:var(--signal-subtle-fg);">PLAN SEMANAL</div>
              <h3 style="font-size:18px;font-weight:600;margin-top:6px;">
                ${isClient ? 'Tu agencia aún no publicó un plan para esta semana' : 'Todavía no hay semanas creadas para este cliente'}
              </h3>
              <p style="color:var(--text-secondary);margin-top:6px;max-width:54ch;">
                ${isClient
                  ? 'Te avisaremos apenas tu agencia cargue los bloques y videos de la semana.'
                  : 'Creá la primera semana de Lunes a Viernes para empezar a cargar bloques de colores y programar videos.'}
              </p>
              ${!isClient ? `<button class="btn btn-signal" style="margin-top:14px;" onclick="openNewWeekModal()">+ Crear primera semana →</button>` : ''}
            </div>
          ` : `
            <!-- Barra de Semana Activa + Resumen -->
            <div class="week-toolbar">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <div class="field" style="min-width:260px;">
                  <label>SEMANA SELECCIONADA</label>
                  <select class="input mono" style="padding:7px 10px;font-size:13px;"
                    onchange="state.selectedScheduleId=this.value;render();">
                    ${clientSchedules.map(s => `
                      <option value="${s.id}" ${s.id === activeSchedule.id ? 'selected' : ''}>
                        Lun ${fmtShortDate(s.weekStartDate, 0)} al Vie ${fmtShortDate(s.weekStartDate, 4)} — ${esc(s.title)}
                      </option>
                    `).join('')}
                  </select>
                </div>
                <div>
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <span style="font-weight:700;font-size:16px;">${esc(activeSchedule.title)}</span>
                    ${activeSchedule.duplicatedFrom ? `
                      <span class="badge badge-review" title="Semana creada por duplicación">
                        ⎘ Duplicada de: ${esc(activeSchedule.duplicatedFrom.title)}
                      </span>
                    ` : ''}
                  </div>
                  ${activeSchedule.summaryNotes ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${esc(activeSchedule.summaryNotes)}</div>` : ''}
                </div>
              </div>

              ${!isClient ? `
                <button class="btn btn-signal" onclick="openBlockModal(1, null)">
                  + Agregar bloque con video
                </button>
              ` : ''}
            </div>

            <div class="stats-strip">
              <div class="stat-cell">
                <div class="mono" style="font-size:19px;font-weight:700;">${items.length}</div>
                <div class="eyebrow">BLOQUES EN LA SEMANA</div>
              </div>
              <div class="stat-cell">
                <div class="mono" style="font-size:19px;font-weight:700;color:var(--signal-subtle-fg);">${withVideoCount}</div>
                <div class="eyebrow">VIDEOS ANEXADOS</div>
              </div>
              <div class="stat-cell">
                <div class="mono" style="font-size:19px;font-weight:700;color:var(--tally-live);">${autoCount}</div>
                <div class="eyebrow">SUBIDA AUTOMÁTICA</div>
              </div>
              <div class="stat-cell">
                <div class="mono" style="font-size:19px;font-weight:700;">Lun — Vie</div>
                <div class="eyebrow">${fmtShortDate(activeSchedule.weekStartDate, 0)} AL ${fmtShortDate(activeSchedule.weekStartDate, 4)}</div>
              </div>
            </div>

            <!-- CUADRÍCULA DE LUNES A VIERNES (5 COLUMNAS) -->
            <div class="week-grid">
              ${WEEKDAYS.map((day, idx) => {
                const dayBlocks = items.filter(b => b.dayOfWeek === day.num);
                const dateLabel = fmtShortDate(activeSchedule.weekStartDate, idx);
                return `
                  <section class="day-column" aria-label="${day.full}">
                    <div class="day-col-header">
                      <div>
                        <div class="mono" style="font-weight:700;font-size:13px;color:var(--signal-subtle-fg);">${day.full}</div>
                        <div class="mono" style="font-size:11px;color:var(--text-muted);">${dateLabel}</div>
                      </div>
                      <span class="badge">${dayBlocks.length}</span>
                    </div>

                    <div class="day-blocks-list">
                      ${dayBlocks.length === 0 ? `
                        <div style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px 8px;color:var(--text-muted);font-size:12px;border:1px dashed var(--hairline);border-radius:4px;">
                          Sin bloques cargados para el ${day.full.toLowerCase()}
                        </div>
                      ` : dayBlocks.map(blk => {
                        const v = blk.video;
                        const wf = v ? workflowMeta(v.workflowStatus) : null;
                        const plats = v ? (v.platformTargets || []).map(p => p.platform) : [];
                        const tags = v ? (v.hashtags || []).slice(0, 3).map(h => '#' + h.tag).join(' ') : '';
                        return `
                          <article class="plan-block-card color-${esc(blk.noteColor || 'AMBER')}"
                            onclick="state.inspectBlockId='${blk.id}';state.confirmDeleteBlockId=null;render();">
                            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                              <span class="mono" style="font-size:11px;font-weight:700;color:var(--note-fg);">
                                🕒 ${esc(blk.plannedTime || '18:00')} hs
                              </span>
                              ${v && blk.autoPublish ? `
                                <span class="mono" style="font-size:10px;padding:1px 5px;border-radius:2px;background:var(--tally-live-bg);color:var(--tally-live);border:1px solid var(--tally-live);" title="Se subirá solo este día a la hora configurada">
                                  ⚡ AUTO
                                </span>
                              ` : ''}
                            </div>

                            <div style="font-weight:700;font-size:13.5px;line-height:1.3;color:var(--text-primary);">
                              ${esc(blk.blockTitle)}
                            </div>

                            ${blk.notes ? `
                              <div style="font-size:12px;color:var(--text-secondary);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">
                                ${esc(blk.notes)}
                              </div>
                            ` : ''}

                            ${v ? `
                              <div style="margin-top:4px;padding-top:7px;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:5px;">
                                <div style="display:flex;justify-content:space-between;align-items:center;gap:4px;">
                                  <span class="mono" style="font-size:11px;font-weight:600;color:var(--text-primary);">
                                    🎬 ${fmtTimecode(v.durationSeconds)}
                                  </span>
                                  <span class="badge ${wf.cls}" style="font-size:10px;padding:1px 5px;">${wf.label}</span>
                                </div>
                                ${tags ? `<div class="mono" style="font-size:10.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(tags)}</div>` : ''}
                                <div>${renderTriConduit(plats, v.workflowStatus, v.publications)}</div>
                              </div>
                            ` : `
                              <div class="mono" style="font-size:10.5px;color:var(--text-muted);margin-top:2px;">
                                Nota de pauta (sin video aún)
                              </div>
                            `}
                          </article>
                        `;
                      }).join('')}
                    </div>

                    ${!isClient ? `
                      <div class="day-col-footer">
                        <button class="btn btn-outline" style="width:100%;padding:7px 8px;font-size:11px;"
                          onclick="openBlockModal(${day.num}, null)">
                          + Agregar bloque
                        </button>
                      </div>
                    ` : ''}
                  </section>
                `;
              }).join('')}
            </div>
          `}
        </div>

        ${state.showNewWeekModal ? renderNewWeekModal() : ''}
        ${state.showDuplicateModal ? renderDuplicateWeekModal() : ''}
        ${state.blockModalOpen ? renderBlockEditorModal() : ''}
        ${state.inspectBlockId ? renderBlockInspectorModal() : ''}
      `;
    }

    function renderNewWeekModal() {
      return `
        <div class="modal-backdrop" onclick="if(event.target===this){state.showNewWeekModal=false;render();}">
          <div class="modal-panel" style="max-width:480px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div class="eyebrow">NUEVO CRONOGRAMA</div>
                <h3 style="font-size:18px;font-weight:700;">Crear semana de Lunes a Viernes</h3>
              </div>
              <button class="btn btn-outline" style="padding:4px 9px;" onclick="state.showNewWeekModal=false;render();">✕</button>
            </div>

            <div class="field">
              <label>Fecha del lunes de inicio</label>
              <input class="input mono" type="date" value="${esc(state.newWeekStart)}"
                onchange="state.newWeekStart=this.value;render();" />
            </div>

            <div class="field">
              <label>Título de la semana</label>
              <input class="input" placeholder="Ej. Semana Lanzamiento Temporada" value="${esc(state.newWeekTitle)}"
                oninput="state.newWeekTitle=this.value" />
            </div>

            <div class="field">
              <label>Objetivo o nota general para el cliente (opcional)</label>
              <textarea class="input" rows="2" placeholder="Ej. Foco en videos educativos cortos y promoción del viernes."
                oninput="state.newWeekNotes=this.value">${esc(state.newWeekNotes)}</textarea>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:10px;">
              <button class="btn btn-outline" onclick="state.showNewWeekModal=false;render();">Cancelar</button>
              <button class="btn btn-signal" onclick="submitNewWeek()">Crear semana →</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderDuplicateWeekModal() {
      const sched = getActiveSchedule();
      if (!sched) return '';
      return `
        <div class="modal-backdrop" onclick="if(event.target===this){state.showDuplicateModal=false;render();}">
          <div class="modal-panel" style="max-width:520px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div class="eyebrow">DUPLICAR SEMANA CON REGISTRO</div>
                <h3 style="font-size:18px;font-weight:700;">Duplicar «${esc(sched.title)}»</h3>
              </div>
              <button class="btn btn-outline" style="padding:4px 9px;" onclick="state.showDuplicateModal=false;render();">✕</button>
            </div>

            <p style="font-size:13px;color:var(--text-secondary);">
              Se copiarán los <strong>${(sched.items || []).length} bloques</strong> de Lunes a Viernes con sus colores, notas y horarios hacia la nueva semana, dejando constancia en el registro de duplicaciones.
            </p>

            <div class="field">
              <label>Lunes de la semana destino</label>
              <input class="input mono" type="date" value="${esc(state.dupTargetStart)}"
                onchange="state.dupTargetStart=this.value;render();" />
            </div>

            <div class="field">
              <label>Nombre para la nueva semana</label>
              <input class="input" value="${esc(state.dupTitle)}" oninput="state.dupTitle=this.value" />
            </div>

            <label style="display:flex;align-items:flex-start;gap:9px;cursor:pointer;padding:10px 12px;border:1px solid var(--hairline);background:var(--canvas);border-radius:4px;">
              <input type="checkbox" style="margin-top:3px;" ${state.dupIncludeVideos ? 'checked' : ''}
                onchange="state.dupIncludeVideos=this.checked;render();" />
              <div>
                <div style="font-weight:600;font-size:13px;">Copiar también los videos anexados y configuraciones</div>
                <div style="font-size:12px;color:var(--text-muted);">Si lo desmarcás, se copiarán únicamente los bloques de colores, textos y horarios vacíos para subir videos nuevos.</div>
              </div>
            </label>

            <div class="field">
              <label>Nota para el registro de duplicaciones</label>
              <input class="input" value="${esc(state.dupNotes)}" oninput="state.dupNotes=this.value" placeholder="Motivo o detalle del duplicado..." />
            </div>

            <div style="display:flex;justify-content:flex-end;gap:10px;">
              <button class="btn btn-outline" onclick="state.showDuplicateModal=false;render();">Cancelar</button>
              <button class="btn btn-signal" onclick="submitDuplicateWeek()">⎘ Confirmar y duplicar semana</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderBlockEditorModal() {
      const dur = Math.max(1, parseInt(state.blkVideoDur || 30, 10));
      const mb = (state.blkVideoSizeBytes / (1024 * 1024)).toFixed(1);

      return `
        <div class="modal-backdrop" onclick="if(event.target===this && !state.blkSaving){state.blockModalOpen=false;render();}">
          <div class="modal-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--hairline);">
              <div>
                <div class="eyebrow">${state.editingBlockId ? 'EDITAR BLOQUE DEL PLAN' : 'NUEVO BLOQUE EN CUADRÍCULA'}</div>
                <h3 style="font-size:19px;font-weight:700;">
                  ${state.editingBlockId ? 'Configurar bloque y video del día' : 'Agregar bloque al día'}
                </h3>
              </div>
              <button class="btn btn-outline" style="padding:4px 9px;" ${state.blkSaving ? 'disabled' : ''} onclick="state.blockModalOpen=false;render();">✕</button>
            </div>

            <!-- Día y Hora -->
            <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:12px;">
              <div class="field">
                <label>Día de la semana (Lunes a Viernes)</label>
                <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px;">
                  ${WEEKDAYS.map(d => `
                    <button type="button" class="filter-tab ${state.blkDay === d.num ? 'active' : ''}"
                      style="padding:8px 0;text-align:center;"
                      onclick="state.blkDay=${d.num};render();">
                      ${d.code}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="field">
                <label>Hora configurada</label>
                <input class="input mono" type="time" value="${esc(state.blkTime)}"
                  oninput="state.blkTime=this.value" />
              </div>
            </div>

            <!-- Color de la Nota -->
            <div class="field">
              <label>Color del bloque</label>
              <div class="swatch-row">
                ${NOTE_COLORS.map(c => `
                  <button type="button" class="swatch-btn color-${c.code} ${state.blkColor === c.code ? 'active' : ''}"
                    onclick="state.blkColor='${c.code}';render();">
                    <span class="swatch-dot"></span>
                    <span>${c.label}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Texto del Bloque -->
            <div class="field">
              <label>¿Qué se debe subir este día? (Título del bloque)</label>
              <input class="input" placeholder="Ej. Reel educativo: 3 claves para elegir grano de café"
                value="${esc(state.blkTitle)}" oninput="state.blkTitle=this.value" />
            </div>

            <div class="field">
              <label>Notas e indicaciones del bloque (visible para el cliente)</label>
              <textarea class="input" rows="2" placeholder="Detalle de la idea, gancho visual, llamada a la acción o recordatorios..."
                oninput="state.blkNotes=this.value">${esc(state.blkNotes)}</textarea>
            </div>

            <!-- Anexar / Subir Video desde la sección Plan -->
            <div style="border:1px solid ${state.blkAttachVideo ? 'var(--signal-subtle-fg)' : 'var(--border-strong)'};background:var(--inspector);border-radius:5px;padding:14px;display:flex;flex-direction:column;gap:12px;">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
                <div>
                  <div style="font-weight:700;font-size:14px;">🎬 Video para publicar este día</div>
                  <div style="font-size:12px;color:var(--text-secondary);">
                    Subí el video directamente acá y dejalo configurado para publicarse solo el ${WEEKDAYS.find(w => w.num === state.blkDay)?.full || 'día'} a las ${esc(state.blkTime)} hs.
                  </div>
                </div>
                <button type="button" class="btn ${state.blkAttachVideo ? 'btn-fault' : 'btn-signal'}"
                  onclick="state.blkAttachVideo=!state.blkAttachVideo;render();">
                  ${state.blkAttachVideo ? 'Quitar video' : '+ Anexar / Subir video'}
                </button>
              </div>

              ${state.blkAttachVideo ? `
                <label class="dropzone-video">
                  <input type="file" accept="video/mp4,video/quicktime,video/webm" style="display:none;"
                    onchange="handleBlockVideoFileSelected(this)" />
                  <div style="font-weight:600;color:var(--signal-subtle-fg);">
                    ${state.blkVideoFile
                      ? '✓ Archivo seleccionado: ' + esc(state.blkVideoFile.name) + ' (' + mb + ' MB · ' + dur + 's)'
                      : (state.blkExistingStorageKey
                          ? '✓ Video actual vinculado · Hacé clic si querés reemplazar el archivo'
                          : '📂 Hacé clic acá para elegir un archivo de video (.mp4 / .mov) desde tu equipo')}
                  </div>
                  <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">
                    Detectamos duración y tamaño automáticamente para validar Instagram, TikTok y YouTube.
                  </div>
                </label>

                ${state.blkVideoPreviewUrl ? `

                ` : ''}

                      { key: 'TIKTOK',    prop: 'blkPlatTT' },
                      { key: 'YOUTUBE',   prop: 'blkPlatYT' }
                    ].map(p => {
                      const active = state[p.prop];
                      const lim = PLATFORM_LIMITS[p.key];
                      const ok = dur <= lim.maxSec;
                      return `
                        <button type="button" style="padding:9px 10px;border-radius:4px;text-align:left;background:var(--canvas);border:1px solid ${active ? (ok ? 'var(--tally-live)' : 'var(--tally-fault)') : 'var(--hairline)'};"

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                  <div class="field">

                    <input class="input" placeholder="Título para la publicación" value="${esc(state.blkVideoTitle)}"

                  </div>
                  <div class="field">
                    <label>Hashtags</label>
                    <input class="input mono" placeholder="#marca #reels #shorts" value="${esc(state.blkVideoTags)}"
                      oninput="state.blkVideoTags=this.value" />
                  </div>
                </div>

                <div class="field">
                  <label>Descripción / Texto de la publicación</label>
                  <textarea class="input" rows="2" placeholder="Escribí el copy que saldrá publicado en las redes seleccionadas..."
                    oninput="state.blkVideoDesc=this.value">${esc(state.blkVideoDesc)}</textarea>
                </div>

                <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);">
                  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                    <input type="checkbox" ${state.blkShareFeed ? 'checked' : ''} onchange="state.blkShareFeed=this.checked" />

                  </label>
                  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                    <input type="checkbox" ${state.blkAllowComments ? 'checked' : ''} onchange="state.blkAllowComments=this.checked" />

                  </label>
                  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                    <input type="checkbox" ${state.blkAllowDuet ? 'checked' : ''} onchange="state.blkAllowDuet=this.checked" />

                  </label>
                </div>

              <div style="border:1px solid var(--signal-subtle-fg);background:var(--signal-subtle-bg);padding:10px 12px;border-radius:4px;">
                <div class="mono" style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--signal-subtle-fg);">
                  <span>SUBIENDO ARCHIVO DE VIDEO...</span>
                  <span id="blk-upload-pct">${state.blkUploadProgress}%</span>
                </div>
                <div style="height:5px;background:var(--hairline);margin-top:6px;border-radius:2px;overflow:hidden;">
                  <div id="blk-upload-bar" class="s3-progress-fill" style="width:${state.blkUploadProgress}%;"></div>
                </div>
              </div>
            ` : ''}

            ${state.blkError ? `
              <div role="alert" style="border:1px solid var(--tally-fault);background:var(--tally-fault-bg);color:var(--tally-fault);padding:10px 12px;border-radius:4px;font-size:13px;">
                ${esc(state.blkError)}
              </div>
            ` : ''}

            <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:6px;border-top:1px solid var(--hairline);">
              <button class="btn btn-outline" ${state.blkSaving ? 'disabled' : ''} onclick="state.blockModalOpen=false;render();">Cancelar</button>
              <button class="btn btn-signal" ${state.blkSaving ? 'disabled' : ''} onclick="submitBlockModal()">
                ${state.blkSaving ? 'Guardando…' : (state.editingBlockId ? 'Guardar cambios del bloque' : 'Guardar bloque en el Plan →')}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderBlockInspectorModal() {
      const sched = getActiveSchedule();
      const blk = (sched?.items || []).find(x => x.id === state.inspectBlockId);
      if (!blk) {
        state.inspectBlockId = null;
        return '';
      }
      const isClient = state.session.role === 'CLIENTE';
      const dayObj = WEEKDAYS.find(d => d.num === blk.dayOfWeek) || { full: 'Día', num: 1 };
      const dateStr = sched ? fmtShortDate(sched.weekStartDate, blk.dayOfWeek - 1) : '';
      const v = blk.video;
      const wf = v ? workflowMeta(v.workflowStatus) : null;
      const plats = v ? (v.platformTargets || []).map(p => p.platform) : [];
      const hasPlayableUpload = v && v.publicVideoUrl && v.publicVideoUrl.startsWith('/uploads/');

      return `
        <div class="modal-backdrop" onclick="if(event.target===this){state.inspectBlockId=null;render();}">
          <div class="modal-panel">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--hairline);">
              <div>
                <div class="mono" style="font-size:12px;font-weight:700;color:var(--signal-subtle-fg);">
                  ${dayObj.full.toUpperCase()} ${dateStr} · ${esc(blk.plannedTime || '18:00')} HS
                </div>
                <h3 style="font-size:20px;font-weight:700;margin-top:3px;">${esc(blk.blockTitle)}</h3>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                ${wf ? `<span class="badge ${wf.cls}">${wf.label}</span>` : `<span class="badge">NOTA DE PAUTA</span>`}
                <button class="btn btn-outline" style="padding:4px 9px;" onclick="state.inspectBlockId=null;render();">✕</button>
              </div>
            </div>

            ${blk.notes ? `
              <div class="color-${esc(blk.noteColor || 'AMBER')}" style="border-left:4px solid var(--note-fg);background:var(--note-bg);padding:12px 14px;border-radius:4px;">
                <div class="eyebrow" style="color:var(--note-fg);margin-bottom:4px;">PAUTA DEL DÍA</div>
                <div style="font-size:14px;line-height:1.5;white-space:pre-wrap;">${esc(blk.notes)}</div>
              </div>
            ` : ''}

            ${v ? `
              <div style="border:1px solid var(--hairline);background:var(--inspector);border-radius:5px;padding:14px;display:flex;flex-direction:column;gap:12px;">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                  <div>
                    <div class="eyebrow">VIDEO CONFIGURADO</div>
                    <div style="font-weight:700;font-size:16px;margin-top:2px;">${esc(v.title)}</div>
                  </div>
                  ${renderTriConduit(plats, v.workflowStatus, v.publications)}
                </div>

                ${hasPlayableUpload ? `
                  <div style="background:#000;border-radius:4px;overflow:hidden;display:flex;justify-content:center;max-height:280px;">
                    <video src="${esc(v.publicVideoUrl)}" controls style="max-height:280px;max-width:100%;"></video>
                  </div>
                ` : `
                  <div style="display:flex;gap:14px;align-items:center;">
                    <div class="reel-frame" style="width:68px;background:${reelBg(v.title)};">
                      <span class="reel-tag">9:16</span>
                      <span class="reel-tag" style="align-self:flex-end;">${fmtTimecode(v.durationSeconds)}</span>
                    </div>
                    <div style="flex:1;display:flex;flex-direction:column;gap:5px;">
                      <div style="font-size:13.5px;color:var(--text-secondary);line-height:1.45;">${esc(v.description)}</div>
                      <div class="mono" style="font-size:12px;color:var(--text-muted);">
                        ${(v.hashtags || []).map(h => '#' + esc(h.tag)).join(' ')}
                      </div>
                    </div>
                  </div>
                `}

                ${hasPlayableUpload ? `
                  <div style="font-size:13.5px;color:var(--text-secondary);line-height:1.45;">${esc(v.description)}</div>
                  <div class="mono" style="font-size:12px;color:var(--text-muted);">
                    ${(v.hashtags || []).map(h => '#' + esc(h.tag)).join(' ')}
                  </div>
                ` : ''}

                <div style="font-size:12.5px;color:${blk.autoPublish ? 'var(--tally-live)' : 'var(--text-secondary)'};font-weight:600;">
                  ${blk.autoPublish
                    ? `⚡ Subida automática activada para el ${dayObj.full} ${dateStr} a las ${esc(blk.plannedTime)} hs en ${plats.map(p => PLATFORM_LIMITS[p].name).join(', ')}.`
                    : 'Subida manual sujeta a confirmación.'}
                </div>

                <!-- Comentarios del Video -->
                ${(v.comments || []).length > 0 ? `
                  <div style="border-top:1px solid var(--hairline);padding-top:10px;display:flex;flex-direction:column;gap:6px;">
                    <div class="eyebrow">COMENTARIOS</div>
                    ${v.comments.map(c => `
                      <div style="border-left:2px solid var(--signal-subtle-fg);padding-left:9px;font-size:13px;">
                        <span class="mono" style="font-size:11px;color:var(--text-muted);">${esc(c.authorUser?.fullName || 'Usuario')}:</span>
                        <div>${esc(c.message)}</div>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}

                <!-- Controles de Visado / Comentarios -->
                ${v.workflowStatus !== 'PUBLISHED' ? `
                  <div style="border-top:1px solid var(--hairline);padding-top:10px;display:flex;flex-direction:column;gap:8px;">
                    <div class="field">
                      <label>${isClient ? 'Dejar observación o aprobar este video' : 'Agregar nota sobre el video'}</label>
                      <div style="display:flex;gap:8px;">
                        <input id="inspect-review-note" class="input" placeholder="Escribí un comentario o sugerencia..." />
                        <button class="btn btn-outline" onclick="submitVideoComment('${v.id}')">Comentar</button>
                      </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;">
                      <button class="btn btn-signal" onclick="submitVideoReview('${v.id}','APPROVED')">✓ Aprobar contenido</button>
                      <button class="btn btn-warn" onclick="submitVideoReview('${v.id}','CHANGES_REQUESTED')">Pedir ajustes</button>
                      <button class="btn btn-fault" onclick="submitVideoReview('${v.id}','REJECTED')">Rechazar</button>
                    </div>
                  </div>
                ` : ''}

                ${!isClient && v.workflowStatus !== 'PUBLISHED' ? `
                  <div style="display:flex;justify-content:flex-end;">
                    <button class="btn btn-live" onclick="publishVideoNow('${v.id}')">
                      Publicar ahora mismo en ${plats.length} ${plats.length === 1 ? 'red' : 'redes'} →
                    </button>
                  </div>
                ` : ''}
              </div>
            ` : `
              <div style="border:1px dashed var(--border-strong);border-radius:4px;padding:16px;text-align:center;color:var(--text-secondary);font-size:13px;">
                ${isClient
                  ? 'Tu agencia dejó pautado este tema para el día, y anexará el video correspondiente próximamente.'
                  : 'Este bloque aún no tiene un archivo de video anexado.'}
              </div>
            `}

            ${!isClient ? `
              <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--hairline);flex-wrap:wrap;gap:8px;">
                ${state.confirmDeleteBlockId === blk.id ? `
                  <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:12px;color:var(--tally-fault);font-weight:600;">¿Eliminar este bloque?</span>
                    <button class="btn btn-fault" style="padding:5px 10px;" onclick="deleteBlockConfirmed('${blk.id}')">Sí, eliminar</button>
                    <button class="btn btn-outline" style="padding:5px 10px;" onclick="state.confirmDeleteBlockId=null;render();">Cancelar</button>
                  </div>
                ` : `
                  <button class="btn btn-fault" onclick="state.confirmDeleteBlockId='${blk.id}';render();">Eliminar bloque</button>
                `}
                <button class="btn btn-signal" onclick='openBlockModal(${blk.dayOfWeek}, ${JSON.stringify(blk).replace(/'/g, "&#39;")})'>
                  ${v ? 'Editar bloque / Cambiar video' : '+ Subir video o editar bloque'}
                </button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // PANTALLA 2: IDEAS DE CONTENIDO (PRIVADA DE LA AGENCIA, SECCIONES, FILTROS)
    // =========================================================================
    function renderIdeasScreen() {
      const confirmedClients = state.clients.filter(c => c.confirmationStatus === 'CONFIRMED');
      const q = state.ideaSearch.trim().toLowerCase();

      const filteredIdeas = state.ideas.filter(idea => {
        const matchSec = state.ideaSectionFilter === 'ALL' || idea.sectionId === state.ideaSectionFilter;
        const matchCl =
          state.ideaClientFilter === 'ALL' ||
          (state.ideaClientFilter === 'GENERAL' && !idea.clientId) ||
          idea.clientId === state.ideaClientFilter;
        const matchQ =
          !q ||
          idea.title.toLowerCase().includes(q) ||
          idea.content.toLowerCase().includes(q) ||
          (idea.section?.name || '').toLowerCase().includes(q);
        return matchSec && matchCl && matchQ;
      });

      const activeSectionObj = state.ideaSections.find(s => s.id === state.ideaSectionFilter) || null;

      return `
        <div class="page-pad" style="display:flex;flex-direction:column;gap:18px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--hairline);">
            <div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="eyebrow">BANCO CREATIVO</span>
                <span class="badge badge-review">🔒 PRIVADO DE TU AGENCIA</span>
              </div>
              <h2 style="font-size:24px;font-weight:700;margin-top:4px;">Ideas de contenido</h2>
              <p style="font-size:13px;color:var(--text-secondary);margin-top:3px;">
                Guardá guiones, ganchos y formatos divididos en tus propias secciones (Entretenimiento, Educativo, Venta y más). Tus clientes nunca ven este espacio.
              </p>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-outline" onclick="state.showNewSectionForm=!state.showNewSectionForm;render();">
                ${state.showNewSectionForm ? 'Cerrar' : '+ Nueva sección'}
              </button>
              <button class="btn btn-signal" onclick="openIdeaModal(null)">
                + Nueva idea
              </button>
            </div>
          </div>

          <!-- Formulario rápido para crear Sección personalizada -->
          ${state.showNewSectionForm ? `
            <div class="feedback-enter" style="border:1px solid var(--border-strong);background:var(--stage);border-radius:5px;padding:15px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;">
              <div class="field" style="flex:1;min-width:210px;">
                <label>Nombre de la nueva sección</label>
                <input class="input" placeholder="Ej. Tendencias, Testimonios, Detrás de escena..."
                  value="${esc(state.newSectionName)}" oninput="state.newSectionName=this.value" />
              </div>
              <div class="field">
                <label>Color identificatorio</label>
                <div class="swatch-row">
                  ${NOTE_COLORS.map(c => `
                    <button type="button" class="swatch-btn color-${c.code} ${state.newSectionColor === c.code ? 'active' : ''}"
                      onclick="state.newSectionColor='${c.code}';render();">
                      <span class="swatch-dot"></span> ${c.label}
                    </button>
                  `).join('')}
                </div>
              </div>
              <button class="btn btn-signal" onclick="submitNewIdeaSection()">Guardar sección</button>
            </div>
          ` : ''}

          <!-- Pestañas de Secciones Creadas por la Agencia -->
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
            <div class="filter-row">
              <button class="filter-tab ${state.ideaSectionFilter === 'ALL' ? 'active' : ''}"
                onclick="state.ideaSectionFilter='ALL';state.confirmDeleteSectionId=null;render();">
                Todas (${state.ideas.length})
              </button>
              ${state.ideaSections.map(sec => {
                const count = state.ideas.filter(i => i.sectionId === sec.id).length;
                return `
                  <button class="filter-tab ${state.ideaSectionFilter === sec.id ? 'active' : ''}"
                    onclick="state.ideaSectionFilter='${sec.id}';state.confirmDeleteSectionId=null;render();">
                    ${esc(sec.name)} (${count})
                  </button>
                `;
              }).join('')}
            </div>

            ${activeSectionObj ? (
              state.confirmDeleteSectionId === activeSectionObj.id ? `
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-size:12px;color:var(--tally-fault);">¿Eliminar sección «${esc(activeSectionObj.name)}» y sus ideas?</span>
                  <button class="btn btn-fault" style="padding:4px 9px;" onclick="deleteIdeaSectionConfirmed('${activeSectionObj.id}')">Sí, eliminar</button>
                  <button class="btn btn-outline" style="padding:4px 9px;" onclick="state.confirmDeleteSectionId=null;render();">No</button>
                </div>
              ` : `
                <button class="btn btn-outline" style="padding:5px 10px;font-size:11px;"
                  onclick="state.confirmDeleteSectionId='${activeSectionObj.id}';render();">
                  Eliminar sección «${esc(activeSectionObj.name)}»
                </button>
              `
            ) : ''}
          </div>

          <!-- Buscador y Filtro por Marca -->
          <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:10px;">
            <input class="input" placeholder="Buscar ideas por título, palabra clave o guion..."
              value="${esc(state.ideaSearch)}" oninput="state.ideaSearch=this.value;render();" />
            <select class="input" onchange="state.ideaClientFilter=this.value;render();">
              <option value="ALL" ${state.ideaClientFilter === 'ALL' ? 'selected' : ''}>Todas las marcas y generales</option>
              <option value="GENERAL" ${state.ideaClientFilter === 'GENERAL' ? 'selected' : ''}>Solo ideas generales de la agencia</option>
              ${confirmedClients.map(c => `
                <option value="${c.id}" ${state.ideaClientFilter === c.id ? 'selected' : ''}>Marca: ${esc(c.companyName)}</option>
              `).join('')}

          </div>

          ${filteredIdeas.length === 0 ? `
            <div style="border:1px solid var(--hairline);background:var(--stage);border-radius:5px;padding:28px;text-align:center;">
              <div style="font-weight:600;font-size:16px;">No hay ideas que coincidan con este filtro</div>
              <p style="color:var(--text-secondary);font-size:13px;margin-top:4px;">
                Agregá una nueva idea en segundos o limpiá los filtros activos.
              </p>
              <div style="margin-top:12px;display:flex;justify-content:center;gap:8px;">
                <button class="btn btn-outline" onclick="state.ideaSectionFilter='ALL';state.ideaClientFilter='ALL';state.ideaSearch='';render();">Ver todas</button>
                <button class="btn btn-signal" onclick="openIdeaModal(null)">+ Guardar idea</button>
              </div>
            </div>
          ` : `
            <div class="ideas-grid">
              ${filteredIdeas.map(idea => {
                const secColor = idea.section?.color || 'LIME';
                const plats = String(idea.platforms || '').split(',').filter(Boolean);
                return `
                  <article class="idea-card color-${esc(secColor)}">
                    <div style="display:flex;flex-direction:column;gap:8px;">
                      <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                        <span class="badge" style="color:var(--note-fg);border-color:var(--note-fg);background:var(--note-bg);">
                          ${esc(idea.section?.name || 'Sección')}
                        </span>
                        <button class="btn btn-outline" style="padding:3px 7px;font-size:11px;"
                          title="${idea.isPinned ? 'Quitar fijado' : 'Fijar arriba'}"

                          ${idea.isPinned ? '📌 Fijada' : '☆ Fijar'}
                        </button>
                      </div>

                      <h3 style="font-size:16px;font-weight:700;line-height:1.3;">${esc(idea.title)}</h3>
                      <p style="font-size:13px;color:var(--text-secondary);line-height:1.48;white-space:pre-wrap;">${esc(idea.content)}</p>

                      ${idea.referenceUrl ? `
                        <a href="${esc(idea.referenceUrl)}" target="_blank" rel="noopener noreferrer"
                           style="font-size:12px;color:var(--signal-subtle-fg);text-decoration:underline;word-break:break-all;">
                          🔗 Ver referencia
                        </a>
                      ` : ''}
                    </div>

                    <div style="padding-top:10px;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:8px;">
                      <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-muted);" class="mono">
                        <span>${idea.client ? esc(idea.client.companyName) : 'General Agencia'}</span>
                        <span>${plats.map(p => PLATFORM_LIMITS[p]?.code || p).join(' · ')}</span>
                      </div>

                      ${state.confirmDeleteIdeaId === idea.id ? `
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--tally-fault-bg);padding:6px 8px;border-radius:4px;">
                          <span style="font-size:12px;color:var(--tally-fault);font-weight:600;">¿Eliminar idea?</span>
                          <div style="display:flex;gap:6px;">
                            <button class="btn btn-fault" style="padding:4px 8px;" onclick="deleteIdeaConfirmed('${idea.id}')">Sí</button>
                            <button class="btn btn-outline" style="padding:4px 8px;" onclick="state.confirmDeleteIdeaId=null;render();">No</button>
                          </div>
                        </div>
                      ` : `
                        <div style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;">
                          <button class="btn btn-signal" style="padding:5px 9px;font-size:11px;"
                            onclick="sendIdeaToPlan('${idea.id}')">

            <div style="border-top:1px solid var(--hairline);padding-top:10px;display:grid;gap:6px;" class="mono">
              <div style="display:flex;justify-content:space-between;font-size:12px;"><span style="color:var(--text-muted);">CORREO</span><span>${esc(s.email)}</span></div>
              <div style="display:flex;justify-content:space-between;font-size:12px;"><span style="color:var(--text-muted);">JERARQUÍA</span><span>${esc(s.role)}</span></div>
            </div>
          </div>

          <div style="border:1px solid var(--hairline);background:var(--stage);border-radius:5px;padding:18px;display:flex;flex-direction:column;gap:10px;">
            <div class="eyebrow">APARIENCIA</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn ${state.theme === 'dark' ? 'btn-signal' : 'btn-outline'}" onclick="setTheme('dark')">Tema oscuro</button>
              <button class="btn ${state.theme === 'light' ? 'btn-signal' : 'btn-outline'}" onclick="setTheme('light')">Tema claro</button>
            </div>
          </div>

          <button class="btn btn-fault" style="align-self:flex-start;height:42px;" onclick="logoutSession()">
            Cerrar sesión
          </button>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      const bannerKey = state.banner ? state.banner.msg : null;
      motionState.animateBanner = Boolean(bannerKey && bannerKey !== motionState.lastBanner);
      motionState.lastBanner = bannerKey;

      if (!state.session) {
        motionState.lastTab = null;
        root.innerHTML = renderTopBar() + renderAuthGate();
        initSocialProviders();
        return;
      }

      const dests = allowedDestinations();
      if (!dests.some(d => d.id === state.activeTab)) {
        state.activeTab = dests[0].id;
      }

      motionState.animateStage = motionState.lastTab !== state.activeTab;
      motionState.lastTab = state.activeTab;

      let activeView = '';
      if (state.activeTab === 'schedules') activeView = renderSchedulesScreen();
      else if (state.activeTab === 'upload') activeView = renderUploadScreen();
      else if (state.activeTab === 'ideas') activeView = renderIdeasScreen();
      else if (state.activeTab === 'accounts') activeView = renderAccountsScreen();
      else if (state.activeTab === 'history') activeView = renderHistoryScreen();
      else activeView = renderSettingsScreen();

      root.innerHTML = `
        ${renderTopBar()}
        <div class="studio-shell">
          <nav class="side-rail" aria-label="Navegación Principal">
            <div>
              ${dests.map(d => `
                <button class="rail-item ${state.activeTab === d.id ? 'active' : ''}" onclick="state.activeTab='${d.id}';render();">
                  <span class="mono" style="font-size:11px;opacity:0.7;">${d.code}</span>
                  <span>${d.label}</span>
                </button>
              `).join('')}
            </div>
          </nav>

          <main class="workspace-content ${motionState.animateStage ? 'stage-enter' : ''}">
            ${activeView}
          </main>
        </div>

        <nav class="bottom-bar" aria-label="Navegación Móvil">
          ${dests.map(d => `
            <button class="bottom-item ${state.activeTab === d.id ? 'active' : ''}" onclick="state.activeTab='${d.id}';render();">
              <span>${d.code}</span>
              <span>${d.label}</span>
            </button>
          `).join('')}
        </nav>
      `;
    }

    // Inicialización + restauración de sesión activa + retorno desde email "Sí, soy yo"
    (async function bootStudio() {
      const q = new URLSearchParams(window.location.search);
      const theme = q.get('theme');
      if (theme === 'light' || theme === 'dark') {
        state.theme = theme;
        document.documentElement.setAttribute('data-theme', theme);
      }

      const socialSession = q.get('social_session');
      const socialError = q.get('social_error');
      if (socialSession) {
        try {
          const b64 = socialSession.replace(/-/g, '+').replace(/_/g, '/');
          const pad = b64 + '==='.slice((b64.length + 3) % 4);
          const jsonStr = decodeURIComponent(
            Array.prototype.map
              .call(atob(pad), (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
              .join('')
          );
          const parsed = JSON.parse(jsonStr);
          window.history.replaceState({}, '', window.location.pathname);
          if (parsed && parsed.accessToken) {
            await applyServerSession(parsed, '¡Sesión iniciada con éxito!');
            return;
          }
        } catch (_) {}
      }
      if (socialError) {
        window.history.replaceState({}, '', window.location.pathname);
        authUi.error = socialError;
      }

      const platConnected = q.get('platform_connected');
      const platHandle = q.get('handle') || '';
      const platError = q.get('platform_error');
      if (platConnected) {
        state.activeTab = 'accounts';
        state.banner = {
          msg: `✓ Cuenta oficial ${platHandle} vinculada con éxito en ${PLATFORM_LIMITS[platConnected]?.name || platConnected}.`,
          isErr: false
        };
        window.history.replaceState({}, '', window.location.pathname);
      } else if (platError) {
        state.activeTab = 'accounts';
        state.banner = {
          msg: platError,
          isErr: true
        };
        window.history.replaceState({}, '', window.location.pathname);
      }

      const inv = q.get('invitation');
      const company = q.get('company') || 'la marca';
      if (inv === 'confirmed') {
        state.banner = {
          msg: `✓ ¡Confirmaste «Sí, soy yo»! Tu cuenta de cliente para ${company} ya está activa. Iniciá sesión para ver tu Plan Semanal.`,
          isErr: false
        };
        window.history.replaceState({}, '', window.location.pathname);
      } else if (inv === 'rejected') {
        state.banner = {
          msg: `Rechazaste la solicitud de vinculación para ${company}. Tu correo fue desvinculado por seguridad.`,
          isErr: true
        };
        window.history.replaceState({}, '', window.location.pathname);
      } else if (inv === 'invalid') {
        state.banner = {
          msg: 'Ese enlace de confirmación ya fue utilizado o expiró.',
          isErr: true
        };
        window.history.replaceState({}, '', window.location.pathname);
      }

      try {
        const savedJwt = localStorage.getItem('cs_jwt') || sessionStorage.getItem('cs_jwt');
        const savedUser = localStorage.getItem('cs_user') || sessionStorage.getItem('cs_user');
        if (savedJwt && savedUser) {
          state.jwtToken = savedJwt;
          state.session = JSON.parse(savedUser);
          render();
          await hydrateFromApi();
          return;
        }
      } catch (_) {}

      render();
    })();
  </script>
</body>
</html>
